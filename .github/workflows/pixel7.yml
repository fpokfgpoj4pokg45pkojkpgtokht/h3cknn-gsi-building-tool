          grep -E \
            '^(ro.product.brand|ro.product.manufacturer|ro.product.model|ro.product.device|ro.product.name|ro.product.board|ro.board.platform|ro.build.id|ro.build.version.release|ro.build.version.sdk|ro.build.version.security_patch|ro.build.fingerprint|ro.system.build.fingerprint|ro.telephony.euicc)=' \
