                      sudo umount "$TEMP_MOUNT"
                  fi

                  rmdir "$TEMP_MOUNT" 2>/dev/null || true
              }

              trap cleanup EXIT


              sudo mount \
                -o loop \
                "$IMG" \
                "$TEMP_MOUNT"


              sudo cp \
                -a \
                "$SOURCE"/. \
                "$TEMP_MOUNT"/


              sync


              sudo umount \
                "$TEMP_MOUNT"


              rmdir \
                "$TEMP_MOUNT"


              trap - EXIT


              echo
              echo "Running filesystem check..."

              e2fsck \
                -fy \
                "$IMG" \
                || true


          # ========================================================
          # EROFS
          # ========================================================

          elif [ "$FS_TYPE" = "erofs" ]; then

              mkfs.erofs \
                -zlz4hc \
                "$IMG" \
                "$SOURCE"

          else

              echo "Unsupported filesystem:"
              echo "$FS_TYPE"

              exit 1

          fi


          # ========================================================
          # SPARSE IMAGE
          # ========================================================

          if command -v img2simg >/dev/null 2>&1; then

              img2simg \
                "$IMG" \
                "$OUT/${OUTPUT_NAME}.sparse.img" \
                || true


              if [ -f "$OUT/${OUTPUT_NAME}.sparse.img" ]; then

                  mv \
                    "$OUT/${OUTPUT_NAME}.sparse.img" \
                    "$IMG"

              fi

          fi


          # ========================================================
          # COMPRESS
          # ========================================================

          xz \
            -T0 \
            -9 \
            -c \
            "$IMG" \
            > "$IMG.xz"


          gzip \
            -9 \
            -c \
            "$IMG" \
            > "$IMG.gz"


          echo
          echo "FINAL OUTPUT:"
          ls -lh "$OUT"


      # ==========================================================
      # FINAL VALIDATION
      # ==========================================================

      - name: "🧪 Validate Final GSI Image"
        run: |

          set -Eeuo pipefail

          OUT="workspace/output"

          IMG="$OUT/${{ inputs.output_name }}.img"


          echo
          echo "============================================================"
          echo "FINAL IMAGE"
          echo "============================================================"

          ls -lh "$IMG"

          file "$IMG"

          sudo blkid "$IMG" || true


          echo
          echo "Compressed:"
          ls -lh \
            "$IMG.xz" \
            "$IMG.gz"


          echo
          echo "Target fingerprint:"
          echo \
            "google/panther/panther:16/BP2A.250605.031.A2/13578606:user/release-keys"


      # ==========================================================
      # CHECKSUMS / METADATA
      # ==========================================================

      - name: "🔑 Generate Checksums and Build Metadata"
        run: |

          set -Eeuo pipefail

          OUT="workspace/output"

          cd "$OUT"


