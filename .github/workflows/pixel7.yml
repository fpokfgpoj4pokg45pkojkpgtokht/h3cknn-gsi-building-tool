    /system \
    /system_ext \
    /product \
    /vendor \
    /odm \
    /vendor_dlkm \
    /odm_dlkm \
    /apex
do

    if [ -e "$ROOT" ]; then
        logmsg "MOUNTED $ROOT"
    else
        logmsg "MISSING $ROOT"
    fi

done


# ==============================================================
# EXACT FILE SEARCH
# ==============================================================

find_exact()
{
    NAME="$1"

    for ROOT in $SEARCH_ROOTS; do

        [ -d "$ROOT" ] || continue

        RESULT="$(
            find "$ROOT" \
                -type f \
                -name "$NAME" \
                -print \
                2>/dev/null \
                | head -n 1
        )"

        if [ -n "$RESULT" ]; then

            logmsg "FOUND $NAME -> $RESULT"

            return 0

        fi

    done

    logmsg "NOT FOUND $NAME"

    return 1
}


resolve()
{
    find_exact "$1" || true
}


