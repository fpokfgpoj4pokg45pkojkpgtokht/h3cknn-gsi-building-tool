name: "🔧 Port Treble GSI (HyperOS → Pixel 7 Panther)"

on:
  workflow_dispatch:
    inputs:

      rom_url:
        description: "📥 Direct HyperOS ROM URL"
        required: true
        type: string

      output_name:
        description: "📛 Output GSI Name"
        required: true
        default: "HyperOS-Android16-Panther"
        type: string

      rom_type:
        description: "📱 OEM Profile"
        required: true
        default: "hyperos"
        type: choice
        options:
          - "panther"
          - "pixel"
          - "hyperos"
          - "oneui"
          - "oxygenos"
          - "motorola"

      fs_type:
        description: "💾 Output Filesystem"
        required: true
        default: "ext4"
        type: choice
        options:
          - "ext4"
          - "erofs"

      target_model:
        description: "🎯 Target"
        required: false
        default: "Pixel 7 / Panther"
        type: string

      enable_aggressive_patches:
        description: "🧪 Apply aggressive HyperOS → Pixel 7 compatibility patches"
        required: true
        default: true
        type: boolean

      import_pixel_components:
        description: "📦 Analyze Pixel factory components"
        required: true
        default: true
        type: boolean

      factory_url:
        description: "🏭 Pixel 7 factory package"
        required: true
        default: "https://dl.google.com/dl/android/aosp/panther-bp2a.250605.031.a2-factory-53161cbb.zip"
        type: string

      aggressive_vendor_reference:
        description: "🧬 Index Pixel vendor/ODM HALs and configs"
        required: true
        default: true
        type: boolean

      import_missing_apks:
        description: "📦 Import selected compatible Pixel APKs"
        required: true
        default: true
        type: boolean

      import_framework_configs:
        description: "⚙️ Import compatible Pixel framework/config XMLs"
        required: true
        default: true
        type: boolean

      enable_boot_rescue:
        description: "🛟 Add persistent boot-error rescue engine"
        required: true
        default: true
        type: boolean

      boot_rescue_timeout:
        description: "⏱ Boot timeout before rescue"
        required: true
        default: "180"
        type: string

      boot_rescue_max_reboots:
        description: "🔁 Maximum automatic rescue reboots"
        required: true
        default: "5"
        type: string


jobs:

  port_gsi:

    runs-on: ubuntu-latest

    # GitHub-hosted jobs cannot use 9999 minutes.
    # 360 minutes is the supported maximum.
    timeout-minutes: 360

    concurrency:
      group: hyperos-panther-gsi
      cancel-in-progress: true

    permissions:
      contents: write

    env:

      TARGET_BRAND: "google"
      TARGET_MANUFACTURER: "Google"
      TARGET_MODEL: "Pixel 7"
      TARGET_DEVICE: "panther"
      TARGET_PRODUCT: "panther"
      TARGET_BOARD: "gs201"

      TARGET_ANDROID: "16"
      TARGET_SDK: "36"

      TARGET_BUILD_ID: "BP2A.250605.031.A2"
      TARGET_INCREMENTAL: "13578606"
      TARGET_SECURITY_PATCH: "2025-06-05"

      TARGET_FINGERPRINT: "google/panther/panther:16/BP2A.250605.031.A2/13578606:user/release-keys"


    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: "📦 Checkout Repository"
        uses: actions/checkout@v5


      # ==========================================================
      # DISK CLEANUP
      # ==========================================================

      - name: "🧹 Maximize Runner Disk Space"
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -f scripts/clean_disk.sh ]; then
            chmod +x scripts/clean_disk.sh
            bash scripts/clean_disk.sh || true
          fi

          echo
          echo "Available disk space:"
          df -h


      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: "⚙️ Setup Build Dependencies"
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            android-sdk-libsparse-utils \
            e2fsprogs \
            erofs-utils \
            lz4 \
            zstd \
            xz-utils \
            gzip \
            unzip \
            zip \
            cpio \
            rsync \
            file \
            jq \
            bc \
            python3 \
            python3-pip \
            libxml2-utils \
            xmlstarlet \
            lsof \
            psmisc \
            util-linux \
            mount \
            kmod \
            binutils \
            coreutils \
            grep \
            sed \
            gawk \
            curl \
            ca-certificates

          echo
          echo "============================================================"
          echo "Tool versions"
          echo "============================================================"

          simg2img --version || true
          img2simg --version || true
          mkfs.ext4 -V || true
          mkfs.erofs -V || true
          file --version || true


      # ==========================================================
      # PORT ORIGINAL ROM
      # ==========================================================

      - name: "🚀 Execute HyperOS GSI Port Engine"
        env:
          INPUT_ROM_URL: "${{ inputs.rom_url }}"
          INPUT_OUTPUT_NAME: "${{ inputs.output_name }}"
          INPUT_ROM_TYPE: "${{ inputs.rom_type }}"
          INPUT_FS_TYPE: "${{ inputs.fs_type }}"
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ ! -f scripts/port_rom.sh ]; then
            echo "ERROR: scripts/port_rom.sh not found."
            exit 1
          fi

          chmod +x scripts/port_rom.sh

          bash scripts/port_rom.sh \
            "$INPUT_ROM_URL" \
            "$INPUT_OUTPUT_NAME" \
            "$INPUT_ROM_TYPE" \
            "$INPUT_FS_TYPE"


      # ==========================================================
      # DOWNLOAD PIXEL FACTORY
      # ==========================================================

      - name: "🏭 Download Pixel 7 Panther Factory Package"
        if: ${{ inputs.import_pixel_components }}
        env:
          FACTORY_URL: "${{ inputs.factory_url }}"
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p \
            workspace/stock_pixel/factory \
            workspace/stock_pixel/images \
            workspace/stock_pixel/partitions \
            workspace/stock_pixel/index \
            workspace/stock_pixel/reports

          echo "Pixel factory:"
          echo "$FACTORY_URL"

          curl \
            -L \
            --fail \
            --retry 10 \
            --retry-delay 5 \
            --retry-all-errors \
            -o workspace/stock_pixel/factory/panther-factory.zip \
            "$FACTORY_URL"

          file workspace/stock_pixel/factory/panther-factory.zip

          sha256sum \
            workspace/stock_pixel/factory/panther-factory.zip \
            | tee workspace/stock_pixel/reports/factory.sha256


      # ==========================================================
      # EXTRACT FACTORY
      # ==========================================================

      - name: "📦 Extract Pixel Factory Package"
        if: ${{ inputs.import_pixel_components }}
        shell: bash
        run: |
          set -Eeuo pipefail

          FACTORY="workspace/stock_pixel/factory/panther-factory.zip"
          EXTRACT="workspace/stock_pixel/factory/extracted"

          rm -rf "$EXTRACT"

          mkdir -p "$EXTRACT"

          unzip -o \
            "$FACTORY" \
            -d "$EXTRACT"

          IMAGE_ZIP="$(
            find "$EXTRACT" \
              -type f \
              -name 'image-panther-*.zip' \
              -print \
              | head -n 1 \
              || true
          )"

          if [ -z "$IMAGE_ZIP" ]; then
            IMAGE_ZIP="$(
              find "$EXTRACT" \
                -type f \
                -name 'image-*.zip' \
                -print \
                | head -n 1 \
                || true
            )"
          fi

          if [ -z "$IMAGE_ZIP" ]; then
            echo "ERROR: Pixel image archive was not found."

            find "$EXTRACT" \
              -type f \
              -print

            exit 1
          fi

          echo "Using image archive:"
          echo "$IMAGE_ZIP"

          rm -rf workspace/stock_pixel/images/nested

          mkdir -p workspace/stock_pixel/images/nested

          unzip -o \
            "$IMAGE_ZIP" \
            -d workspace/stock_pixel/images/nested

          echo
          echo "Nested image contents:"
          find workspace/stock_pixel/images/nested \
            -type f \
            -print \
            | sort


      # ==========================================================
      # LOCATE PIXEL PARTITIONS
      # ==========================================================

      - name: "🔎 Locate Pixel Partitions"
        if: ${{ inputs.import_pixel_components }}
        shell: bash
        run: |
          set -Eeuo pipefail

          FOUND_DIR="workspace/stock_pixel/images/found"

          rm -rf "$FOUND_DIR"

          mkdir -p "$FOUND_DIR"

          for PART in \
            system \
            product \
            system_ext \
            vendor \
            vendor_dlkm \
            odm \
            odm_dlkm
          do

            FOUND="$(
              find workspace/stock_pixel/images/nested \
                -type f \
                -name "${PART}.img" \
                -print \
                | head -n 1 \
                || true
            )"

            if [ -n "$FOUND" ]; then

              echo "FOUND $PART:"
              echo "$FOUND"

              cp \
                "$FOUND" \
                "$FOUND_DIR/${PART}.img"

            else

              echo "NOT FOUND: $PART"

            fi

          done

          echo
          ls -lh "$FOUND_DIR" || true


      # ==========================================================
      # EXTRACT PIXEL FILESYSTEMS
      # ==========================================================

      - name: "🧩 Extract Pixel Partition Filesystems"
        if: ${{ inputs.import_pixel_components }}
        shell: bash
        run: |
          set -Eeuo pipefail

          BASE="workspace/stock_pixel/partitions"

          rm -rf "$BASE"

          mkdir -p "$BASE"

          cleanup() {
            set +e

            for PART in \
              system \
              product \
              system_ext \
              vendor \
              vendor_dlkm \
              odm \
              odm_dlkm
            do
              MNT="$BASE/$PART.mnt"

              if mountpoint -q "$MNT"; then
                sudo umount "$MNT" || true
              fi
            done
          }

          trap cleanup EXIT

          for PART in \
            system \
            product \
            system_ext \
            vendor \
            vendor_dlkm \
            odm \
            odm_dlkm
          do

            IMG="workspace/stock_pixel/images/found/${PART}.img"
            DEST="$BASE/$PART"

            [ -f "$IMG" ] || continue

            mkdir -p "$DEST"

            echo
            echo "============================================================"
            echo "PIXEL PARTITION: $PART"
            echo "============================================================"

            file "$IMG"

            RAW="$BASE/${PART}.raw.img"

            rm -f "$RAW"

            if file "$IMG" | grep -qi "Android sparse"; then

              echo "Converting sparse image..."

              simg2img \
                "$IMG" \
                "$RAW"

            else

              cp \
                "$IMG" \
                "$RAW"

            fi

            FSTYPE="$(
              sudo blkid \
                -o value \
                -s TYPE \
                "$RAW" \
                2>/dev/null \
                || true
            )"

            if [ -z "$FSTYPE" ]; then

              if file "$RAW" | grep -qi "EROFS"; then
                FSTYPE="erofs"
              elif file "$RAW" | grep -qi "ext4"; then
                FSTYPE="ext4"
              fi

            fi

            echo "Filesystem: ${FSTYPE:-unknown}"

            case "$FSTYPE" in

              erofs)

                echo "Extracting EROFS..."

                fsck.erofs \
                  --extract="$DEST" \
                  "$RAW"

                ;;

              ext4)

                MNT="$BASE/$PART.mnt"

                mkdir -p "$MNT"

                sudo mount \
                  -t ext4 \
                  -o ro,noload \
                  "$RAW" \
                  "$MNT"

                sudo rsync \
                  -aHAX \
                  "$MNT"/ \
                  "$DEST"/

                sudo umount "$MNT"

                rmdir "$MNT"

                ;;

              *)

                echo "ERROR: Unsupported filesystem."

                file "$RAW"

                exit 1

                ;;

            esac

            rm -f "$RAW"

            echo
            echo "$PART extracted file count:"

            find "$DEST" \
              -type f \
              | wc -l

          done


      # ==========================================================
      # PIXEL FILE INDEX
      # ==========================================================

      - name: "📚 Build Pixel Component Index"
        if: ${{ inputs.import_pixel_components }}
        shell: bash
        run: |
          set -Eeuo pipefail

          INDEX="workspace/stock_pixel/index/files.tsv"

          mkdir -p workspace/stock_pixel/index

          printf '%s\n' \
            $'partition\tpath\tsize\tsha256\tfiletype' \
            > "$INDEX"

          for PART in \
            system \
            product \
            system_ext \
            vendor \
            vendor_dlkm \
            odm \
            odm_dlkm
          do

            ROOT="workspace/stock_pixel/partitions/$PART"

            [ -d "$ROOT" ] || continue

            while IFS= read -r -d '' FILE; do

              REL="${FILE#$ROOT/}"

              SIZE="$(
                stat \
                  -c '%s' \
                  "$FILE"
              )"

              HASH="$(
                sha256sum "$FILE" |
                awk '{print $1}'
              )"

              TYPE="$(
                file -b "$FILE" |
                tr '\t' ' ' |
                head -c 200
              )"

              printf \
                '%s\t%s\t%s\t%s\t%s\n' \
                "$PART" \
                "$REL" \
                "$SIZE" \
                "$HASH" \
                "$TYPE" \
                >> "$INDEX"

            done < <(
              find "$ROOT" \
                -type f \
                -print0
            )

          done

          echo "Indexed:"
          tail -n +2 "$INDEX" | wc -l


      # ==========================================================
      # PIXEL PATH INDEX
      # ==========================================================

      - name: "🗂️ Build Pixel Path Lookup Database"
        if: ${{ inputs.import_pixel_components }}
        shell: bash
        run: |
          set -Eeuo pipefail

          INDEX="workspace/stock_pixel/index/files.tsv"
          PATHS="workspace/stock_pixel/index/path-index.txt"
          BASENAMES="workspace/stock_pixel/index/basename-index.txt"

          tail -n +2 "$INDEX" |
            cut -f2 |
            sort |
            uniq \
            > "$PATHS"

          awk -F '\t' '
            NR > 1 {
              n=$2
              sub(/^.*\//, "", n)
              print n "\t" $1 "\t" $2
            }
          ' "$INDEX" |
            sort \
            > "$BASENAMES"

          echo "Paths:"
          wc -l "$PATHS"

          echo "Basenames:"
          wc -l "$BASENAMES"


      # ==========================================================
      # STOCK BUILD PROPERTIES
      # ==========================================================

      - name: "📋 Extract Pixel Build Properties"
        if: ${{ inputs.import_pixel_components }}
        shell: bash
        run: |
          set -Eeuo pipefail

          REPORT="workspace/stock_pixel/reports/stock-build-props.txt"

          : > "$REPORT"

          for PART in \
            system \
            product \
            system_ext \
            vendor \
            odm
          do

            ROOT="workspace/stock_pixel/partitions/$PART"

            [ -d "$ROOT" ] || continue

            while IFS= read -r PROP; do

              {
                echo "============================================================"
                echo "$PART: $PROP"
                echo "============================================================"
                cat "$PROP"
                echo
              } >> "$REPORT"

            done < <(
              find "$ROOT" \
                -type f \
                -name build.prop \
                -print
            )

          done

          grep -E \
            '^(ro\.vndk|ro\.build\.version\.sdk|ro\.build\.version\.release|ro\.product\.first_api_level|ro\.vendor\.)=' \
            "$REPORT" \
            > workspace/stock_pixel/reports/important-properties.txt \
            || true


      # ==========================================================
      # CREATE PATCH ENGINE
      # ==========================================================

      - name: "🧬 Create Panther Compatibility Engine"
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p scripts

          cat > scripts/patch_hyperos_panther.sh <<'PATCH_ENGINE'
          #!/usr/bin/env bash

          set -Eeuo pipefail

          ROOT="${1:-workspace/system_root}"
          STOCK="${2:-workspace/stock_pixel/partitions}"

          IMPORT_CONFIGS="${IMPORT_CONFIGS:-1}"
          IMPORT_APKS="${IMPORT_APKS:-1}"
          VENDOR_REFERENCE="${VENDOR_REFERENCE:-1}"
          ENABLE_BOOT_RESCUE="${ENABLE_BOOT_RESCUE:-1}"
          BOOT_RESCUE_TIMEOUT="${BOOT_RESCUE_TIMEOUT:-180}"
          BOOT_RESCUE_MAX_REBOOTS="${BOOT_RESCUE_MAX_REBOOTS:-5}"

          echo "============================================================"
          echo "HyperOS → Pixel 7 Panther Compatibility Engine"
          echo "============================================================"

          if [ ! -d "$ROOT" ]; then
              echo "ERROR: GSI root does not exist:"
              echo "$ROOT"
              exit 1
          fi

          if [ -d "$ROOT/system/system" ]; then
              SYS="$ROOT/system/system"
          elif [ -d "$ROOT/system" ]; then
              SYS="$ROOT/system"
          else
              SYS="$ROOT"
          fi

          echo "GSI system root:"
          echo "$SYS"

          echo "Pixel reference:"
          echo "$STOCK"

          mkdir -p \
              "$SYS/bin" \
              "$SYS/etc/init" \
              "$SYS/etc/permissions" \
              "$SYS/etc/sysconfig" \
              "$SYS/etc/vintf" \
              "$SYS/etc/panther-stock/vendor" \
              "$SYS/etc/panther-stock/odm"

          REPORT="$ROOT/panther-stock-import-report.txt"

          : > "$REPORT"

          PROP="$SYS/build.prop"

          if [ ! -f "$PROP" ]; then
              touch "$PROP"
          fi

          cp \
              "$PROP" \
              "$PROP.hyperos-original"

          remove_prop() {
              local KEY="$1"

              sed -i \
                  "/^${KEY}=/d" \
                  "$PROP" \
                  2>/dev/null \
                  || true
          }

          set_prop() {
              local KEY="$1"
              local VALUE="$2"

              remove_prop "$KEY"

              printf '%s=%s\n' \
                  "$KEY" \
                  "$VALUE" \
                  >> "$PROP"
          }

          echo "Removing conflicting identity..."

          for KEY in \
              ro.product.brand \
              ro.product.manufacturer \
              ro.product.model \
              ro.product.device \
              ro.product.name \
              ro.product.board \
              ro.product.system.brand \
              ro.product.system.manufacturer \
              ro.product.system.model \
              ro.product.system.device \
              ro.product.system.name \
              ro.product.product.brand \
              ro.product.product.manufacturer \
              ro.product.product.model \
              ro.product.product.device \
              ro.product.product.name \
              ro.product.vendor.brand \
              ro.product.vendor.manufacturer \
              ro.product.vendor.model \
              ro.product.vendor.device \
              ro.product.vendor.name \
              ro.product.odm.brand \
              ro.product.odm.manufacturer \
              ro.product.odm.model \
              ro.product.odm.device \
              ro.product.odm.name \
              ro.build.product \
              ro.board.platform \
              ro.build.fingerprint \
              ro.system.build.fingerprint \
              ro.product.build.fingerprint
          do
              remove_prop "$KEY"
          done

          # ======================================================
          # PIXEL 7 IDENTITY
          # ======================================================

          set_prop ro.product.brand "google"
          set_prop ro.product.manufacturer "Google"
          set_prop ro.product.model "Pixel 7"
          set_prop ro.product.device "panther"
          set_prop ro.product.name "panther"
          set_prop ro.product.board "gs201"

          set_prop ro.board.platform "gs201"

          set_prop ro.product.system.brand "google"
          set_prop ro.product.system.manufacturer "Google"
          set_prop ro.product.system.model "Pixel 7"
          set_prop ro.product.system.device "panther"
          set_prop ro.product.system.name "panther"

          set_prop ro.product.product.brand "google"
          set_prop ro.product.product.manufacturer "Google"
          set_prop ro.product.product.model "Pixel 7"
          set_prop ro.product.product.device "panther"
          set_prop ro.product.product.name "panther"

          set_prop ro.build.product "panther"

          # ======================================================
          # ANDROID 16
          # ======================================================

          set_prop ro.build.id "BP2A.250605.031.A2"
          set_prop ro.build.display.id "BP2A.250605.031.A2"
          set_prop ro.build.version.incremental "13578606"
          set_prop ro.build.version.release "16"
          set_prop ro.build.version.release_or_codename "16"
          set_prop ro.build.version.release_or_preview_display "16"
          set_prop ro.build.version.sdk "36"
          set_prop ro.build.version.codename "REL"
          set_prop ro.build.version.preview_sdk "0"
          set_prop ro.build.version.preview_sdk_fingerprint "REL"
          set_prop ro.build.version.security_patch "2025-06-05"
          set_prop ro.build.type "user"
          set_prop ro.build.tags "release-keys"
          set_prop ro.build.flavor "panther-user"

          # ======================================================
          # FINGERPRINT
          # ======================================================

          set_prop \
              ro.build.fingerprint \
              "google/panther/panther:16/BP2A.250605.031.A2/13578606:user/release-keys"

          set_prop \
              ro.system.build.fingerprint \
              "google/panther/panther:16/BP2A.250605.031.A2/13578606:user/release-keys"

          set_prop \
              ro.product.build.fingerprint \
              "google/panther/panther:16/BP2A.250605.031.A2/13578606:user/release-keys"

          set_prop ro.system.build.id "BP2A.250605.031.A2"
          set_prop ro.system.build.version.release "16"
          set_prop ro.system.build.version.sdk "36"
          set_prop ro.system.build.version.security_patch "2025-06-05"

          # ======================================================
          # ARM64
          # ======================================================

          set_prop ro.product.cpu.abi "arm64-v8a"
          set_prop ro.product.cpu.abilist "arm64-v8a,armeabi-v7a,armeabi"
          set_prop ro.product.cpu.abilist32 "armeabi-v7a,armeabi"
          set_prop ro.product.cpu.abilist64 "arm64-v8a"

          # ======================================================
          # TREBLE
          # ======================================================

          set_prop ro.treble.enabled "true"
          set_prop ro.actionable_compatible_property.enabled "true"

          remove_prop ro.llndk.api_level

          # ======================================================
          # SECURITY
          # ======================================================

          set_prop ro.secure "1"
          set_prop ro.adb.secure "1"
          set_prop ro.debuggable "0"
          set_prop ro.force.debuggable "0"

          # ======================================================
          # HARDWARE
          # ======================================================

          set_prop ro.hardware "gs201"
          set_prop ro.boot.hardware "gs201"
          set_prop ro.boot.hardware.platform "gs201"

          # ======================================================
          # GRAPHICS
          # ======================================================

          set_prop ro.hardware.vulkan "pixel"

          remove_prop debug.sf.enable_hwc_vds
          remove_prop debug.sf.latch_unsignaled
          remove_prop debug.sf.disable_backpressure
          remove_prop debug.sf.use_phase_offsets_as_durations

          # ======================================================
          # ART
          # ======================================================

          set_prop dalvik.vm.useartservice "true"
          set_prop dalvik.vm.usejit "true"

          # ======================================================
          # TELEPHONY
          # ======================================================

          set_prop ro.telephony.default_network "26"
          set_prop persist.radio.multisim.config "dsds"

          set_prop ro.telephony.euicc "true"
          set_prop persist.radio.euicc.enabled "true"
          set_prop persist.radio.euicc "1"

          # ======================================================
          # GOOGLE / KEYGUARD
          # ======================================================

          set_prop ro.keyguard.supported "true"
          set_prop config.disableLockscreen "false"

          set_prop ro.com.google.clientidbase "android-google"
          set_prop ro.setupwizard.mode "OPTIONAL"
          set_prop net.bt.name "Android"
          set_prop ro.allow.mock.location "0"

          # ======================================================
          # SAFE IMPORT HELPER
          # ======================================================

          import_file() {
              local PART="$1"
              local REL="$2"
              local MODE="${3:-add}"

              local SRC="$STOCK/$PART/$REL"
              local DEST="$SYS/$REL"

              [ -f "$SRC" ] || return 1

              mkdir -p "$(dirname "$DEST")"

              if [ "$MODE" = "replace" ]; then

                  if [ -f "$DEST" ]; then
                      cp -a "$DEST" "$DEST.hyperos-backup"
                  fi

                  cp -a "$SRC" "$DEST"

                  echo "REPLACED $PART/$REL" >> "$REPORT"

              else

                  if [ ! -e "$DEST" ]; then
                      cp -a "$SRC" "$DEST"
                      echo "ADDED $PART/$REL" >> "$REPORT"
                  else
                      echo "KEPT $REL" >> "$REPORT"
                  fi

              fi
          }

          # ======================================================
          # FRAMEWORK CONFIG IMPORT
          # ======================================================

          if [ "$IMPORT_CONFIGS" = "1" ]; then

              {
                  echo
                  echo "PIXEL FRAMEWORK CONFIGURATION"
                  echo "============================="
              } >> "$REPORT"

              for PART in system product system_ext; do

                  SRC="$STOCK/$PART"

                  [ -d "$SRC/etc" ] || continue

                  while IFS= read -r -d '' FILE; do

                      REL="${FILE#$SRC/}"
                      BASE="$(basename "$FILE")"

                      case "$BASE" in
                          *fingerprint*|*biometric*|*euicc*|*uicc*|*telephony*|*carrier*|*subscription*|*wifi*|*nfc*)
                              import_file "$PART" "$REL" add || true
                              ;;
                      esac

                  done < <(
                      find "$SRC/etc" \
                          -type f \
                          \( \
                              -iname '*fingerprint*' \
                              -o -iname '*biometric*' \
                              -o -iname '*euicc*' \
                              -o -iname '*uicc*' \
                              -o -iname '*telephony*' \
                              -o -iname '*carrier*' \
                              -o -iname '*subscription*' \
                              -o -iname '*wifi*' \
                              -o -iname '*nfc*' \
                          \) \
                          -print0
                  )

              done
          fi

          # ======================================================
          # SELECTIVE EUICC APK IMPORT
          # ======================================================

          if [ "$IMPORT_APKS" = "1" ]; then

              {
                  echo
                  echo "PIXEL APK CANDIDATES"
                  echo "==================="
              } >> "$REPORT"

              for PART in system product system_ext; do

                  SRC="$STOCK/$PART"

                  [ -d "$SRC" ] || continue

                  while IFS= read -r -d '' APK; do

                      BASE="$(basename "$APK")"

                      case "$BASE" in

                          *Euicc*|*EUICC*|*euicc*)

                              REL="${APK#$SRC/}"
                              DEST="$SYS/$REL"

                              if [ ! -f "$DEST" ]; then

                                  mkdir -p "$(dirname "$DEST")"

                                  cp -a \
                                      "$APK" \
                                      "$DEST"

                                  echo "ADDED APK $PART/$REL" >> "$REPORT"

                              fi

                              ;;

                      esac

                  done < <(
                      find "$SRC" \
                          -type f \
                          -name '*.apk' \
                          -print0
                  )

              done
          fi

          # ======================================================
          # HARDWARE XML
          # ======================================================

          cat > "$SYS/etc/permissions/panther-hardware.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <permissions>
              <feature name="android.hardware.wifi" />
              <feature name="android.hardware.wifi.direct" />
              <feature name="android.hardware.bluetooth" />
              <feature name="android.hardware.camera" />
              <feature name="android.hardware.camera.front" />
              <feature name="android.hardware.fingerprint" />
              <feature name="android.hardware.nfc" />
              <feature name="android.hardware.location" />
              <feature name="android.hardware.location.gps" />
              <feature name="android.hardware.telephony" />
              <feature name="android.hardware.telephony.subscription" />
              <feature name="android.hardware.telephony.euicc" />
              <feature name="android.hardware.usb.host" />
