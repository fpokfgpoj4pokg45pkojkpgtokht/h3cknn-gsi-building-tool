# HyperOS → Google Pixel 7 Panther

## Target

| Property | Value |
|---|---|
| Brand | Android |
| Manufacturer | Google |
| Model | Panther |
| Device | panther |
| Product | panther |
| Board | gs201 |
| Android | 16 |
| SDK | 36 |
| Build ID | BP2A.250605.031.A2 |
| Incremental | 13578606 |
| Security Patch | 2025-06-05 |

## Fingerprint

\`google/panther/panther:16/BP2A.250605.031.A2/13578606:user/release-keys\`

## Pixel Factory Reference

The workflow downloads the specified Panther factory package and analyzes:

- system.img
- product.img
- system_ext.img
- vendor.img
- vendor_dlkm.img
- odm.img
- odm_dlkm.img

## Compatibility Engine

The build performs:

- Pixel identity conversion
- Android 16 property conversion
- GS201 property configuration
- Treble configuration
- ARM64 configuration
- ART configuration
- SurfaceFlinger configuration
- telephony configuration
- eUICC configuration
- biometric configuration
- Pixel permission import
- Pixel framework configuration import
- Pixel APK candidate import
- vendor HAL indexing
- ODM HAL indexing
- VINTF indexing
- firmware indexing
- APEX readiness detection
- runtime hardware discovery

## Runtime Resolver

Installed:

\`/system/bin/panther-driver-resolver\`

Init:

\`/system/etc/init/panther-driver-resolver.rc\`

The resolver waits for:

- /system
- /system_ext
- /product
- /vendor
- /odm
- /vendor_dlkm
- /odm_dlkm
- /apex

and waits for:

\`apex.all.ready=1\`

It then searches for:

- Wi-Fi
- Bluetooth
- Camera
- Audio
- Sensors
- Fingerprint
- NFC
- GNSS
- USB
- Radio
- GPU/Vulkan
- eUICC

## Important Architecture Note

The workflow does **not** blindly move Pixel vendor HAL binaries into /system.

The Pixel factory vendor/ODM partitions are primarily used as hardware compatibility references because Android's system/vendor separation, linker namespaces, VNDK, VINTF and SELinux rules must remain intact.

When this GSI is used on an actual Pixel 7, the device's existing Pixel vendor/ODM stack remains the primary hardware implementation.

