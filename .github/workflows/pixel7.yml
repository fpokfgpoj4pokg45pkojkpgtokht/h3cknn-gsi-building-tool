name: "🔧 Port Treble GSI (HyperOS → Pixel 7 Panther)"

on:
  workflow_dispatch:
    inputs:

      rom_url:
        description: "📥 Direct HyperOS ROM URL / Google Drive link"
        required: true
        type: string

      output_name:
        description: "📛 Output GSI Name"
        required: true
        default: "HyperOS-Android16-Panther"
        type: string

      rom_type:
        description: "📱 OEM Profile"
        required: true
        default: "hyperos"
        type: choice
        options:
          - "panther"
          - "pixel"
          - "hyperos"
          - "oneui"
          - "oxygenos"
          - "motorola"

      fs_type:
        description: "💾 Output Filesystem"
        required: true
        default: "ext4"
        type: choice
        options:
          - "ext4"
          - "erofs"

      target_model:
        description: "🎯 Target"
        required: false
        default: "Pixel 7 / Panther"
        type: string

      enable_aggressive_patches:
        description: "🧪 Apply aggressive HyperOS → Pixel 7 compatibility patches"
        required: true
        default: true
        type: boolean

      import_pixel_components:
        description: "📦 Import compatible Pixel components from factory images"
        required: true
        default: true
        type: boolean

      factory_url:
        description: "🏭 Pixel 7 factory package"
        required: true
        default: "https://dl.google.com/dl/android/aosp/panther-bp2a.250605.031.a2-factory-53161cbb.zip"
        type: string

      aggressive_vendor_reference:
        description: "🧬 Index Pixel vendor/ODM HALs and configs"
        required: true
        default: true
        type: boolean

      import_missing_apks:
        description: "📦 Import missing compatible Pixel APKs"
        required: true
        default: true
        type: boolean

      import_framework_configs:
        description: "⚙️ Import Pixel framework/config XMLs"
        required: true
        default: true
        type: boolean


jobs:

  port_gsi:

    runs-on: ubuntu-latest

    timeout-minutes: 9999

    concurrency:
      group: hyperos-panther-gsi
      cancel-in-progress: true

    permissions:
      contents: write

    env:

      # ==========================================================
      # PIXEL 7 / PANTHER
      # ==========================================================

      TARGET_BRAND: "Android"
      TARGET_MANUFACTURER: "Google"
      TARGET_MODEL: "Panther"
      TARGET_DEVICE: "panther"
      TARGET_PRODUCT: "panther"
      TARGET_BOARD: "gs201"

      TARGET_ANDROID: "16"
      TARGET_SDK: "36"

      TARGET_BUILD_ID: "BP2A.250605.031.A2"
      TARGET_INCREMENTAL: "13578606"
      TARGET_SECURITY_PATCH: "2025-06-05"

      TARGET_FINGERPRINT: "google/panther/panther:16/BP2A.250605.031.A2/13578606:user/release-keys"


    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: "📦 Checkout Repository"
        uses: actions/checkout@v5


      # ==========================================================
      # DISK CLEANUP
      # ==========================================================

      - name: "🧹 Maximize Runner Disk Space"
        run: |

          set -Eeuo pipefail

          chmod +x scripts/clean_disk.sh 2>/dev/null || true

          if [ -x scripts/clean_disk.sh ]; then
              bash scripts/clean_disk.sh || true
          fi

          echo
          echo "Available disk space:"
          df -h


      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: "⚙️ Setup Build Dependencies"
        run: |

          set -Eeuo pipefail

          chmod +x scripts/*.sh 2>/dev/null || true

          if [ -x scripts/setup_deps.sh ]; then
              bash scripts/setup_deps.sh || true
          fi

          sudo apt-get update

          sudo apt-get install -y \
            android-sdk-libsparse-utils \
            e2fsprogs \
            erofs-utils \
            lz4 \
            zstd \
            xz-utils \
            gzip \
            unzip \
            zip \
            cpio \
            rsync \
            file \
            jq \
            bc \
            python3 \
            python3-pip \
            libxml2-utils \
            xmlstarlet \
            lsof \
            psmisc \
            util-linux \
            mount \
            kmod \
            binutils \
            coreutils \
            grep \
            sed \
            awk

          echo
          echo "============================================================"
          echo "Tool versions"
          echo "============================================================"

          simg2img --version || true
          img2simg --version || true
          mkfs.ext4 -V || true
          mkfs.erofs -V || true
          file --version || true


      # ==========================================================
      # PORT HYPEROS
      # ==========================================================

      - name: "🚀 Execute HyperOS GSI Port Engine"
        env:

          SKIP_SETUP_DEPS: "1"

          INPUT_ROM_URL: ${{ inputs.rom_url }}
          INPUT_OUTPUT_NAME: ${{ inputs.output_name }}
          INPUT_ROM_TYPE: ${{ inputs.rom_type }}
          INPUT_FS_TYPE: ${{ inputs.fs_type }}
          INPUT_TARGET_MODEL: ${{ inputs.target_model }}

        run: |

          set -Eeuo pipefail

          chmod +x scripts/*.sh

          bash scripts/port_rom.sh \
            "$INPUT_ROM_URL" \
            "$INPUT_OUTPUT_NAME" \
            "$INPUT_ROM_TYPE" \
            "$INPUT_FS_TYPE"


      # ==========================================================
      # DOWNLOAD EXACT PIXEL FACTORY IMAGE
      # ==========================================================

      - name: "🏭 Download Pixel 7 Panther Factory Package"
        if: ${{ inputs.import_pixel_components }}
        env:
          FACTORY_URL: ${{ inputs.factory_url }}

        run: |

          set -Eeuo pipefail

          mkdir -p \
            workspace/stock_pixel/factory \
            workspace/stock_pixel/images \
            workspace/stock_pixel/partitions \
            workspace/stock_pixel/index \
            workspace/stock_pixel/reports

          echo
          echo "============================================================"
          echo " Google Pixel 7 Panther Factory Image"
          echo "============================================================"

          echo "URL:"
          echo "$FACTORY_URL"

          curl \
            -L \
            --fail \
            --retry 10 \
            --retry-delay 5 \
            --retry-all-errors \
            -o workspace/stock_pixel/factory/panther-factory.zip \
            "$FACTORY_URL"

          echo
          echo "Downloaded:"
          ls -lh \
            workspace/stock_pixel/factory/panther-factory.zip

          file \
            workspace/stock_pixel/factory/panther-factory.zip

          sha256sum \
            workspace/stock_pixel/factory/panther-factory.zip \
            | tee \
              workspace/stock_pixel/reports/factory.sha256


      # ==========================================================
      # EXTRACT FACTORY ARCHIVE
      # ==========================================================

      - name: "📦 Extract Pixel Factory Package"
        if: ${{ inputs.import_pixel_components }}
        run: |

          set -Eeuo pipefail

          FACTORY="workspace/stock_pixel/factory/panther-factory.zip"

          EXTRACT="workspace/stock_pixel/factory/extracted"

          mkdir -p "$EXTRACT"

          unzip -o \
            "$FACTORY" \
            -d "$EXTRACT"


          echo
          echo "Factory archive:"
          find "$EXTRACT" \
            -maxdepth 5 \
            -type f \
            -printf '%p\n' \
            | sort \
            | head -500


          IMAGE_ZIP="$(
            find "$EXTRACT" \
              -type f \
              -name 'image-panther-*.zip' \
              -print \
              | head -n 1 \
              || true
          )"


          if [ -z "$IMAGE_ZIP" ]; then

            IMAGE_ZIP="$(
              find "$EXTRACT" \
                -type f \
                -name 'image-*.zip' \
                -print \
                | head -n 1 \
                || true
            )

          fi


          if [ -z "$IMAGE_ZIP" ]; then

            echo
            echo "ERROR: Pixel image archive was not found."

            find "$EXTRACT" \
              -type f \
              -printf '%p\n'

            exit 1

          fi


          echo
          echo "Using image archive:"
          echo "$IMAGE_ZIP"


          mkdir -p \
            workspace/stock_pixel/images/nested

          unzip -o \
            "$IMAGE_ZIP" \
            -d workspace/stock_pixel/images/nested


          echo
          echo "Nested image archive:"
          find workspace/stock_pixel/images/nested \
            -type f \
            -printf '%p\n' \
            | sort


      # ==========================================================
      # LOCATE ALL PIXEL PARTITIONS
      # ==========================================================

      - name: "🔎 Locate Pixel System / Product / System_Ext / Vendor"
        if: ${{ inputs.import_pixel_components }}
        run: |

          set -Eeuo pipefail

          FOUND_DIR="workspace/stock_pixel/images/found"

          mkdir -p "$FOUND_DIR"

          for PART in \
            system \
            product \
            system_ext \
            vendor \
            vendor_dlkm \
            odm \
            odm_dlkm
          do

            FOUND="$(
              find workspace/stock_pixel/images/nested \
                -type f \
                -name "${PART}.img" \
                -print \
                | head -n 1 \
                || true
            )"

            if [ -n "$FOUND" ]; then

              echo
              echo "FOUND:"
              echo "$PART"
              echo "$FOUND"

              cp \
                "$FOUND" \
                "$FOUND_DIR/${PART}.img"

            else

              echo
              echo "NOT FOUND:"
              echo "$PART"

            fi

          done


          echo
          echo "Partition images:"
          ls -lh "$FOUND_DIR" || true


      # ==========================================================
      # EXTRACT PIXEL FILESYSTEMS
      # ==========================================================

      - name: "🧩 Extract Pixel Partition Filesystems"
        if: ${{ inputs.import_pixel_components }}
        run: |

          set -Eeuo pipefail

          BASE="workspace/stock_pixel/partitions"

          mkdir -p "$BASE"


          cleanup()
          {
              set +e

              for PART in \
                system \
                product \
                system_ext \
                vendor \
                vendor_dlkm \
                odm \
                odm_dlkm
              do

                  MNT="$BASE/$PART"

                  if mountpoint -q "$MNT"; then
                      sudo umount "$MNT"
                  fi

              done
          }

          trap cleanup EXIT


          for PART in \
            system \
            product \
            system_ext \
            vendor \
            vendor_dlkm \
            odm \
            odm_dlkm
          do

            IMG="workspace/stock_pixel/images/found/${PART}.img"
            DEST="$BASE/$PART"

            [ -f "$IMG" ] || continue

            mkdir -p "$DEST"


            echo
            echo "============================================================"
            echo "PIXEL PARTITION: $PART"
            echo "============================================================"

            file "$IMG"


            RAW="$BASE/${PART}.raw.img"


            if file "$IMG" | grep -qi "Android sparse"; then

                echo "Converting sparse image..."

                simg2img \
                  "$IMG" \
                  "$RAW"

            else

                cp \
                  "$IMG" \
                  "$RAW"

            fi


            FSTYPE="$(
              sudo blkid \
                -o value \
                -s TYPE \
                "$RAW" \
                2>/dev/null \
                || true
            )"


            if [ -z "$FSTYPE" ]; then

                if file "$RAW" | grep -qi "EROFS"; then
                    FSTYPE="erofs"
                elif file "$RAW" | grep -qi "ext4"; then
                    FSTYPE="ext4"
                fi

            fi


            echo "Filesystem:"
            echo "${FSTYPE:-unknown}"


            if [ "$FSTYPE" = "erofs" ]; then

                echo "Extracting EROFS..."

                if command -v fsck.erofs >/dev/null 2>&1; then

                    fsck.erofs \
                      --extract="$DEST" \
                      "$RAW"

                else

                    echo "ERROR: fsck.erofs unavailable."
                    exit 1

                fi


            elif [ "$FSTYPE" = "ext4" ]; then

                MNT="$BASE/${PART}.mnt"

                mkdir -p "$MNT"

                sudo mount \
                  -t ext4 \
                  -o ro,noload \
                  "$RAW" \
                  "$MNT"


                sudo rsync \
                  -aHAX \
                  "$MNT"/ \
                  "$DEST"/


                sudo umount "$MNT"

                rmdir "$MNT"


            else

                echo "ERROR: Unsupported filesystem:"
                file "$RAW"

                exit 1

            fi


            rm -f "$RAW"


            echo
            echo "$PART extracted files:"
            find "$DEST" \
              -type f \
              | wc -l

          done


      # ==========================================================
      # CREATE COMPLETE PIXEL FILE INDEX
      # ==========================================================

      - name: "📚 Build Complete Pixel Component Index"
        if: ${{ inputs.import_pixel_components }}
        run: |

          set -Eeuo pipefail

          INDEX="workspace/stock_pixel/index/files.tsv"

          mkdir -p \
            workspace/stock_pixel/index

          : > "$INDEX"


          echo -e \
            "partition\tpath\tsize\tsha256\tfiletype" \
            > "$INDEX"


          for PART in \
            system \
            product \
            system_ext \
            vendor \
            vendor_dlkm \
            odm \
            odm_dlkm
          do

            ROOT="workspace/stock_pixel/partitions/$PART"

            [ -d "$ROOT" ] || continue


            while IFS= read -r FILE; do

                REL="${FILE#$ROOT/}"

                SIZE="$(
                  stat \
                    -c '%s' \
                    "$FILE"
                )"

                HASH="$(
                  sha256sum "$FILE" |
                  awk '{print $1}'
                )"

                TYPE="$(
                  file -b "$FILE" |
                  tr '\t' ' ' |
                  head -c 200
                )"

                printf \
                  '%s\t%s\t%s\t%s\t%s\n' \
                  "$PART" \
                  "$REL" \
                  "$SIZE" \
                  "$HASH" \
                  "$TYPE" \
                  >> "$INDEX"

            done < <(
              find "$ROOT" \
                -type f \
                -print
            )

          done


          echo
          echo "Indexed files:"
          tail -n +2 "$INDEX" | wc -l

          echo
          echo "Index size:"
          du -h "$INDEX"


      # ==========================================================
      # BUILD PATH INDEX
      # ==========================================================

      - name: "🗂️ Build Pixel Path Lookup Database"
        if: ${{ inputs.import_pixel_components }}
        run: |

          set -Eeuo pipefail

          INDEX="workspace/stock_pixel/index/files.tsv"

          PATHS="workspace/stock_pixel/index/path-index.txt"

          BASENAMES="workspace/stock_pixel/index/basename-index.txt"

          cut \
            -f2 \
            "$INDEX" \
            | tail -n +2 \
            | sort \
            | uniq \
            > "$PATHS"


          awk -F '\t' '
            NR > 1 {
              n=$2
              sub(/^.*\//, "", n)
              print n "\t" $1 "\t" $2
            }
          ' "$INDEX" \
            | sort \
            > "$BASENAMES"


          echo "Path index:"
          wc -l "$PATHS"

          echo "Basename index:"
          wc -l "$BASENAMES"


      # ==========================================================
      # STOCK BUILD PROPERTIES
      # ==========================================================

      - name: "📋 Extract Pixel Build Properties"
        if: ${{ inputs.import_pixel_components }}
        run: |

          set -Eeuo pipefail

          REPORT="workspace/stock_pixel/reports/stock-build-props.txt"

          : > "$REPORT"


          for PART in \
            system \
            product \
            system_ext \
            vendor \
            odm
          do

            ROOT="workspace/stock_pixel/partitions/$PART"

            [ -d "$ROOT" ] || continue


            find "$ROOT" \
              -type f \
              -name build.prop \
              -print \
              | while IFS= read -r PROP; do

                  echo \
                    "============================================================" \
                    >> "$REPORT"

                  echo \
                    "$PART: $PROP" \
                    >> "$REPORT"

                  echo \
                    "============================================================" \
                    >> "$REPORT"

                  cat "$PROP" >> "$REPORT"

                  echo >> "$REPORT"

              done

          done


          grep -E \
            '^(ro\.vndk|ro\.build\.version\.sdk|ro\.build\.version\.release|ro\.product\.first_api_level|ro\.vendor\.)=' \
            "$REPORT" \
            > workspace/stock_pixel/reports/important-properties.txt \
            || true


      # ==========================================================
      # CREATE COMPATIBILITY ENGINE
      # ==========================================================

      - name: "🧬 Create Panther Compatibility Engine"
        run: |

          set -Eeuo pipefail

          mkdir -p scripts


          cat > scripts/patch_hyperos_panther.sh <<'PATCH'
#!/usr/bin/env bash

set -Eeuo pipefail

ROOT="${1:-workspace/system_root}"
STOCK="${2:-workspace/stock_pixel/partitions}"

IMPORT_CONFIGS="${IMPORT_CONFIGS:-1}"
IMPORT_APKS="${IMPORT_APKS:-1}"
VENDOR_REFERENCE="${VENDOR_REFERENCE:-1}"

echo
echo "============================================================"
echo " HyperOS → Pixel 7 Panther Compatibility Engine"
echo "============================================================"


if [ ! -d "$ROOT" ]; then
    echo "ERROR: GSI system root does not exist."
    exit 1
fi


# ==============================================================
# SYSTEM ROOT DETECTION
# ==============================================================

if [ -d "$ROOT/system/system" ]; then
    SYS="$ROOT/system/system"
elif [ -d "$ROOT/system" ]; then
    SYS="$ROOT/system"
else
    SYS="$ROOT"
fi


echo "GSI:"
echo "$SYS"

echo "Pixel reference:"
echo "$STOCK"


# ==============================================================
# DIRECTORY SETUP
# ==============================================================

mkdir -p \
    "$SYS/bin" \
    "$SYS/etc/init" \
    "$SYS/etc/permissions" \
    "$SYS/etc/sysconfig" \
    "$SYS/etc/vintf" \
    "$SYS/etc/panther-stock" \
    "$SYS/etc/panther-stock/vendor" \
    "$SYS/etc/panther-stock/odm"


REPORT="$ROOT/panther-stock-import-report.txt"

: > "$REPORT"


# ==============================================================
# BUILD.PROP HELPERS
# ==============================================================

PROP="$SYS/build.prop"

touch "$PROP"

cp \
    "$PROP" \
    "$PROP.hyperos-original"


remove_prop()
{
    KEY="$1"

    sed -i \
        "/^${KEY}=/d" \
        "$PROP" \
        2>/dev/null \
        || true
}


set_prop()
{
    KEY="$1"
    VALUE="$2"

    remove_prop "$KEY"

    printf '%s=%s\n' \
        "$KEY" \
        "$VALUE" \
        >> "$PROP"
}


# ==============================================================
# REMOVE CONFLICTING TARGET PROPERTIES
# ==============================================================

for KEY in \
    ro.product.brand \
    ro.product.manufacturer \
    ro.product.model \
    ro.product.device \
    ro.product.name \
    ro.product.board \
    ro.product.system.brand \
    ro.product.system.manufacturer \
    ro.product.system.model \
    ro.product.system.device \
    ro.product.system.name \
    ro.product.product.brand \
    ro.product.product.manufacturer \
    ro.product.product.model \
    ro.product.product.device \
    ro.product.product.name \
    ro.build.product \
    ro.board.platform \
    ro.build.fingerprint \
    ro.system.build.fingerprint
do

    remove_prop "$KEY"

done


# ==============================================================
# PIXEL IDENTITY
# ==============================================================

set_prop ro.product.brand Android
set_prop ro.product.manufacturer Google
set_prop ro.product.model Panther
set_prop ro.product.device panther
set_prop ro.product.name panther
set_prop ro.product.board gs201

set_prop ro.board.platform gs201

set_prop ro.product.system.brand Android
set_prop ro.product.system.manufacturer Google
set_prop ro.product.system.model Panther
set_prop ro.product.system.device panther
set_prop ro.product.system.name panther

set_prop ro.product.product.brand Android
set_prop ro.product.product.manufacturer Google
set_prop ro.product.product.model Panther
set_prop ro.product.product.device panther
set_prop ro.product.product.name panther

set_prop ro.build.product panther


# ==============================================================
# ANDROID 16
# ==============================================================

set_prop ro.build.id BP2A.250605.031.A2
set_prop ro.build.display.id BP2A.250605.031.A2
set_prop ro.build.version.incremental 13578606

set_prop ro.build.version.release 16
set_prop ro.build.version.release_or_codename 16
set_prop ro.build.version.release_or_preview_display 16

set_prop ro.build.version.sdk 36
set_prop ro.build.version.sdk_full 36.0

set_prop ro.build.version.codename REL
set_prop ro.build.version.preview_sdk 0
set_prop ro.build.version.preview_sdk_fingerprint REL

set_prop ro.build.version.security_patch 2025-06-05

set_prop ro.build.type user
set_prop ro.build.tags release-keys
set_prop ro.build.flavor panther-user


# ==============================================================
# FINGERPRINT
# ==============================================================

set_prop \
    ro.build.fingerprint \
    google/panther/panther:16/BP2A.250605.031.A2/13578606:user/release-keys

set_prop \
    ro.system.build.fingerprint \
    google/panther/panther:16/BP2A.250605.031.A2/13578606:user/release-keys

set_prop \
    ro.system.build.id \
    BP2A.250605.031.A2

set_prop \
    ro.system.build.version.release \
    16

set_prop \
    ro.system.build.version.sdk \
    36

set_prop \
    ro.system.build.version.security_patch \
    2025-06-05


# ==============================================================
# CPU
# ==============================================================

set_prop ro.product.cpu.abi arm64-v8a
set_prop ro.product.cpu.abilist arm64-v8a,armeabi-v7a,armeabi
set_prop ro.product.cpu.abilist32 armeabi-v7a,armeabi
set_prop ro.product.cpu.abilist64 arm64-v8a


# ==============================================================
# TREBLE
# ==============================================================

set_prop ro.treble.enabled true
set_prop ro.llndk.api_level 202504
set_prop ro.postinstall.fstab.prefix /system
set_prop ro.actionable_compatible_property.enabled true


# ==============================================================
# SECURITY
# ==============================================================

set_prop ro.secure 1
set_prop ro.adb.secure 1
set_prop ro.debuggable 0
set_prop ro.force.debuggable 0
set_prop security.perf_harden 1


# ==============================================================
# GS201
# ==============================================================

set_prop ro.hardware gs201
set_prop ro.boot.hardware gs201
set_prop ro.boot.hardware.platform gs201
set_prop ro.hardware.keystore trusty
set_prop ro.hardware.camera gs201


# ==============================================================
# GRAPHICS
# ==============================================================

set_prop ro.hardware.vulkan pixel

set_prop debug.sf.enable_hwc_vds 1
set_prop debug.sf.latch_unsignaled 1
set_prop debug.sf.disable_backpressure 1
set_prop debug.sf.use_phase_offsets_as_durations 1

set_prop ro.surface_flinger.max_frame_buffer_acquired_buffers 3
set_prop ro.surface_flinger.primary_display_orientation 0
set_prop ro.surface_flinger.game_default_frame_rate_override 60


# ==============================================================
# ART
# ==============================================================

set_prop dalvik.vm.useartservice true
set_prop dalvik.vm.usejit true

set_prop dalvik.vm.dex2oat-Xms 64m
set_prop dalvik.vm.dex2oat-Xmx 512m

set_prop dalvik.vm.image-dex2oat-Xms 64m
set_prop dalvik.vm.image-dex2oat-Xmx 64m

set_prop pm.dexopt.first-boot verify
set_prop pm.dexopt.boot-after-ota verify
set_prop pm.dexopt.install speed-profile
set_prop pm.dexopt.bg-dexopt speed-profile


# ==============================================================
# TELEPHONY
# ==============================================================

set_prop ro.telephony.default_network 26
set_prop persist.radio.multisim.config dsds
set_prop persist.radio.multisim.stackid 0
set_prop persist.radio.multisim.stackid0 0
set_prop persist.radio.multisim.stackid1 1


# ==============================================================
# EUICC
# ==============================================================

set_prop ro.telephony.euicc true
set_prop persist.radio.euicc.enabled true
set_prop persist.radio.euicc 1
set_prop ro.vendor.euicc true


# ==============================================================
# KEYGUARD
# ==============================================================

set_prop ro.keyguard.supported true
set_prop config.disableLockscreen false


# ==============================================================
# GOOGLE
# ==============================================================

set_prop ro.com.google.clientidbase android-google
set_prop ro.setupwizard.mode OPTIONAL
set_prop net.bt.name Android
set_prop ro.allow.mock.location 0


# ==============================================================
# FILE IMPORT
# ==============================================================

import_file()
{
    PART="$1"
    REL="$2"
    MODE="$3"

    SRC="$STOCK/$PART/$REL"
    DEST="$SYS/$REL"

    [ -f "$SRC" ] || return 1

    mkdir -p "$(dirname "$DEST")"


    if [ "$MODE" = "replace" ]; then

        if [ -f "$DEST" ]; then
            cp "$DEST" "$DEST.hyperos-backup"
        fi

        cp -a "$SRC" "$DEST"

        echo "REPLACED $PART/$REL" >> "$REPORT"

    else

        if [ ! -e "$DEST" ]; then

            cp -a "$SRC" "$DEST"

            echo "ADDED $PART/$REL" >> "$REPORT"

        else

            echo "KEPT $REL" >> "$REPORT"

        fi

    fi
}


# ==============================================================
