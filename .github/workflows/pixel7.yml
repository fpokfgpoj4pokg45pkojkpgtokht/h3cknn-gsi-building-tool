          else
            SOURCE="$ROOT"
          fi

          mkdir -p workspace/output

          CONTENT_BYTES="$(
            du -s -B1 "$SOURCE" |
            awk '{print $1}'
          )"

          HEADROOM=$((1024 * 1024 * 1024))

          IMAGE_BYTES=$((CONTENT_BYTES + HEADROOM))

          IMAGE_BYTES=$(
            (
              IMAGE_BYTES + 4194303
            ) / 4194304 * 4194304
          )

          echo "CONTENT_BYTES=$CONTENT_BYTES" >> "$GITHUB_ENV"
          echo "IMAGE_BYTES=$IMAGE_BYTES" >> "$GITHUB_ENV"

          echo "Content:"
          numfmt --to=iec "$CONTENT_BYTES"

          echo "Image:"
          numfmt --to=iec "$IMAGE_BYTES"


      # ==========================================================
      # REBUILD GSI
      # ==========================================================

      - name: "🏗️ Rebuild Patched GSI Image"
        env:
          OUTPUT_NAME: "${{ inputs.output_name }}"
          FS_TYPE: "${{ inputs.fs_type }}"
        shell: bash
        run: |
          set -Eeuo pipefail

          ROOT="workspace/system_root"
          OUT="workspace/output"

          mkdir -p "$OUT"

          if [ -d "$ROOT/system/system" ]; then
            SOURCE="$ROOT/system/system"
          elif [ -d "$ROOT/system" ]; then
            SOURCE="$ROOT/system"
          else
            SOURCE="$ROOT"
          fi

          IMG="$OUT/${OUTPUT_NAME}.img"

          rm -f \
            "$IMG" \
            "$IMG.xz" \
            "$IMG.gz"

          echo "Source:"
          echo "$SOURCE"

          echo "Filesystem:"
          echo "$FS_TYPE"

          if [ "$FS_TYPE" = "ext4" ]; then

            truncate \
              -s "$IMAGE_BYTES" \
              "$IMG"

            mkfs.ext4 \
              -F \
              -L system \
              -O metadata_csum,64bit \
              "$IMG"

            TEMP_MOUNT="$(mktemp -d)"

            cleanup() {
              set +e

              if mountpoint -q "$TEMP_MOUNT"; then
                sudo umount "$TEMP_MOUNT" || true
              fi

              rmdir "$TEMP_MOUNT" 2>/dev/null || true
            }

            trap cleanup EXIT

            sudo mount \
              -o loop \
              "$IMG" \
              "$TEMP_MOUNT"

            sudo cp \
              -a \
              "$SOURCE"/. \
              "$TEMP_MOUNT"/

            sync

            sudo umount "$TEMP_MOUNT"

            rmdir "$TEMP_MOUNT"

            trap - EXIT

            e2fsck \
              -fy \
              "$IMG" \
              || true

          elif [ "$FS_TYPE" = "erofs" ]; then

            mkfs.erofs \
              -zlz4hc \
              "$IMG" \
              "$SOURCE"

          else

            echo "Unsupported filesystem:"
            echo "$FS_TYPE"

            exit 1

          fi

          file "$IMG"

          if [ "$FS_TYPE" = "ext4" ]; then
            sudo blkid "$IMG" || true
          fi

          # Keep the raw image intact and make sparse separately.
          if command -v img2simg >/dev/null 2>&1 && [ "$FS_TYPE" = "ext4" ]; then

            img2simg \
              "$IMG" \
              "$OUT/${OUTPUT_NAME}.sparse.img"

          fi

          xz \
            -T0 \
            -9 \
            -c \
            "$IMG" \
            > "$IMG.xz"

          gzip \
            -9 \
            -c \
            "$IMG" \
            > "$IMG.gz"

          echo
          echo "FINAL OUTPUT:"
          ls -lh "$OUT"


      # ==========================================================
      # VALIDATE FINAL IMAGE
      # ==========================================================

      - name: "🧪 Validate Final GSI Image"
        shell: bash
        run: |
          set -Eeuo pipefail

          OUT="workspace/output"
          IMG="$OUT/${{ inputs.output_name }}.img"

          test -f "$IMG"

          echo
          echo "============================================================"
          echo "FINAL IMAGE"
          echo "============================================================"

          ls -lh "$IMG"

          file "$IMG"

          echo
          echo "Compressed:"
          ls -lh \
            "$IMG.xz" \
            "$IMG.gz"

          if [ -f "$OUT/${{ inputs.output_name }}.sparse.img" ]; then
            echo
            echo "Sparse:"
            ls -lh "$OUT/${{ inputs.output_name }}.sparse.img"
            file "$OUT/${{ inputs.output_name }}.sparse.img"
          fi

          echo
          echo "Target fingerprint:"
          echo "google/panther/panther:16/BP2A.250605.031.A2/13578606:user/release-keys"


      # ==========================================================
      # METADATA
      # ==========================================================

      - name: "🔑 Generate Checksums and Build Metadata"
        env:
          SOURCE_ROM: "${{ inputs.rom_url }}"
          FACTORY_URL: "${{ inputs.factory_url }}"
          OUTPUT_NAME: "${{ inputs.output_name }}"
          FS_TYPE: "${{ inputs.fs_type }}"
        shell: bash
        run: |
          set -Eeuo pipefail

          OUT="workspace/output"

          cd "$OUT"

          sha256sum \
            *.img \
            *.img.xz \
            *.img.gz \
            > SHA256SUMS.txt

          if [ -f "${OUTPUT_NAME}.sparse.img" ]; then
            sha256sum \
              "${OUTPUT_NAME}.sparse.img" \
              >> SHA256SUMS.txt
          fi

          python3 - <<'PY'
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          output_name = os.environ["OUTPUT_NAME"]
          source = os.environ["SOURCE_ROM"]
          factory = os.environ["FACTORY_URL"]
          fs_type = os.environ["FS_TYPE"]

          raw = Path(f"{output_name}.img")
          xz = Path(f"{output_name}.img.xz")
          gz = Path(f"{output_name}.img.gz")
          sparse = Path(f"{output_name}.sparse.img")

          lines = [
              "HyperOS → Google Pixel 7 Panther",
              "===============================================",
              "",
              "SOURCE ROM",
              source,
              "",
              "PIXEL FACTORY",
              factory,
              "",
              "TARGET",
              "",
              "Brand: google",
              "Manufacturer: Google",
              "Model: Pixel 7",
              "Device: panther",
              "Product: panther",
              "Board: gs201",
              "",
              "ANDROID",
              "",
              "Version: 16",
              "SDK: 36",
              "Build ID: BP2A.250605.031.A2",
              "Incremental: 13578606",
              "Security Patch: 2025-06-05",
              "",
              "FINGERPRINT",
              "",
              "google/panther/panther:16/BP2A.250605.031.A2/13578606:user/release-keys",
              "",
              "PIXEL PARTITIONS",
              "",
              "system.img: analyzed",
              "product.img: analyzed",
              "system_ext.img: analyzed",
              "vendor.img: analyzed / reference",
              "vendor_dlkm.img: analyzed",
              "odm.img: analyzed",
              "odm_dlkm.img: analyzed",
              "",
              "COMPATIBILITY",
              "",
              "Pixel identity: enabled",
              "Android 16: enabled",
              "GS201: enabled",
              "Treble: enabled",
              "Pixel configuration: enabled",
              "eUICC: enabled",
              "Biometrics: enabled",
              "Telephony: enabled",
              "Vendor HAL index: enabled",
              "Runtime resolver: enabled",
              "",
              "BOOT RESCUE",
              "",
              "Persistent rescue engine: enabled",
              "",
              "IMAGE",
              "",
              f"Filesystem: {fs_type}",
              f"Raw image bytes: {raw.stat().st_size}",
              f"XZ bytes: {xz.stat().st_size}",
              f"GZIP bytes: {gz.stat().st_size}",
          ]

          if sparse.exists():
              lines.append(f"Sparse image bytes: {sparse.stat().st_size}")

          lines.extend([
              "",
              "GENERATED",
              "",
              datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "",
          ])

          Path("build-info.txt").write_text(
              "\n".join(lines),
              encoding="utf-8",
          )
          PY

          cp \
            ../system_root/panther-gsi-patch-report.txt \
            ./panther-gsi-patch-report.txt

          cp \
            ../system_root/panther-stock-import-report.txt \
            ./panther-stock-import-report.txt \
            2>/dev/null \
            || true

          cp \
            ../stock_pixel/reports/stock-build-props.txt \
            ./stock-build-props.txt \
            2>/dev/null \
            || true

          cp \
            ../stock_pixel/reports/important-properties.txt \
            ./pixel-important-properties.txt \
            2>/dev/null \
            || true

          cp \
            ../stock_pixel/index/files.tsv \
            ./pixel-files.tsv \
            2>/dev/null \
            || true

          cp \
            ../stock_pixel/index/path-index.txt \
            ./pixel-path-index.txt \
            2>/dev/null \
            || true


      # ==========================================================
      # GITHUB RELEASE
      # ==========================================================

      - name: "🏷️ Create GitHub Release"
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: "v${{ github.run_number }}-${{ github.run_id }}"
          name: "${{ inputs.output_name }} — Pixel 7 Panther"
          generate_release_notes: false
          files: |
            workspace/output/*.img
            workspace/output/*.img.xz
            workspace/output/*.img.gz
            workspace/output/*.sparse.img
            workspace/output/SHA256SUMS.txt
            workspace/output/build-info.txt
            workspace/output/panther-gsi-patch-report.txt
            workspace/output/panther-stock-import-report.txt
            workspace/output/stock-build-props.txt
            workspace/output/pixel-important-properties.txt
            workspace/output/pixel-files.tsv
            workspace/output/pixel-path-index.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ==========================================================
      # TELEGRAM
      # ==========================================================

      - name: "📨 Sync Release to Telegram"
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OUTPUT_NAME: "${{ inputs.output_name }}"
          RELEASE_URL: "${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ github.run_number }}-${{ github.run_id }}"
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || \
             [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets not configured."
            exit 0
          fi

          python3 - <<'PY'
          import os
          from pathlib import Path

          name = os.environ["OUTPUT_NAME"]
          release = os.environ["RELEASE_URL"]

          lines = [
              f"<b>{name}</b>",
              "",
              "<b>HyperOS → Google Pixel 7 Panther</b>",
              "",
              "Android: 16",
              "SDK: 36",
              "",
              "Brand: google",
              "Manufacturer: Google",
              "Model: Pixel 7",
              "Device: panther",
              "Product: panther",
              "Board: gs201",
              "",
              "Fingerprint:",
              "<code>google/panther/panther:16/BP2A.250605.031.A2/13578606:user/release-keys</code>",
              "",
              "<b>Pixel Factory Reference</b>",
              "",
              "system.img: analyzed",
              "product.img: analyzed",
              "system_ext.img: analyzed",
              "vendor.img: reference",
              "vendor_dlkm.img: analyzed",
              "odm.img: analyzed",
              "odm_dlkm.img: analyzed",
              "",
              "<b>Compatibility</b>",
              "",
              "Pixel identity: enabled",
              "GS201: enabled",
              "Treble: enabled",
              "ARM64: enabled",
              "Pixel configs: enabled",
              "VINTF: indexed",
              "HALs: indexed",
              "APEX: detected",
              "",
              "<b>Runtime Resolver</b>",
              "",
              "WiFi: resolver",
              "Bluetooth: resolver",
              "Camera: resolver",
              "Audio: resolver",
              "Sensors: resolver",
              "Fingerprint: resolver",
              "NFC: resolver",
              "GNSS: resolver",
              "USB: resolver",
              "Radio: resolver",
              "GPU: resolver",
              "eUICC: resolver",
              "",
              "<b>Boot Rescue</b>",
              "",
              "Persistent boot-error rescue engine: enabled",
              "",
              f'<a href="{release}">Open GitHub Release</a>',
          ]

          Path("workspace/output/telegram-message.html").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

          if [ ! -x scripts/send_telegram_message.sh ]; then
            echo "Telegram helper not present; skipping Telegram upload."
            exit 0
          fi

          bash \
            scripts/send_telegram_message.sh \
            "$TELEGRAM_BOT_TOKEN" \
            "$TELEGRAM_CHAT_ID" \
            workspace/output/telegram-message.html
