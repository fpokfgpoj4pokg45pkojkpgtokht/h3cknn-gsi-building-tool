        run: |

          set -Eeuo pipefail

          ROOT="workspace/system_root"

          if [ -d "$ROOT/system/system" ]; then
              SOURCE="$ROOT/system/system"
          elif [ -d "$ROOT/system" ]; then
              SOURCE="$ROOT/system"
          else
              SOURCE="$ROOT"
          fi


          mkdir -p workspace/output


          CONTENT_BYTES="$(
            du -s -B1 "$SOURCE" |
            awk '{print $1}'
          )"


          # 2 GiB safety headroom for ext4.
          # This avoids the common failure where a large HyperOS
          # GSI runs out of space during installation.

          HEADROOM=$((2 * 1024 * 1024 * 1024))

          IMAGE_BYTES=$((CONTENT_BYTES + HEADROOM))


