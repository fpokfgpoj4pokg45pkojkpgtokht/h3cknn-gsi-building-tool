          cat > "$SYS/etc/permissions/panther-biometric.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <permissions>
              <feature name="android.hardware.fingerprint" />
          </permissions>
          XML

          cat > "$SYS/etc/permissions/panther-euicc.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <permissions>
              <feature name="android.hardware.telephony.euicc" />
          </permissions>
          XML

          cat > "$SYS/etc/sysconfig/panther-keyguard.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <config>
              <allow-in-data-usage-save package="com.android.systemui" />
              <allow-in-power-save package="com.android.systemui" />
          </config>
          XML

          # ======================================================
          # VENDOR / ODM REFERENCE
          # ======================================================

          if [ "$VENDOR_REFERENCE" = "1" ]; then

              {
                  echo
                  echo "PIXEL VENDOR / ODM REFERENCE"
                  echo "============================"
              } >> "$REPORT"

              for PART in vendor odm; do

                  SRC="$STOCK/$PART"

                  [ -d "$SRC" ] || continue

                  DEST="$SYS/etc/panther-stock/$PART"

                  mkdir -p "$DEST"

                  if [ -d "$SRC/etc/vintf" ]; then

                      mkdir -p "$DEST/etc/vintf"

                      cp -a \
                          "$SRC/etc/vintf"/. \
                          "$DEST/etc/vintf"/ \
                          2>/dev/null \
                          || true

                  fi

                  if [ -d "$SRC/etc/permissions" ]; then

                      mkdir -p "$DEST/etc/permissions"

                      find "$SRC/etc/permissions" \
                          -type f \
                          -name '*.xml' \
                          -exec cp -a {} "$DEST/etc/permissions/" \; \
                          2>/dev/null \
                          || true

                  fi

                  if [ -d "$SRC/etc/init" ]; then

                      mkdir -p "$DEST/etc/init"

                      find "$SRC/etc/init" \
                          -type f \
                          -exec cp -a {} "$DEST/etc/init/" \; \
                          2>/dev/null \
                          || true

                  fi

                  if [ -d "$SRC/firmware" ]; then

                      find "$SRC/firmware" \
                          -type f \
                          -printf '%P\n' \
                          > "$DEST-firmware-index.txt" \
                          2>/dev/null \
                          || true

                  fi

                  find "$SRC" \
                      -type f \
                      \( \
                          -iname '*wifi*' \
                          -o -iname '*bluetooth*' \
                          -o -iname '*camera*' \
                          -o -iname '*audio*' \
                          -o -iname '*sensor*' \
                          -o -iname '*fingerprint*' \
                          -o -iname '*biometric*' \
                          -o -iname '*nfc*' \
                          -o -iname '*gnss*' \
                          -o -iname '*radio*' \
                          -o -iname '*thermal*' \
                          -o -iname '*power*' \
                          -o -iname '*health*' \
                          -o -iname '*usb*' \
                          -o -iname '*gpu*' \
                      \) \
                      -printf '%P\n' \
                      >> "$DEST-hal-index.txt" \
                      2>/dev/null \
                      || true

              done

          fi

          # ======================================================
          # SYSTEMUI INDEX
          # ======================================================

          find "$ROOT" \
              -type f \
              \( \
                  -name SystemUI.apk \
                  -o -name SystemUI.odex \
                  -o -name SystemUI.vdex \
              \) \
              -print \
              > "$ROOT/panther-systemui-candidates.txt" \
              2>/dev/null \
              || true

          # ======================================================
          # RUNTIME DRIVER RESOLVER
          # ======================================================

          cat > "$SYS/bin/panther-driver-resolver" <<'RESOLVER'
          #!/system/bin/sh

          TAG="PantherDriverResolver"
          LOG="/data/local/tmp/panther-driver-resolver.log"

          mkdir -p /data/local/tmp 2>/dev/null || true

          logmsg() {
              echo "$*" >> "$LOG"
              log -t "$TAG" "$*" 2>/dev/null || true
          }

          if [ "$(getprop sys.panther.driver_resolver.ran)" = "1" ]; then
              exit 0
          fi

          setprop sys.panther.driver_resolver.ran 1

          logmsg "================================================"
          logmsg "Pixel 7 Panther compatibility resolver"
          logmsg "================================================"

          wait_path() {
              TARGET="$1"
              TIMEOUT="$2"
              I=0

              while [ "$I" -lt "$TIMEOUT" ]; do

                  if [ -e "$TARGET" ]; then
                      logmsg "AVAILABLE $TARGET"
                      return 0
                  fi

                  sleep 1
                  I=$((I + 1))

              done

              logmsg "TIMEOUT $TARGET"
              return 1
          }

          wait_path /vendor 180 || true
          wait_path /product 180 || true
          wait_path /system_ext 180 || true
          wait_path /odm 180 || true
          wait_path /vendor_dlkm 180 || true
          wait_path /odm_dlkm 180 || true

          find_exact() {
              NAME="$1"

              for ROOT in \
                  /vendor \
                  /product \
                  /system_ext \
                  /system \
                  /odm \
                  /vendor_dlkm \
                  /odm_dlkm \
                  /apex
              do

                  [ -d "$ROOT" ] || continue

                  RESULT="$(
                      find "$ROOT" \
                          -type f \
                          -name "$NAME" \
                          -print \
                          2>/dev/null \
                          | head -n 1
                  )"

                  if [ -n "$RESULT" ]; then
                      logmsg "FOUND $NAME -> $RESULT"
                      return 0
                  fi

              done

              logmsg "NOT FOUND $NAME"
              return 1
          }

          resolve() {
              find_exact "$1" || true
          }

          logmsg "===== WIFI ====="
          resolve android.hardware.wifi-service
          resolve android.hardware.wifi@1.0-service
          resolve libwifi-hal.so

          logmsg "===== BLUETOOTH ====="
          resolve android.hardware.bluetooth-service
          resolve android.hardware.bluetooth@1.1-service

          logmsg "===== CAMERA ====="
          resolve android.hardware.camera.provider-service
          resolve android.hardware.camera.provider@2.7-service
          resolve android.hardware.camera.provider@2.5-service

          logmsg "===== AUDIO ====="
          resolve android.hardware.audio.service
          resolve android.hardware.audio@7.0-impl.so
          resolve audio.primary.gs201.so

          logmsg "===== SENSORS ====="
          resolve android.hardware.sensors-service
          resolve android.hardware.sensors@2.1-service

          logmsg "===== FINGERPRINT ====="
          resolve android.hardware.biometrics.fingerprint-service
          resolve android.hardware.biometrics.fingerprint@2.1-service

          logmsg "===== NFC ====="
          resolve android.hardware.nfc-service
          resolve android.hardware.nfc@1.2-service

          logmsg "===== GNSS ====="
          resolve android.hardware.gnss-service
          resolve android.hardware.gnss@2.1-service

          logmsg "===== USB ====="
          resolve android.hardware.usb-service

          logmsg "===== RADIO ====="
          resolve android.hardware.radio-service
          resolve android.hardware.radio@2.0-service
          resolve android.hardware.radio@1.6-service

          logmsg "===== GPU ====="
          resolve vulkan.gs201.so
          resolve libGLES_mali.so

          logmsg "===== EUICC ====="
          resolve EuiccService

          logmsg "===== PROPERTIES ====="

          logmsg "brand=$(getprop ro.product.brand)"
          logmsg "manufacturer=$(getprop ro.product.manufacturer)"
          logmsg "model=$(getprop ro.product.model)"
          logmsg "device=$(getprop ro.product.device)"
          logmsg "product=$(getprop ro.product.name)"
          logmsg "board=$(getprop ro.product.board)"
          logmsg "platform=$(getprop ro.board.platform)"
          logmsg "android=$(getprop ro.build.version.release)"
          logmsg "sdk=$(getprop ro.build.version.sdk)"
          logmsg "fingerprint=$(getprop ro.build.fingerprint)"

          setprop sys.panther.driver_resolver.ready 1

          logmsg "Panther resolver finished."

          exit 0
          RESOLVER

          chmod 0755 \
              "$SYS/bin/panther-driver-resolver"

          # ======================================================
          # RESOLVER INIT
          # ======================================================

          cat > "$SYS/etc/init/panther-driver-resolver.rc" <<'RC'
          service panther-driver-resolver /system/bin/panther-driver-resolver
              class late_start
              user root
              group root system shell
              disabled
              oneshot

          on property:sys.boot_completed=1
              start panther-driver-resolver
          RC

          # ======================================================
          # DRIVER MAP
          # ======================================================

          cat > "$SYS/etc/panther-driver-map.txt" <<'MAP'
          Pixel 7 Panther Hardware Compatibility Map

          SYSTEM
          /system
          /system_ext
          /product
          /vendor
          /odm
          /vendor_dlkm
          /odm_dlkm
          /apex

          WIFI
          android.hardware.wifi-service
          android.hardware.wifi@1.0-service
          libwifi-hal.so

          BLUETOOTH
          android.hardware.bluetooth-service

          CAMERA
          android.hardware.camera.provider-service
          android.hardware.camera.provider@2.7-service

          AUDIO
          android.hardware.audio.service
          android.hardware.audio@7.0-impl.so
          audio.primary.gs201.so

          SENSORS
          android.hardware.sensors-service

          FINGERPRINT
          android.hardware.biometrics.fingerprint-service

          NFC
          android.hardware.nfc-service

          GNSS
          android.hardware.gnss-service

          USB
          android.hardware.usb-service

          RADIO
          android.hardware.radio-service

          GPU
          vulkan.gs201.so
          libGLES_mali.so

          EUICC
          EuiccService
          MAP

          # ======================================================
          # BOOT RESCUE
          # ======================================================

          if [ "$ENABLE_BOOT_RESCUE" = "1" ]; then

              cat > "$SYS/bin/panther-boot-rescue" <<'RESCUE'
          #!/system/bin/sh

          TAG="PantherBootRescue"

          BASE="/metadata/panther-rescue"

          if [ ! -d /metadata ] || [ ! -w /metadata ]; then
              BASE="/data/panther-rescue"
          fi

          mkdir -p "$BASE" 2>/dev/null || true

          LOG="$BASE/panther-boot-rescue.log"
          STATE="$BASE/state"
          ATTEMPTS="$BASE/attempts"

          logmsg() {
              echo "$(date '+%Y-%m-%d %H:%M:%S') $*" >> "$LOG"
              log -t "$TAG" "$*" 2>/dev/null || true
          }

          get_attempts() {
              if [ -f "$ATTEMPTS" ]; then
                  cat "$ATTEMPTS"
              else
                  echo 0
              fi
          }

          set_attempts() {
              echo "$1" > "$ATTEMPTS"
          }

          mkdir -p "$BASE/logs" 2>/dev/null || true

          MAX_REBOOTS="${BOOT_RESCUE_MAX_REBOOTS:-5}"
          TIMEOUT="${BOOT_RESCUE_TIMEOUT:-180}"

          logmsg "BOOT RESCUE ENGINE STARTED"

          echo "IN_PROGRESS" > "$STATE"

          I=0

          while [ "$I" -lt "$TIMEOUT" ]; do

              BOOT="$(getprop sys.boot_completed 2>/dev/null || true)"

              if [ "$BOOT" = "1" ]; then

                  logmsg "BOOT COMPLETED"

                  echo "SUCCESS" > "$STATE"

                  set_attempts 0

                  exit 0

              fi

              sleep 1

              I=$((I + 1))

          done

          logmsg "BOOT TIMEOUT AFTER ${TIMEOUT}s"

          ATTEMPT="$(get_attempts)"

          case "$ATTEMPT" in
              ''|*[!0-9]*)
                  ATTEMPT=0
                  ;;
          esac

          logmsg "Current rescue attempts: $ATTEMPT"

          LOGFILE="$BASE/logs/logcat.txt"

          logcat -b all -d \
              > "$LOGFILE" \
              2>&1 \
              || true

          if [ -d /sys/fs/pstore ]; then

              mkdir -p "$BASE/logs/pstore"

              cp -a \
                  /sys/fs/pstore/. \
                  "$BASE/logs/pstore/" \
                  2>/dev/null \
                  || true

          fi

          if [ -d /data/tombstones ]; then

              mkdir -p "$BASE/logs/tombstones"

              cp -a \
                  /data/tombstones/. \
                  "$BASE/logs/tombstones/" \
                  2>/dev/null \
                  || true

          fi

          ACTION="none"

          if grep -Eqi \
              "FATAL EXCEPTION.*system_server|Watchdog.*system_server" \
              "$LOGFILE" \
              2>/dev/null; then

              ACTION="clear_dex"

          elif grep -Eqi \
              "FATAL EXCEPTION.*com.android.systemui|SystemUI.*crash" \
              "$LOGFILE" \
              2>/dev/null; then

              ACTION="clear_systemui"

          elif grep -Eqi \
              "CANNOT LINK EXECUTABLE|dlopen failed" \
              "$LOGFILE" \
              2>/dev/null; then

              ACTION="linker_failure"

          elif grep -Eqi \
              "ClassNotFoundException|NoSuchMethodError|VerifyError" \
              "$LOGFILE" \
              2>/dev/null; then

              ACTION="dex_failure"

          elif grep -Eqi \
              "VINTF.*check failed|vintf.*FAIL" \
              "$LOGFILE" \
              2>/dev/null; then

              ACTION="vintf_failure"

          elif grep -Eqi \
              "apexd.*failed" \
              "$LOGFILE" \
              2>/dev/null; then

              ACTION="apex_failure"

          elif grep -Eqi \
              "fs_mgr.*mount.*failed" \
              "$LOGFILE" \
              2>/dev/null; then

              ACTION="mount_failure"

          elif grep -Eqi \
              "PackageManager.*Parsing.*failed" \
              "$LOGFILE" \
              2>/dev/null; then

              ACTION="package_failure"

          elif grep -Eqi \
              "avc: denied" \
              "$LOGFILE" \
              2>/dev/null; then

              ACTION="selinux_denial"

          elif grep -Eqi \
              "dm-verity" \
              "$LOGFILE" \
              2>/dev/null; then

              ACTION="verity"

          fi

          logmsg "Detected action: $ACTION"

          case "$ACTION" in

              clear_dex|dex_failure)

                  rm -rf \
                      /data/dalvik-cache \
                      /data/resource-cache \
                      2>/dev/null \
                      || true

                  ;;

              clear_systemui)

                  rm -rf \
                      /data/system/package_cache \
                      /data/system_ce/0/cache \
                      /data/user/0/com.android.systemui/cache \
                      2>/dev/null \
                      || true

                  ;;

              package_failure)

                  rm -rf \
                      /data/system/package_cache \
                      /data/system/package-dex \
                      2>/dev/null \
                      || true

                  ;;

              selinux_denial)

                  restorecon -RF \
                      /data \
                      2>/dev/null \
                      || true

                  ;;

              linker_failure|vintf_failure|apex_failure|mount_failure|verity)

                  logmsg "No destructive automatic repair for $ACTION."

                  ;;

              *)

                  logmsg "No automatic repair selected."

                  ;;

          esac

          ATTEMPT=$((ATTEMPT + 1))

          set_attempts "$ATTEMPT"

          if [ "$ATTEMPT" -ge "$MAX_REBOOTS" ]; then

              logmsg "Maximum rescue attempts reached."

              echo "SAFE_STOP" > "$STATE"

              exit 0

          fi

          echo "RESCUE_REBOOT" > "$STATE"

          sync

          reboot userspace 2>/dev/null \
              || reboot 2>/dev/null \
              || true

          exit 0
          RESCUE

              chmod 0755 \
                  "$SYS/bin/panther-boot-rescue"

              cat > "$SYS/etc/init/panther-boot-rescue.rc" <<'RC'
          service panther-boot-rescue /system/bin/panther-boot-rescue
              class core
              user root
              group root system log shell
              disabled
              oneshot

          on early-init
              start panther-boot-rescue
          RC

              cat > "$SYS/etc/panther-boot-errors.db" <<'DB'
          ID|PATTERN|ACTION|MAX
          system_server_fatal|FATAL EXCEPTION.*system_server|clear_dex|2
          systemui_fatal|FATAL EXCEPTION.*com.android.systemui|clear_systemui|2
          linker_failure|CANNOT LINK EXECUTABLE|collect_only|2
          linker_dlopen|dlopen failed|collect_only|2
          dex_failure|VerifyError|clear_dex|2
          class_failure|ClassNotFoundException|clear_dex|2
          method_failure|NoSuchMethodError|clear_dex|2
          vintf_failure|VINTF.*check failed|collect_only|1
          apex_failure|apexd.*failed|collect_only|1
          mount_failure|fs_mgr.*mount.*failed|collect_only|1
          avc_denial|avc: denied|restorecon|2
          package_failure|PackageManager.*Parsing.*failed|clear_package_cache|2
          verity_error|dm-verity|collect_only|0
          DB

          fi

          # ======================================================
          # FINAL REPORT
          # ======================================================

          cat > "$ROOT/panther-gsi-patch-report.txt" <<REPORT
          HyperOS → Google Pixel 7 Panther
          Compatibility Patch Report
          ================================================

          TARGET

          Brand: google
          Manufacturer: Google
          Model: Pixel 7
          Device: panther
          Product: panther
          Board: gs201

          Android: 16
          SDK: 36

          Build ID: BP2A.250605.031.A2
          Incremental: 13578606
          Security Patch: 2025-06-05

          Fingerprint:
          google/panther/panther:16/BP2A.250605.031.A2/13578606:user/release-keys

          PIXEL FACTORY

          ${FACTORY_URL:-not-specified}

          IMPORTANT

          Pixel vendor/ODM binaries are not blindly copied into /system.

          The factory image is used as a compatibility reference.

          The actual Pixel 7 vendor/ODM implementation remains
          responsible for the device hardware HAL stack.
          REPORT

          echo
          echo "============================================================"
          echo "Panther compatibility engine completed"
          echo "============================================================"

          echo "System root:"
          echo "$SYS"

          echo
          echo "Staged Pixel reference files:"

          find "$SYS/etc/panther-stock" \
              -type f \
              2>/dev/null \
              | wc -l
          PATCH_ENGINE

          chmod +x scripts/patch_hyperos_panther.sh

          bash -n scripts/patch_hyperos_panther.sh


      # ==========================================================
      # APPLY PATCH
      # ==========================================================

      - name: "🧩 Apply Pixel 7 Panther Compatibility"
        if: ${{ inputs.enable_aggressive_patches }}
        env:
          IMPORT_CONFIGS: "${{ inputs.import_framework_configs && '1' || '0' }}"
          IMPORT_APKS: "${{ inputs.import_missing_apks && '1' || '0' }}"
          VENDOR_REFERENCE: "${{ inputs.aggressive_vendor_reference && '1' || '0' }}"
          ENABLE_BOOT_RESCUE: "${{ inputs.enable_boot_rescue && '1' || '0' }}"
          BOOT_RESCUE_TIMEOUT: "${{ inputs.boot_rescue_timeout }}"
          BOOT_RESCUE_MAX_REBOOTS: "${{ inputs.boot_rescue_max_reboots }}"
          FACTORY_URL: "${{ inputs.factory_url }}"
        shell: bash
        run: |
          set -Eeuo pipefail

          bash \
            scripts/patch_hyperos_panther.sh \
            workspace/system_root \
            workspace/stock_pixel/partitions


      # ==========================================================
      # VALIDATE PATCH
      # ==========================================================

      - name: "🔍 Validate Panther Compatibility"
        shell: bash
        run: |
          set -Eeuo pipefail

          ROOT="workspace/system_root"

          if [ -d "$ROOT/system/system" ]; then
            SYS="$ROOT/system/system"
          elif [ -d "$ROOT/system" ]; then
            SYS="$ROOT/system"
          else
            SYS="$ROOT"
          fi

          echo "System:"
          echo "$SYS"

          REQUIRED=(
            "$SYS/build.prop"
            "$SYS/bin/panther-driver-resolver"
            "$SYS/etc/init/panther-driver-resolver.rc"
            "$SYS/etc/panther-driver-map.txt"
            "$SYS/etc/permissions/panther-hardware.xml"
            "$SYS/etc/permissions/panther-biometric.xml"
            "$SYS/etc/permissions/panther-euicc.xml"
            "$SYS/etc/sysconfig/panther-keyguard.xml"
          )

          if [ "${{ inputs.enable_boot_rescue }}" = "true" ]; then

            REQUIRED+=(
              "$SYS/bin/panther-boot-rescue"
              "$SYS/etc/init/panther-boot-rescue.rc"
              "$SYS/etc/panther-boot-errors.db"
            )

          fi

          for FILE in "${REQUIRED[@]}"; do

            if [ -f "$FILE" ]; then
              echo "PASS $FILE"
            else
              echo "FAIL $FILE"
              exit 1
            fi

          done

          echo
          echo "============================================================"
          echo "TARGET PROPERTIES"
          echo "============================================================"

          grep -E \
            '^(ro\.product\.brand|ro\.product\.manufacturer|ro\.product\.model|ro\.product\.device|ro\.product\.name|ro\.product\.board|ro\.board\.platform|ro\.build\.id|ro\.build\.version\.release|ro\.build\.version\.sdk|ro\.build\.version\.security_patch|ro\.build\.fingerprint|ro\.system\.build\.fingerprint|ro\.telephony\.euicc)=' \
            "$SYS/build.prop" \
            || true

          echo
          echo "============================================================"
          echo "PATCH REPORT"
          echo "============================================================"

          cat \
            "$ROOT/panther-stock-import-report.txt" \
            2>/dev/null \
            || true


      # ==========================================================
      # IMAGE SIZE
      # ==========================================================

      - name: "📐 Calculate Final Image Size"
        shell: bash
        run: |
          set -Eeuo pipefail

          ROOT="workspace/system_root"

          if [ -d "$ROOT/system/system" ]; then
            SOURCE="$ROOT/system/system"
          elif [ -d "$ROOT/system" ]; then
