name: "HyperOS GSI + Infinity X (eSIM/lockscreen/kernel) → Pixel 7 flashable zip"

on:
  workflow_dispatch:
    inputs:
      hyperos_url:
        description: "HyperOS treble GSI ZIP (contains system.img)"
        required: true
        type: string
        default: "https://ixpeering.dl.sourceforge.net/project/mystic-gsi-updates/HyperOS/Hyperos-dijun-16-OS3.0.9.0.WODCNXM-AB-20260114-MysticGSI.zip?viasf=1&fid=58e0467b397a4905&e=1791475984&st=6a-KoRIhsFCxX9xGCZkngw"
      infinityx_url:
        description: "Infinity X Pixel 7 (panther) OTA ZIP - source of eSIM, kernel, vendor"
        required: true
        type: string
        default: "https://gigenet.dl.sourceforge.net/project/infinity-x/panther/16/gapps/Project_Infinity-X-3.12-panther-26.08.2026-GAPPS-OFFICIAL.zip?viasf=1&fid=1961a3e072f3cc70&e=1791491165&st=nM2J_BqSLjdSjS4Wj5V82A"
      output_name:
        description: "Output name"
        required: true
        type: string
        default: "HyperOS-GSI-Pixel7"
      fs_type:
        description: "Filesystem for the repacked system.img"
        required: true
        type: choice
        default: "erofs"
        options:
          - "erofs"
          - "ext4"
      copy_pixel_overlays:
        description: "Copy Infinity X Pixel/Google/biometric/telephony overlays that HyperOS lacks"
        required: true
        type: boolean
        default: true
      build_firmware_bundle:
        description: "Add Pixel 7 bootloader + radio from factory image (fastboot bundle only)"
        required: true
        type: boolean
        default: true
      factory_url:
        description: "Pixel 7 factory image ZIP"
        required: false
        type: string
        default: "https://dl.google.com/dl/android/aosp/panther-bp4a.251205.006-factory-4455f800.zip"

env:
  W: ${{ github.workspace }}/workspace

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v5

      - name: "Free disk space"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: "Install dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils e2fsprogs erofs-utils \
            attr rsync xxd file unzip zip p7zip-full xz-utils zstd jq curl python3
          sudo apt-get clean

      - name: "Install payload-dumper-go"
        run: |
          set -euo pipefail
          mkdir -p tools/payload
          API_JSON="$(curl -fsSL -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/ssut/payload-dumper-go/releases/latest)"
          ASSET_URL="$(echo "$API_JSON" | jq -r '
            .assets[] | select(.name | test("linux.*(amd64|x86_64)"; "i")) | .browser_download_url' | head -n1)"
          [ -n "$ASSET_URL" ] || { echo "::error::no payload-dumper-go linux asset"; exit 1; }
          curl -fL --retry 5 --retry-all-errors -o tools/payload/pd.tar.gz "$ASSET_URL"
          tar -xzf tools/payload/pd.tar.gz -C tools/payload
          BIN="$(find tools/payload -type f -name 'payload-dumper-go' | head -n1)"
          chmod +x "$BIN"
          echo "PAYLOAD_DUMPER=$GITHUB_WORKSPACE/$BIN" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------- HyperOS
      - name: "Download HyperOS GSI and extract system.img"
        env:
          HYPEROS_URL: ${{ inputs.hyperos_url }}
        run: |
          set -euo pipefail
          mkdir -p "$W/dl" "$W/gsi" "$W/images/hyperos"

          # NOTE: SourceForge mirror links carry an expiry token (e=...). If this
          # 403s/404s, grab a fresh link from the project page and re-run.
          curl -fL --retry 8 --retry-delay 5 --retry-all-errors -A "Mozilla/5.0" \
            -o "$W/dl/hyperos.zip" "$HYPEROS_URL"

          unzip -q -o "$W/dl/hyperos.zip" -d "$W/gsi"
          rm -f "$W/dl/hyperos.zip"

          SRC="$(find "$W/gsi" -type f -iname 'system*.img*' | head -n1)"
          [ -n "$SRC" ] || { echo "::error::No system image found in the GSI zip"; find "$W/gsi" -type f; exit 1; }
          echo "Found: $SRC"

          case "$SRC" in
            *.xz)  xz -dc "$SRC" > "$W/images/hyperos/system.img" ;;
            *.zst) zstd -dc "$SRC" > "$W/images/hyperos/system.img" ;;
            *.7z)  7z x -y -o"$W/gsi/x" "$SRC" >/dev/null
                   mv "$(find "$W/gsi/x" -iname '*.img' | head -n1)" "$W/images/hyperos/system.img" ;;
            *.img) mv "$SRC" "$W/images/hyperos/system.img" ;;
            *) echo "::error::Unknown image type: $SRC"; exit 1 ;;
          esac
          rm -rf "$W/gsi"

          # sparse -> raw
          if [ "$(dd if="$W/images/hyperos/system.img" bs=1 count=4 2>/dev/null | xxd -p)" = "3aff26ed" ] || \
             [ "$(dd if="$W/images/hyperos/system.img" bs=1 count=4 2>/dev/null | xxd -p)" = "ed26ff3a" ]; then
            simg2img "$W/images/hyperos/system.img" "$W/images/hyperos/system.raw"
            mv "$W/images/hyperos/system.raw" "$W/images/hyperos/system.img"
          fi
          ls -lh "$W/images/hyperos"
          df -h /

      # ------------------------------------------------------------- Infinity X
      - name: "Download Infinity X OTA and dump Pixel 7 partitions"
        env:
          INFINITYX_URL: ${{ inputs.infinityx_url }}
        run: |
          set -euo pipefail
          mkdir -p "$W/dl" "$W/ixota" "$W/images/ix"

          curl -fL --retry 8 --retry-delay 5 --retry-all-errors -A "Mozilla/5.0" \
            -o "$W/dl/ix.zip" "$INFINITYX_URL"
          unzip -q -o "$W/dl/ix.zip" payload.bin -d "$W/ixota" || \
            unzip -q -o "$W/dl/ix.zip" -d "$W/ixota"
          rm -f "$W/dl/ix.zip"
          PL="$(find "$W/ixota" -type f -name payload.bin | head -n1)"
          [ -n "$PL" ] || { echo "::error::No payload.bin in Infinity X zip"; exit 1; }

          # Dump only what we need (one call per partition so a missing one never aborts)
          for p in system system_ext product \
                   boot init_boot vendor_boot vendor_kernel_boot dtbo pvmfw \
                   vendor vendor_dlkm system_dlkm odm odm_dlkm \
                   vbmeta vbmeta_system vbmeta_vendor; do
            "$PAYLOAD_DUMPER" -p "$p" -o "$W/images/ix" "$PL" >/dev/null 2>&1 \
              && echo "dumped $p" || echo "skip   $p (not in payload)"
          done
          rm -rf "$W/ixota"
          ls -lh "$W/images/ix"
          df -h /

      # -------------------------------------------------- unpack HyperOS system
      - name: "Unpack HyperOS system.img into a writable tree"
        shell: sudo -E bash -eo pipefail {0}
        run: |
          mkdir -p "$W/mnt/hy" "$W/tree"

          is_erofs() { [ "$(dd if="$1" bs=1 skip=1024 count=4 2>/dev/null | xxd -p)" = "e2e1f5e0" ]; }

          IMG="$W/images/hyperos/system.img"
          if is_erofs "$IMG"; then
            mount -t erofs -o loop,ro "$IMG" "$W/mnt/hy" || fsck.erofs --extract="$W/mnt/hy" "$IMG"
          else
            mount -t ext4 -o loop,ro,noload "$IMG" "$W/mnt/hy"
          fi

          rsync -aHAX --numeric-ids "$W/mnt/hy"/ "$W/tree"/
          umount "$W/mnt/hy" 2>/dev/null || true
          rm -f "$IMG"

          # Locate the real system root (the dir that holds build.prop)
          if   [ -f "$W/tree/system/build.prop" ]; then SYS="$W/tree/system"
          elif [ -f "$W/tree/build.prop" ];        then SYS="$W/tree"
          else SYS="$(dirname "$(find "$W/tree" -maxdepth 3 -name build.prop | head -n1)")"; fi
          [ -f "$SYS/build.prop" ] || { echo "::error::build.prop not found in GSI"; exit 1; }
          echo "SYS=$SYS" >> "$GITHUB_ENV"
          echo "System root: $SYS"
          grep -E '^ro\.(system\.)?build\.(version\.release|fingerprint|id)=' "$SYS/build.prop" || true
          df -h /

      # ------------------------------------------- eSIM / lockscreen / Pixel bits
      - name: "Patch GSI: Infinity X eUICC + lockscreen/biometric + Pixel compat"
        shell: sudo -E bash -eo pipefail {0}
        env:
          COPY_OVERLAYS: ${{ inputs.copy_pixel_overlays }}
        run: |
          set -euo pipefail

          IX="$W/images/ix"
          mkdir -p "$W/mnt/ix_system" "$W/mnt/ix_system_ext" "$W/mnt/ix_product"

          is_erofs() {
            [ -f "$1" ] &&
            [ "$(dd if="$1" bs=1 skip=1024 count=4 2>/dev/null | xxd -p)" = "e2e1f5e0" ]
          }

          is_sparse() {
            [ -f "$1" ] &&
            [ "$(dd if="$1" bs=1 count=4 2>/dev/null | xxd -p)" = "3aff26ed" ]
          }

          normalize_img() {
            local IMG="$1"
            [ -f "$IMG" ] || return 0
            if is_sparse "$IMG"; then
              local RAW="${IMG}.raw"
              echo "== converting sparse image: $(basename "$IMG")"
              simg2img "$IMG" "$RAW"
              mv -f "$RAW" "$IMG"
            fi
          }

          mnt() {
            local IMG="$1"
            local DEST="$2"

            [ -f "$IMG" ] || {
              echo "== missing Infinity X image: $IMG"
              return 0
            }

            normalize_img "$IMG"
            mkdir -p "$DEST"

            if is_erofs "$IMG"; then
              mount -t erofs -o loop,ro "$IMG" "$DEST"
            else
              mount -t ext4 -o loop,ro,noload "$IMG" "$DEST"
            fi
          }

          # Mount only the partitions used as component sources.
          mnt "$IX/system.img"     "$W/mnt/ix_system"
          mnt "$IX/system_ext.img" "$W/mnt/ix_system_ext"
          mnt "$IX/product.img"    "$W/mnt/ix_product"

          # GSI layout: system_ext/product live below the extracted system root.
          declare -A MAP=(
            ["$W/mnt/ix_system"]="$SYS"
            ["$W/mnt/ix_system_ext"]="$SYS/system_ext"
            ["$W/mnt/ix_product"]="$SYS/product"
          )

          # A GSI may contain product/system_ext as symlinks or placeholder files.
          # Convert only non-directory destinations to real directories so the
          # Infinity X files can be merged into the single repacked system image.
          ensure_merge_dir() {
            local D="$1"

            if [ -d "$D" ]; then
              return 0
            fi

            if [ -L "$D" ] || [ -e "$D" ]; then
              local BACKUP="${D}.hyperos-original"
              rm -rf "$BACKUP"
              mv "$D" "$BACKUP"
              echo "== moved non-directory GSI entry:"
              echo "   $D -> $BACKUP"
            fi

            mkdir -p "$D"
          }

          ensure_merge_dir "$SYS/system_ext"
          ensure_merge_dir "$SYS/product"

          # ---- 1. eSIM: remove HyperOS/MIUI eUICC bits, bring in Infinity X's
          echo "== removing existing eUICC components from GSI"
          find "$SYS" \( -iname '*euicc*' -o -iname '*esim*' \) \
            -not -path '*/lib*/*' -prune -exec rm -rf {} + 2>/dev/null || true

          for M in "${!MAP[@]}"; do
            D="${MAP[$M]}"
            [ -d "$M" ] || continue
            ensure_merge_dir "$D"
            echo "== eUICC from $M -> $D"

            # Copy matching app directories/files without overwriting existing GSI files.
            find "$M" \( -type d -o -type f \) \
              \( -iname '*euicc*' -o -iname '*esim*' \) \
              -not -path '*/lib*/*' \
              -not -path '*/oat/*' \
              -print0 |
            while IFS= read -r -d '' P; do
              REL="${P#$M/}"
              DEST="$D/$REL"

              # Do not copy a child that is already present.
              [ -e "$DEST" ] || [ -L "$DEST" ] && continue

              mkdir -p "$(dirname "$DEST")"
              cp -a "$P" "$DEST"
              echo "  + $REL"
            done

            # Google privapp permission whitelists.
            # Use an ix- prefix so HyperOS files are never overwritten.
            for X in \
              "$M"/etc/permissions/privapp-permissions-google*.xml \
              "$M"/etc/permissions/com.google.android.euicc*.xml \
              "$M"/etc/sysconfig/*google*euicc*.xml; do
              [ -f "$X" ] || continue
              SUB="$(dirname "${X#$M/}")"
              mkdir -p "$D/$SUB"
              cp -a "$X" "$D/$SUB/ix-$(basename "$X")"
              echo "  + $SUB/ix-$(basename "$X")"
            done
          done

          # ---- 2. Pixel framework/biometric/telephony overlays HyperOS lacks
          if [ "$COPY_OVERLAYS" = "true" ] && [ -d "$W/mnt/ix_product/overlay" ]; then
            ensure_merge_dir "$SYS/product/overlay"

            find "$W/mnt/ix_product/overlay" -maxdepth 1 -type f -name '*.apk' -print0 |
              while IFS= read -r -d '' O; do
                B="$(basename "$O")"

                if printf '%s\n' "$B" | grep -qiE \
                    'pixel|google|biometric|fingerprint|udfps|face|keyguard|telephony|panther|tensor'; then
                  if [ ! -e "$SYS/product/overlay/$B" ] && [ ! -L "$SYS/product/overlay/$B" ]; then
                    cp -a "$O" "$SYS/product/overlay/$B"
                    echo "  + overlay $B"
                  fi
                fi
              done
          fi

          # ---- 3. Biometric / lockscreen / telephony feature permission XMLs
          for M in "$W/mnt/ix_product" "$W/mnt/ix_system_ext" "$W/mnt/ix_system"; do
            D="${MAP[$M]}"
            [ -d "$M" ] || continue
            ensure_merge_dir "$D"

            for X in \
              "$M"/etc/permissions/android.hardware.{fingerprint,biometrics.face,telephony.euicc,telephony.subscription,telephony.data,telephony.ims,security.keystore,hardware_keystore,strongbox_keystore,device_unique_attestation}*.xml \
              "$M"/etc/permissions/android.software.{device_id_attestation,secure_lock_screen,verified_boot,credentials}*.xml; do
              [ -f "$X" ] || continue

              SUB="$(dirname "${X#$M/}")"
              DEST="$D/$SUB/$(basename "$X")"
              mkdir -p "$(dirname "$DEST")"

              if [ ! -e "$DEST" ] && [ ! -L "$DEST" ]; then
                cp -a "$X" "$DEST"
                echo "  + feature $(basename "$X")"
              fi
            done
          done

          # ---- 4. Build props for Pixel 7 compatibility
          cat >> "$SYS/build.prop" <<'PROPS'

          # --- Pixel 7 (panther) port additions ---
          # eSIM / dual-SIM (physical + eUICC)
          persist.radio.multisim.config=dsds
          ro.telephony.default_network=33,33
          # Don't bootloop on privapp perms from the imported Google/eUICC apps
          ro.control_privapp_permissions=log
          # Keep keyguard/biometric services on the Pixel vendor HALs
          ro.boot.hypervisor.vm.supported=true
          PROPS

          # Remove the YAML shell indentation from the appended properties.
          sed -i 's/^ \{10\}//' "$SYS/build.prop"

          # ---- 5. Stale compiled artifacts - regenerate on first boot
          find "$SYS" -type d \( -name oat -o -name dalvik-cache \) \
            -prune -exec rm -rf {} + 2>/dev/null || true

          for M in "$W/mnt/ix_system" "$W/mnt/ix_system_ext" "$W/mnt/ix_product"; do
            umount "$M" 2>/dev/null || true
          done

          # These are source images only; the patched contents are now in $W/tree.
          rm -f "$IX/system.img" "$IX/system_ext.img" "$IX/product.img"
          ls -ld "$SYS" "$SYS/system_ext" "$SYS/product"

      # --------------------------------------------------------------- repack
      - name: "Repack patched system.img"
        shell: sudo -E bash -eo pipefail {0}
        env:
          FS_TYPE: ${{ inputs.fs_type }}
        run: |
          OUT="$W/final_images"
          mkdir -p "$OUT"
          TREE="$W/tree"

          if [ "$FS_TYPE" = "erofs" ]; then
            mkfs.erofs -zlz4hc -T 1230768000 "$OUT/system.img" "$TREE"
          else
            BYTES=$(du -sb "$TREE" | cut -f1)
            SIZE=$(( BYTES * 112 / 100 / 4096 * 4096 + 64*1024*1024 ))
            truncate -s "$SIZE" "$OUT/system.img"
            mke2fs -q -t ext4 -b 4096 -L system -O ^has_journal -d "$TREE" "$OUT/system.img"
            e2fsck -fy "$OUT/system.img" || true
            resize2fs -M "$OUT/system.img" || true
          fi
          rm -rf "$TREE"
          ls -lh "$OUT"

          # ---- Kernel stuff + Pixel vendor from Infinity X
          IX="$W/images/ix"
          for p in boot init_boot vendor_boot vendor_kernel_boot dtbo pvmfw \
                   vendor vendor_dlkm system_dlkm odm odm_dlkm \
                   vbmeta vbmeta_system vbmeta_vendor; do
            [ -f "$IX/$p.img" ] && mv "$IX/$p.img" "$OUT/$p.img"
          done

          # Disable AVB verification inside the vbmeta images (flags = 3), required for a GSI
          for v in vbmeta vbmeta_system vbmeta_vendor; do
            [ -f "$OUT/$v.img" ] || continue
            printf '\x03' | dd of="$OUT/$v.img" bs=1 seek=123 count=1 conv=notrunc 2>/dev/null
            echo "patched AVB flags in $v.img"
          done
          chown -R "$SUDO_UID:$SUDO_GID" "$W/final_images" 2>/dev/null || true
          ls -lh "$OUT"

      - name: "Fetch bootloader + radio from Pixel 7 factory image"
        if: ${{ inputs.build_firmware_bundle }}
        env:
          FACTORY_URL: ${{ inputs.factory_url }}
        run: |
          set -euo pipefail
          mkdir -p "$W/fw" "$W/dl"
          curl -fL --retry 8 --retry-delay 5 --retry-all-errors \
            -o "$W/dl/factory.zip" "$FACTORY_URL"
          unzip -j -o "$W/dl/factory.zip" '*/bootloader-*.img' '*/radio-*.img' -d "$W/fw"
          rm -f "$W/dl/factory.zip"
          ls -lh "$W/fw"

      # ------------------------------------------------------ package + signing
      - name: "Build flashable packages and sign them"
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
          OTA_PRIVATE_KEY_B64: ${{ secrets.OTA_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/out"
          IMGS="$W/final_images"
          rm -rf "$OUT" "$W/pkg_ota" "$W/pkg_fb"
          mkdir -p "$OUT" "$W/pkg_ota/images" "$W/pkg_fb/images" "$W/pkg_fb/fw"

          # A persistent repository secret is required. A new key generated on
          # every run would NOT be a useful trust identity.
          [ -n "${OTA_PRIVATE_KEY_B64:-}" ] || {
            echo "::error::Missing repository secret OTA_PRIVATE_KEY_B64"
            echo "::error::Create it with:"
            echo "::error::  openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out ota-private.pem"
            echo "::error::Then store: base64 -w0 ota-private.pem as OTA_PRIVATE_KEY_B64"
            exit 1
          }

          printf '%s' "$OTA_PRIVATE_KEY_B64" | base64 -d > "$W/ota-private.pem"
          chmod 600 "$W/ota-private.pem"
          openssl pkey -in "$W/ota-private.pem" -check -noout
          openssl pkey -in "$W/ota-private.pem" -pubout -out "$OUT/ota-public-key.pem"

          PUB_SHA256="$(openssl pkey -pubin -in "$OUT/ota-public-key.pem" -outform DER 2>/dev/null |
            sha256sum | awk '{print $1}')"
          echo "Signing public-key SHA-256: $PUB_SHA256"
          printf '%s\n' "$PUB_SHA256" > "$OUT/ota-public-key.sha256"

          # ==============================================================
          # A) Fastboot / fastbootd bundle
          # ==============================================================
          cp "$IMGS"/*.img "$W/pkg_fb/images/"
          cp "$W"/fw/*.img "$W/pkg_fb/fw/" 2>/dev/null || true

          cat > "$W/pkg_fb/flash-all.sh" <<'EOF'
          #!/usr/bin/env bash
          # Pixel 7 (panther) - HyperOS GSI + Infinity X kernel/vendor/eSIM
          # Bootloader must be UNLOCKED. Needs current Android platform-tools.
          set -euo pipefail
          cd "$(dirname "$0")"
          FB="${FASTBOOT:-fastboot}"

          echo "== Pixel 7 Panther signed-package preflight =="
          echo "This script flashes boot/vendor/system components and wipes userdata."
          read -r -p "Type YES to continue: " A
          [ "$A" = "YES" ] || exit 1

          command -v sha256sum >/dev/null ||
            { echo "sha256sum is required"; exit 1; }

          [ -f OTA-MANIFEST.sha256 ] || {
            echo "OTA-MANIFEST.sha256 missing"; exit 1;
          }

          sha256sum -c OTA-MANIFEST.sha256

          SLOT="$($FB getvar current-slot 2>&1 | awk '/current-slot/{print $2}' | tail -n1)"
          [ -n "$SLOT" ] || SLOT=a
          echo "Flashing slot _$SLOT"

          BL="$(ls fw/bootloader-*.img 2>/dev/null | head -n1 || true)"
          RD="$(ls fw/radio-*.img 2>/dev/null | head -n1 || true)"

          if [ -n "$BL" ]; then
            "$FB" flash "bootloader_$SLOT" "$BL"
            "$FB" reboot bootloader
            sleep 5
          fi

          if [ -n "$RD" ]; then
            "$FB" flash "radio_$SLOT" "$RD"
            "$FB" reboot bootloader
            sleep 5
          fi

          for p in boot init_boot vendor_boot vendor_kernel_boot dtbo pvmfw; do
            [ -f "images/$p.img" ] &&
              "$FB" flash "${p}_$SLOT" "images/$p.img"
          done

          for v in vbmeta vbmeta_system vbmeta_vendor; do
            [ -f "images/$v.img" ] &&
              "$FB" --disable-verity --disable-verification flash \
                "${v}_$SLOT" "images/$v.img"
          done

          "$FB" reboot fastboot
          sleep 8

          "$FB" delete-logical-partition "product_$SLOT" || true
          "$FB" delete-logical-partition "system_ext_$SLOT" || true

          for p in vendor vendor_dlkm system_dlkm odm odm_dlkm system; do
            [ -f "images/$p.img" ] &&
              "$FB" flash "${p}_$SLOT" "images/$p.img"
          done

          "$FB" -w
          "$FB" reboot
          EOF

          sed -i 's/^          //' "$W/pkg_fb/flash-all.sh"
          chmod +x "$W/pkg_fb/flash-all.sh"

          # Manifest covers every flashable image in the fastboot bundle.
          (
            cd "$W/pkg_fb"
            find images -type f -print0 | sort -z | xargs -0 sha256sum
            find fw -type f -print0 | sort -z | xargs -0 -r sha256sum
          ) > "$W/pkg_fb/OTA-MANIFEST.sha256"

          (
            cd "$W/pkg_fb"
            zip -0 -r -q "$OUT/${OUTPUT_NAME}-fastboot.zip" .
          )

          openssl dgst -sha256 \
            -sign "$W/ota-private.pem" \
            -out "$OUT/${OUTPUT_NAME}-fastboot.zip.sig" \
            "$OUT/${OUTPUT_NAME}-fastboot.zip"

          sha256sum "$OUT/${OUTPUT_NAME}-fastboot.zip" \
            > "$OUT/${OUTPUT_NAME}-fastboot.zip.sha256"

          # ==============================================================
          # B) Recovery-flashable OTA-style package
          # ==============================================================
          mkdir -p "$W/pkg_ota/META-INF/com/google/android"
          cp "$IMGS"/*.img "$W/pkg_ota/images/"

          cat > "$W/pkg_ota/META-INF/com/android/metadata" <<'EOF'
          ota-type=AB
          pre-device=panther
          post-device=panther
          post-build=google/panther/panther:16/BP4A.251205.006:userdebug/test-keys
          ota-required-cache=0
          EOF

          # Manifest covers every image and metadata file that the installer uses.
          (
            cd "$W/pkg_ota"
            find images -type f -print0 | sort -z | xargs -0 sha256sum
            sha256sum META-INF/com/android/metadata
          ) > "$W/pkg_ota/OTA-MANIFEST.sha256"

          # Sign the manifest itself with the custom key.
          openssl dgst -sha256 \
            -sign "$W/ota-private.pem" \
            -out "$W/pkg_ota/OTA-MANIFEST.sha256.sig" \
            "$W/pkg_ota/OTA-MANIFEST.sha256"

          printf '%s\n' "$PUB_SHA256" > "$W/pkg_ota/OTA-PUBLIC-KEY-SHA256"

          cat > "$W/pkg_ota/META-INF/com/google/android/updater-script" <<'EOF'
          #MAGIC
          EOF

          cat > "$W/pkg_ota/META-INF/com/google/android/update-binary" <<'EOF'
          #!/sbin/sh
          # Pixel 7 Panther recovery installer.
          # The package's RSA signature MUST be verified on a trusted host before
          # flashing. Recovery also verifies every payload SHA-256 before writing.
          OUTFD=/proc/self/fd/$2
          ZIP="$3"

          ui_print() {
            echo "ui_print $1" > "$OUTFD"
            echo "ui_print" > "$OUTFD"
          }

          abort() {
            ui_print "ERROR: $1"
            exit 1
          }

          [ "$(getprop ro.product.device)" = "panther" ] ||
          [ "$(getprop ro.product.vendor.device)" = "panther" ] ||
            abort "This OTA is for Pixel 7 (panther) only"

          SLOT="$(getprop ro.boot.slot_suffix)"
          [ -n "$SLOT" ] || SLOT="_a"
          ui_print "Target slot: $SLOT"

          command -v sha256sum >/dev/null 2>&1 ||
            abort "sha256sum is required by this recovery"

          TMP="/tmp/panther-ota-manifest.$$"
          unzip -p "$ZIP" OTA-MANIFEST.sha256 > "$TMP" 2>/dev/null ||
            abort "OTA-MANIFEST.sha256 missing"

          ui_print "Verifying OTA payload hashes..."

          while IFS= read -r LINE; do
            FILE="$(printf '%s' "$LINE" | awk '{print $2}')"
            EXPECTED="$(printf '%s' "$LINE" | awk '{print $1}')"

            [ -n "$FILE" ] || continue
            [ -n "$EXPECTED" ] || abort "Malformed OTA manifest"

            ACTUAL="$(
              unzip -p "$ZIP" "$FILE" 2>/dev/null |
              sha256sum | awk '{print $1}'
            )"

            [ "$ACTUAL" = "$EXPECTED" ] ||
              abort "Integrity check failed: $FILE"
          done < "$TMP"

          rm -f "$TMP"
          ui_print "All OTA payload hashes verified."

          zsize() {
            unzip -l "$ZIP" "images/$1.img" 2>/dev/null |
              awk '/images\// {print $1; exit}'
          }

          flash_part() {
            N="$1"
            T="$2"
            SZ="$(zsize "$N")"
            [ -n "$SZ" ] || return 0

            if [ "$T" = "dyn" ]; then
              DEV="/dev/block/mapper/$N$SLOT"
            else
              DEV="/dev/block/by-name/$N$SLOT"
            fi

            if [ ! -e "$DEV" ]; then
              [ "$T" = "dyn" ] &&
                abort "$DEV missing; use the fastboot package instead"
              ui_print "Skipping $N: device node missing"
              return 0
            fi

            if [ "$T" = "dyn" ]; then
              CUR="$(blockdev --getsize64 "$DEV" 2>/dev/null || echo 0)"

              if [ "$SZ" -gt "$CUR" ]; then
                command -v lptools >/dev/null 2>&1 ||
                  abort "$N$SLOT is too small; use fastbootd"

                ui_print "Resizing $N$SLOT to $SZ bytes"
                lptools resize "$N$SLOT" "$SZ" ||
                  abort "Resize failed: $N$SLOT"
              fi
            fi

            ui_print "Flashing $N$SLOT"
            unzip -p "$ZIP" "images/$N.img" |
              dd of="$DEV" bs=4M 2>/dev/null ||
              abort "Write failed: $N"
          }

          if command -v lptools >/dev/null 2>&1; then
            lptools remove "product$SLOT" 2>/dev/null || true
            lptools remove "system_ext$SLOT" 2>/dev/null || true
          fi

          for p in boot init_boot vendor_boot vendor_kernel_boot dtbo pvmfw \
                   vbmeta vbmeta_system vbmeta_vendor; do
            flash_part "$p" raw
          done

          for p in vendor vendor_dlkm system_dlkm odm odm_dlkm system; do
            flash_part "$p" dyn
          done

          ui_print "OTA installation completed."
          ui_print "Wipe data before first boot if encryption/keymint state changed."
          exit 0
          EOF

          sed -i 's/^          //' "$W/pkg_ota/META-INF/com/google/android/updater-script"
          sed -i 's/^          //' "$W/pkg_ota/META-INF/com/google/android/update-binary"
          chmod +x "$W/pkg_ota/META-INF/com/google/android/update-binary"

          (
            cd "$W/pkg_ota"
            zip -0 -r -q "$OUT/${OUTPUT_NAME}-ota.zip" .
          )

          # Detached signature over the COMPLETE OTA ZIP.
          openssl dgst -sha256 \
            -sign "$W/ota-private.pem" \
            -out "$OUT/${OUTPUT_NAME}-ota.zip.sig" \
            "$OUT/${OUTPUT_NAME}-ota.zip"

          sha256sum "$OUT/${OUTPUT_NAME}-ota.zip" \
            > "$OUT/${OUTPUT_NAME}-ota.zip.sha256"

          # Trusted-host verification helper.
          cat > "$OUT/verify-ota.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          ZIP="${1:?usage: ./verify-ota.sh package-ota.zip [public-key.pem]}"
          KEY="${2:-ota-public-key.pem}"

          [ -f "$ZIP" ] || { echo "Missing ZIP: $ZIP"; exit 1; }
          [ -f "$ZIP.sig" ] || { echo "Missing signature: $ZIP.sig"; exit 1; }
          [ -f "$KEY" ] || { echo "Missing public key: $KEY"; exit 1; }

          echo "== Public-key fingerprint =="
          openssl pkey -pubin -in "$KEY" -outform DER |
            sha256sum

          echo "== ZIP SHA-256 =="
          sha256sum "$ZIP"

          echo "== RSA-4096 signature =="
          openssl dgst -sha256 -verify "$KEY" \
            -signature "$ZIP.sig" "$ZIP"

          echo "== Result =="
          echo "Signature and ZIP integrity are valid."
          EOF
          chmod +x "$OUT/verify-ota.sh"

          cp "$OUT/ota-public-key.pem" \
            "$OUT/${OUTPUT_NAME}-ota-public-key.pem"

          # Never leave the private key in the workspace/artifacts.
          shred -u "$W/ota-private.pem" 2>/dev/null ||
            rm -f "$W/ota-private.pem"

          echo "== Final artifacts =="
          ls -lh "$OUT"

      - name: "Verify packages before upload"
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/out"

          ./verify-ota.sh \
            "${OUTPUT_NAME}-ota.zip" \
            "${OUTPUT_NAME}-ota-public-key.pem"

          openssl dgst -sha256 -verify \
            "${OUTPUT_NAME}-ota-public-key.pem" \
            -signature "${OUTPUT_NAME}-fastboot.zip.sig" \
            "${OUTPUT_NAME}-fastboot.zip"

          sha256sum -c "${OUTPUT_NAME}-ota.zip.sha256"
          sha256sum -c "${OUTPUT_NAME}-fastboot.zip.sha256"

      - name: "Upload signed OTA + fastboot packages"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: |
            out/*.zip
            out/*.sig
            out/*.sha256
            out/*public-key.pem
            out/ota-public-key.sha256
            out/verify-ota.sh
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
