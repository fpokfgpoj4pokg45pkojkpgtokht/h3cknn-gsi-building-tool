name: "HyperOS Treble → Pixel 7 Panther (TD1A base + AP3A compatibility merge)"

on:
  workflow_dispatch:
    inputs:
      work_dir:
        description: "Directory containing system.img and both factory ZIPs"
        required: true
        type: string
        default: "/home/sal/_work"
      output_dir:
        description: "Output directory on the self-hosted runner"
        required: true
        type: string
        default: "/home/sal/_work/panther-merged-output"

permissions:
  contents: read

jobs:
  merge-panther:
    # Run on your own Ubuntu PC, where /home/sal/_work already exists.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180

    env:
      WORK_DIR: ${{ inputs.work_dir }}
      OUTPUT_DIR: ${{ inputs.output_dir }}
      SYSTEM_BYTES: "8375186227"
      VENDOR_BYTES: "838860800"

    steps:
      - name: Check inputs and install required tools
        shell: bash
        run: |
          set -Eeuo pipefail
          for cmd in findmnt mount umount rsync mkfs.ext4 e2fsck tune2fs python3; do
            command -v "$cmd" >/dev/null || {
              echo "::error::Missing required command: $cmd"
              exit 1
            }
          done
          test -f "$WORK_DIR/system.img" || {
            echo "::error::Missing $WORK_DIR/system.img"
            exit 1
          }
          test -d "$WORK_DIR/td1a" || {
            echo "::error::Missing unpacked TD1A directory: $WORK_DIR/td1a"
            exit 1
          }
          test -d "$WORK_DIR/ap3a" || {
            echo "::error::Missing unpacked AP3A directory: $WORK_DIR/ap3a"
            exit 1
          }
          mkdir -p "$OUTPUT_DIR"
          echo "Inputs validated. Output: $OUTPUT_DIR"

      - name: Use existing unpacked TD1A and AP3A files
        shell: bash
        run: |
          set -Eeuo pipefail
          TD1A_ROOT="$WORK_DIR/td1a"
          AP3A_ROOT="$WORK_DIR/ap3a"

          # The factory contents are already unpacked by the user. Search those
          # directories in place; do not extract ZIPs or copy large partition
          # images into a staging directory.
          find_partition() {
            local root="$1" part="$2" result
            result="$(find "$root" -type f -name "${part}.img" -print -quit)"
            if [[ -z "$result" || ! -s "$result" ]]; then
              echo "::error::Could not find a non-empty ${part}.img under $root"
              echo "Available image files under $root:"
              find "$root" -type f -name '*.img' -printf '%p (%s bytes)\n' | head -100
              return 1
            fi
            printf '%s' "$result"
          }

          TD1A_VENDOR_IMG="$(find_partition "$TD1A_ROOT" vendor)"
          AP3A_VENDOR_IMG="$(find_partition "$AP3A_ROOT" vendor)"
          AP3A_SYSTEM_IMG="$(find_partition "$AP3A_ROOT" system)"
          AP3A_PRODUCT_IMG="$(find_partition "$AP3A_ROOT" product)"
          AP3A_SYSTEM_EXT_IMG="$(find_partition "$AP3A_ROOT" system_ext)"

          {
            echo "TD1A_VENDOR_IMG=$TD1A_VENDOR_IMG"
            echo "AP3A_VENDOR_IMG=$AP3A_VENDOR_IMG"
            echo "AP3A_SYSTEM_IMG=$AP3A_SYSTEM_IMG"
            echo "AP3A_PRODUCT_IMG=$AP3A_PRODUCT_IMG"
            echo "AP3A_SYSTEM_EXT_IMG=$AP3A_SYSTEM_EXT_IMG"
          } >> "$GITHUB_ENV"

          echo "Using existing unpacked images directly (no ZIP extraction or image staging copy)."
          printf 'TD1A vendor: %s\nAP3A vendor: %s\nAP3A system: %s\nAP3A product: %s\nAP3A system_ext: %s\n' \
            "$TD1A_VENDOR_IMG" "$AP3A_VENDOR_IMG" "$AP3A_SYSTEM_IMG" \
            "$AP3A_PRODUCT_IMG" "$AP3A_SYSTEM_EXT_IMG"

      - name: Prepare privileged mount workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          # Mounting loopback images requires root. This workflow intentionally
          # uses sudo only for mount/mkfs operations; source files are not altered.
          sudo -n true || {
            echo "::error::The self-hosted runner user needs passwordless sudo for mount, umount, and mkfs.ext4."
            echo "Configure narrowly scoped sudo permissions for these commands, or run the runner under an appropriate account."
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/panther-mnt"/{src,dst,td1a_vendor,ap3a_vendor,ap3a_system,ap3a_product,ap3a_system_ext}
          echo "MNT=$RUNNER_TEMP/panther-mnt" >> "$GITHUB_ENV"

      - name: Build system-new.img with targeted AP3A capability files
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC="$WORK_DIR/system.img"
          FINAL="$OUTPUT_DIR/system-new.img"
          OUT="$OUTPUT_DIR/.system-new.img.building.$$"
          MNT="$RUNNER_TEMP/panther-mnt"

          # Never truncate an existing final image or reuse a stale build file.
          if [[ -e "$FINAL" || -e "$OUT" ]]; then
            echo "::error::Refusing to overwrite existing $FINAL or build file $OUT"
            exit 1
          fi

          sudo e2fsck -fn "$SRC" || true
          trap 'set +e; for p in "$MNT/ap3a_system_ext" "$MNT/ap3a_product" "$MNT/ap3a_system" "$MNT/dst" "$MNT/src"; do mountpoint -q "$p" && sudo umount "$p"; done' EXIT

          truncate -s "$SYSTEM_BYTES" "$OUT"
          sudo mkfs.ext4 -F -L panther_system_new "$OUT"
          sudo mount -o loop,ro "$SRC" "$MNT/src"
          sudo mount -o loop "$OUT" "$MNT/dst"
          sudo rsync -aH --numeric-ids "$MNT/src/" "$MNT/dst/"

          sudo mount -o loop,ro "$AP3A_SYSTEM_IMG" "$MNT/ap3a_system"
          sudo mount -o loop,ro "$AP3A_PRODUCT_IMG" "$MNT/ap3a_product"
          sudo mount -o loop,ro "$AP3A_SYSTEM_EXT_IMG" "$MNT/ap3a_system_ext"

          # Copy only absent AP3A files whose path or filename clearly indicates
          # eSIM/eUICC, Wi-Fi, or lock-screen/Keyguard functionality. Do not
          # overlay whole partitions or overwrite HyperOS files.
          sudo python3 - "$MNT/ap3a_system" "$MNT/ap3a_product" "$MNT/ap3a_system_ext" "$MNT/dst" <<'PY'
          import os, sys, shutil
          sources, dst = sys.argv[1:4], sys.argv[4]
          dest_parts = ("system", "product", "system_ext")
          tokens = ("euicc", "esim", "wifi", "wlan", "keyguard", "lockscreen", "lock_screen")
          copied, skipped = [], []
          for src, part in zip(sources, dest_parts):
              for root, dirs, files in os.walk(src):
                  # Avoid scanning obvious non-runtime bulk content.
                  dirs[:] = [d for d in dirs if d not in (".git", "lost+found")]
                  for name in files:
                      source = os.path.join(root, name)
                      rel = os.path.relpath(source, src)
                      searchable = (rel + "/" + name).lower()
                      if not any(token in searchable for token in tokens):
                          continue
                      target = os.path.join(dst, part, rel)
                      rel_target = os.path.join(part, rel)
                      if os.path.lexists(target):
                          skipped.append(rel_target)
                          continue
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      shutil.copy2(source, target, follow_symlinks=False)
                      copied.append(rel_target)
          print("Targeted AP3A capability files copied:")
          print("\\n".join(sorted(set(copied))) if copied else "(none found)")
          print(f"Existing HyperOS paths preserved: {len(skipped)}")
          PY

          # Add missing identity defaults only; keep original build.prop backed up
          # inside the image and avoid duplicate keys.
          if [[ -f "$MNT/dst/system/build.prop" ]]; then
            sudo cp -a "$MNT/dst/system/build.prop" "$MNT/dst/system/build.prop.pre-panther-merge"
            for pair in "ro.product.device=panther" "ro.product.name=panther" "ro.product.board=gs201"; do
              key="${pair%%=*}"
              if ! sudo grep -qE "^[[:space:]]*${key}=" "$MNT/dst/system/build.prop"; then
                printf '%s\\n' "$pair" | sudo tee -a "$MNT/dst/system/build.prop" >/dev/null
              fi
            done
          fi

          sudo sync
          for p in "$MNT/ap3a_system_ext" "$MNT/ap3a_product" "$MNT/ap3a_system" "$MNT/dst" "$MNT/src"; do
            mountpoint -q "$p" && sudo umount "$p"
          done
          sudo e2fsck -fy "$OUT"
          sudo tune2fs -l "$OUT" | grep -E 'Filesystem volume name|Filesystem features|Block count|Block size'
          stat -c 'system-new.img build size: %s bytes' "$OUT"
          # Publish only after validation. Do not replace an existing final file.
          if [[ -e "$FINAL" ]]; then
            echo "::error::Output appeared during build; keeping build at $OUT"
            exit 1
          fi
          mv -n "$OUT" "$FINAL"
          [[ -f "$FINAL" ]] || { echo "::error::Could not publish system image"; exit 1; }
          trap - EXIT

      - name: Build vendor-new.img (800 MiB ext4) from TD1A vendor
        shell: bash
        run: |
          set -Eeuo pipefail
          FINAL="$OUTPUT_DIR/vendor-new.img"
          OUT="$OUTPUT_DIR/.vendor-new.img.building.$$"
          MNT="$RUNNER_TEMP/panther-mnt"
          if [[ -e "$FINAL" || -e "$OUT" ]]; then
            echo "::error::Refusing to overwrite existing $FINAL or build file $OUT"
            exit 1
          fi
          trap 'set +e; for p in "$MNT/ap3a_vendor" "$MNT/td1a_vendor" "$MNT/dst"; do mountpoint -q "$p" && sudo umount "$p"; done' EXIT
          truncate -s "$VENDOR_BYTES" "$OUT"
          sudo mkfs.ext4 -F -L panther_vendor_new "$OUT"

          cleanup_vendor() {
            set +e
            mountpoint -q "$MNT/ap3a_vendor" && sudo umount "$MNT/ap3a_vendor"
            mountpoint -q "$MNT/td1a_vendor" && sudo umount "$MNT/td1a_vendor"
            mountpoint -q "$MNT/dst" && sudo umount "$MNT/dst"
          }
          trap cleanup_vendor EXIT

          sudo mount -o loop,ro "$TD1A_VENDOR_IMG" "$MNT/td1a_vendor"
          sudo mount -o loop,ro "$AP3A_VENDOR_IMG" "$MNT/ap3a_vendor"
          sudo mount -o loop "$OUT" "$MNT/dst"

          # Keep TD1A vendor files as the base. The source vendor is read-only.
          sudo rsync -aH --numeric-ids "$MNT/td1a_vendor/" "$MNT/dst/"

          # AP3A vendor binaries and init/VINTF files are deliberately NOT copied
          # wholesale: cross-release vendor mixing is a common cause of bootloops.
          # Add only absent, clearly named eUICC support files if present. Do not
          # overwrite any TD1A files and do not import AP3A init scripts/manifests.
          sudo python3 - "$MNT/ap3a_vendor" "$MNT/dst" <<'PY'
          import os, sys, shutil
          src, dst = sys.argv[1:3]
          allowed_dirs = ("etc/permissions", "etc/sysconfig")
          tokens = ("euicc", "esim")
          copied = []
          for relbase in allowed_dirs:
              base = os.path.join(src, relbase)
              if not os.path.isdir(base):
                  continue
              for root, dirs, files in os.walk(base):
                  for name in files:
                      if not any(token in name.lower() for token in tokens):
                          continue
                      s = os.path.join(root, name)
                      rel = os.path.relpath(s, src)
                      d = os.path.join(dst, rel)
                      if os.path.exists(d):
                          continue
                      os.makedirs(os.path.dirname(d), exist_ok=True)
                      shutil.copy2(s, d)
                      copied.append(rel)
          print("AP3A eUICC metadata copied (only if absent):")
          print("\\n".join(copied) if copied else "(none found; no vendor files added)")
          PY

          sudo sync
          cleanup_vendor
          sudo e2fsck -fy "$OUT"
          sudo tune2fs -l "$OUT" | grep -E 'Filesystem volume name|Filesystem features|Block count|Block size'
          stat -c 'vendor-new.img build size: %s bytes' "$OUT"
          if [[ -e "$FINAL" ]]; then
            echo "::error::Output appeared during build; keeping build at $OUT"
            exit 1
          fi
          mv -n "$OUT" "$FINAL"
          [[ -f "$FINAL" ]] || { echo "::error::Could not publish vendor image"; exit 1; }
          trap - EXIT

      - name: Write merge report and checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "Panther HyperOS Treble merge report"
            echo "Generated: $(date -u +%FT%TZ)"
            echo "Base GSI: $WORK_DIR/system.img"
            echo "TD1A base: panther-td1a.221105.001"
            echo "AP3A donor: panther-ap3a.241005.015"
            echo "system-new.img requested size: $SYSTEM_BYTES bytes"
            echo "vendor-new.img requested size: $VENDOR_BYTES bytes"
            echo
            echo "AP3A system overlay: absent files with eSIM/eUICC, Wi-Fi/WLAN, or lock-screen/Keyguard path/name tokens only."
            echo "Existing HyperOS paths are preserved. Vendor uses TD1A as the base and adds only absent eUICC metadata."
            echo "Builds use temporary output names and are published only after filesystem validation."
            echo "Feature operation is not guaranteed; dependencies and hardware/vendor compatibility must be verified."
            echo
            ls -lh "$OUTPUT_DIR/system-new.img" "$OUTPUT_DIR/vendor-new.img"
            sha256sum "$OUTPUT_DIR/system-new.img" "$OUTPUT_DIR/vendor-new.img"
          } | tee "$OUTPUT_DIR/merge-report.txt"

      - name: Upload merged images
        uses: actions/upload-artifact@v4
        with:
          name: panther-hyperos-merged-images
          path: |
            ${{ inputs.output_dir }}/system-new.img
            ${{ inputs.output_dir }}/vendor-new.img
            ${{ inputs.output_dir }}/merge-report.txt
          if-no-files-found: error
          retention-days: 14
