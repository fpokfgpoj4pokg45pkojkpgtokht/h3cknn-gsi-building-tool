name: "🔧 Build HyperOS Treble GSI + Pixel 7 eUICC"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, Linux, X64]

    env:
      WORKSPACE: /home/sal/_work/h3cknn-gsi-building-tool/h3cknn-gsi-building-tool/workspace
      INPUT_IMG: /home/sal/_work/h3cknn-gsi-building-tool/h3cknn-gsi-building-tool/workspace/download/system.img
      OUTPUT_DIR: /home/sal/_work/h3cknn-gsi-building-tool/h3cknn-gsi-building-tool/workspace/output
      OUTPUT_IMG: /home/sal/_work/h3cknn-gsi-building-tool/h3cknn-gsi-building-tool/workspace/output/HyperOS-Treble-Pixel7-eSIM.img

    steps:
      - name: "📁 Prepare workspace"
        shell: bash
        run: |
          set -e

          mkdir -p "$OUTPUT_DIR"
          mkdir -p "$WORKSPACE/tmp"

          echo "Workspace:"
          echo "$WORKSPACE"

          echo "Input:"
          echo "$INPUT_IMG"

          ls -lh "$INPUT_IMG"

      - name: "🔍 Check required tools"
        shell: bash
        run: |
          set -e

          REQUIRED_TOOLS=(
            file
            mount
            umount
            rsync
            e2fsck
            resize2fs
            mkfs.ext4
            losetup
            blkid
          )

          for tool in "${REQUIRED_TOOLS[@]}"; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::Missing required tool: $tool"
              exit 1
            fi
          done

          echo "All required tools are available."

      - name: "🔍 Inspect original HyperOS system.img"
        shell: bash
        run: |
          set -e

          echo "===== FILE ====="
          file "$INPUT_IMG"

          echo
          echo "===== SIZE ====="
          ls -lh "$INPUT_IMG"

          echo
          echo "===== BLKID ====="
          blkid "$INPUT_IMG" || true

      - name: "📦 Convert sparse image if necessary"
        shell: bash
        run: |
          set -e

          mkdir -p "$WORKSPACE/tmp/original"

          if file "$INPUT_IMG" | grep -qi "Android sparse"; then
            echo "Android sparse image detected."

            if ! command -v simg2img >/dev/null 2>&1; then
              echo "::error::simg2img is required for sparse Android images."
              exit 1
            fi

            simg2img \
              "$INPUT_IMG" \
              "$WORKSPACE/tmp/original/system.raw.img"

          else
            echo "Image is already a raw filesystem image."

            cp \
              "$INPUT_IMG" \
              "$WORKSPACE/tmp/original/system.raw.img"
          fi

          file "$WORKSPACE/tmp/original/system.raw.img"

      - name: "🔧 Check original filesystem"
        shell: bash
        run: |
          set -e

          ORIGINAL="$WORKSPACE/tmp/original/system.raw.img"

          echo "Checking filesystem..."

          e2fsck -fy "$ORIGINAL" || true

          blkid "$ORIGINAL" || true

      - name: "💾 Create NEW system.img"
        shell: bash
        run: |
          set -e

          ORIGINAL="$WORKSPACE/tmp/original/system.raw.img"
          NEW="$WORKSPACE/tmp/new-system.img"

          ORIGINAL_SIZE=$(stat -c%s "$ORIGINAL")

          # Add 768 MiB of working space so the new image has room
          # for Treble/eUICC files and future modifications.
          EXTRA=$((768 * 1024 * 1024))

          NEW_SIZE=$((ORIGINAL_SIZE + EXTRA))

          echo "Original size: $ORIGINAL_SIZE bytes"
          echo "Extra space:   $EXTRA bytes"
          echo "New size:      $NEW_SIZE bytes"

          truncate -s "$NEW_SIZE" "$NEW"

          echo "Formatting NEW image as ext4..."

          mkfs.ext4 \
            -F \
            -L system \
            "$NEW"

          e2fsck -fy "$NEW"

          echo "NEW system.img created:"
          ls -lh "$NEW"

      - name: "📂 Mount original system.img read-only"
        shell: bash
        run: |
          set -e

          ORIGINAL="$WORKSPACE/tmp/original/system.raw.img"
          ORIGINAL_MOUNT="$WORKSPACE/tmp/original/mnt"

          mkdir -p "$ORIGINAL_MOUNT"

          sudo mount \
            -o loop,ro \
            "$ORIGINAL" \
            "$ORIGINAL_MOUNT"

          echo "Original image mounted READ-ONLY."

          mount | grep "$ORIGINAL_MOUNT"

      - name: "📂 Mount NEW system.img read-write"
        shell: bash
        run: |
          set -e

          NEW="$WORKSPACE/tmp/new-system.img"
          NEW_MOUNT="$WORKSPACE/tmp/new"

          mkdir -p "$NEW_MOUNT"

          sudo mount \
            -o loop,rw \
            "$NEW" \
            "$NEW_MOUNT"

          echo "NEW image mounted READ-WRITE."

          mount | grep "$NEW_MOUNT"

      - name: "📋 Copy HyperOS system contents"
        shell: bash
        run: |
          set -e

          ORIGINAL_MOUNT="$WORKSPACE/tmp/original/mnt"
          NEW_MOUNT="$WORKSPACE/tmp/new"

          echo "Copying HyperOS system contents..."

          sudo rsync \
            -aHAX \
            --numeric-ids \
            --info=progress2 \
            "$ORIGINAL_MOUNT"/ \
            "$NEW_MOUNT"/

          echo
          echo "HyperOS contents copied."

          echo
          echo "NEW filesystem:"
          sudo du -sh "$NEW_MOUNT"

      - name: "🧩 Add Treble configuration"
        shell: bash
        run: |
          set -e

          NEW_MOUNT="$WORKSPACE/tmp/new"

          sudo mkdir -p \
            "$NEW_MOUNT/etc/permissions" \
            "$NEW_MOUNT/etc/sysconfig" \
            "$NEW_MOUNT/etc/vintf"

          #
          # Generic Treble marker.
          #
          # This does NOT replace the actual vendor implementation.
          # Pixel 7 vendor/odm/firmware remain untouched.
          #

          if [ ! -f "$NEW_MOUNT/etc/permissions/android.hardware.telephony.euicc.xml" ]; then

            sudo tee \
              "$NEW_MOUNT/etc/permissions/android.hardware.telephony.euicc.xml" \
              >/dev/null <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<permissions>
    <feature name="android.hardware.telephony.euicc" />
</permissions>
EOF

          fi

          echo "Treble/eUICC permission configuration installed."

      - name: "📡 Add Pixel 7 eUICC configuration"
        shell: bash
        run: |
          set -e

          NEW_MOUNT="$WORKSPACE/tmp/new"

          sudo mkdir -p "$NEW_MOUNT/etc/sysconfig"

          sudo tee \
            "$NEW_MOUNT/etc/sysconfig/pixel7-euicc.xml" \
            >/dev/null <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<config>

    <!-- Pixel 7 eSIM / eUICC support -->

    <allow-in-power-save package="com.android.phone" />

    <allow-in-data-usage-save package="com.android.phone" />

</config>
EOF

          echo "Pixel 7 eUICC sysconfig installed."

      - name: "🔎 Inspect HyperOS eSIM stack"
        shell: bash
        run: |
          set -e

          NEW_MOUNT="$WORKSPACE/tmp/new"

          echo "===== eUICC FILES ====="

          sudo find "$NEW_MOUNT" \
            -iname '*euicc*' \
            -o -iname '*lpa*' \
            | head -100 || true

          echo
          echo "===== eUICC REFERENCES ====="

          sudo grep -Ril \
            -E 'EuiccService|euicc|embedded.?subscription' \
            "$NEW_MOUNT/system" \
            "$NEW_MOUNT/priv-app" \
            "$NEW_MOUNT/app" \
            2>/dev/null \
            | head -100 || true

      - name: "🔎 Verify important Treble directories"
        shell: bash
        run: |
          set -e

          NEW_MOUNT="$WORKSPACE/tmp/new"

          echo "Checking system image..."

          for path in \
            bin \
            etc \
            framework \
            lib \
            lib64 \
            priv-app \
            app
          do
            if [ -d "$NEW_MOUNT/$path" ]; then
              echo "[OK] /$path"
            else
              echo "[WARN] /$path missing"
            fi
          done

      - name: "💾 Sync filesystem"
        shell: bash
        run: |
          set -e

          NEW_MOUNT="$WORKSPACE/tmp/new"

          sync

          sudo e2fsck -fy \
            "$WORKSPACE/tmp/new-system.img" || true

      - name: "⏏️ Unmount NEW system.img"
        if: always()
        shell: bash
        run: |
          set +e

          NEW_MOUNT="$WORKSPACE/tmp/new"

          sync

          if mountpoint -q "$NEW_MOUNT"; then
            sudo umount "$NEW_MOUNT"
          fi

      - name: "⏏️ Unmount original system.img"
        if: always()
        shell: bash
        run: |
          set +e

          ORIGINAL_MOUNT="$WORKSPACE/tmp/original/mnt"

          if mountpoint -q "$ORIGINAL_MOUNT"; then
            sudo umount "$ORIGINAL_MOUNT"
          fi

      - name: "🧪 Final filesystem check"
        shell: bash
        run: |
          set -e

          NEW="$WORKSPACE/tmp/new-system.img"

          sudo e2fsck -fy "$NEW"

          echo
          echo "===== FINAL IMAGE ====="

          file "$NEW"
          blkid "$NEW" || true
          ls -lh "$NEW"

      - name: "📦 Convert output to Android sparse image"
        shell: bash
        run: |
          set -e

          NEW="$WORKSPACE/tmp/new-system.img"
          OUTPUT="$OUTPUT_IMG"

          if ! command -v img2simg >/dev/null 2>&1; then
            echo "::error::img2simg is required."
            exit 1
          fi

          img2simg \
            "$NEW" \
            "$OUTPUT"

          echo
          echo "Final GSI:"
          ls -lh "$OUTPUT"

          file "$OUTPUT"

      - name: "🔎 Final validation"
        shell: bash
        run: |
          set -e

          test -f "$OUTPUT_IMG"

          echo "======================================"
          echo " HyperOS Treble GSI build complete"
          echo "======================================"
          echo
          echo "Input:"
          echo "$INPUT_IMG"
          echo
          echo "Output:"
          echo "$OUTPUT_IMG"
          echo
          echo "Size:"
          ls -lh "$OUTPUT_IMG"
