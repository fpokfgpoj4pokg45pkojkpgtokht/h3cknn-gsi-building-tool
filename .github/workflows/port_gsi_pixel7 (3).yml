          chown 0:0 "$ROOT/etc/init/panther-props.rc"
          chmod 0644 "$ROOT/etc/init/panther-props.rc"

      # ============================================================
      # 18C. REMOVE CONFLICTING LUNARIS IDENTITY
      # ============================================================

      - name: "🧹 Remove conflicting GSI device identity"
        run: |
          set -euo pipefail

          ROOT="$SYSTEM_ROOT"
          BP="$ROOT/build.prop"

          python3 - "$BP" <<'PY'
          import sys
          from pathlib import Path

          bp = Path(sys.argv[1])

          remove_prefixes = (
              "ro.product.lunaris.",
              "ro.product.aosp.",
          )

          remove_keys = {
              "ro.product.vendor.device",
              "ro.product.vendor.name",
              "ro.product.vendor.model",
              "ro.product.vendor.brand",
              "ro.product.vendor.manufacturer",
          }

          lines = bp.read_text(errors="ignore").splitlines()

          out = []

          for line in lines:
              if "=" not in line or line.startswith("#"):
                  out.append(line)
                  continue

              key = line.split("=", 1)[0]

              if key in remove_keys:
                  continue

              if key.startswith(remove_prefixes):
                  continue

              out.append(line)

          bp.write_text("\n".join(out) + "\n")
          PY

      # ============================================================
      # 19. INIT SCRIPT
      # ============================================================

      - name: "🚀 Add Panther runtime init"
        run: |
          set -euo pipefail

          ROOT="$SYSTEM_ROOT"

          mkdir -p "$ROOT/etc/init"

          cat > "$ROOT/etc/init/panther-gsi.rc" <<'RC'
          on post-fs-data
              exec u:r:init:s0 root root -- /system/bin/panther_props.sh

          on boot
              exec u:r:init:s0 root root -- /system/bin/panther_props.sh

          on property:sys.boot_completed=1
              exec u:r:init:s0 root root -- /system/bin/panther_props.sh
          RC

          sudo chown 0:0 "$ROOT/etc/init/panther-gsi.rc"
          sudo chmod 644 "$ROOT/etc/init/panther-gsi.rc"

      # ============================================================
      # 20. VINTF VALIDATION
      # ============================================================

      - name: "🧪 Validate Panther VINTF/HAL compatibility"
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          ROOT="$SYSTEM_ROOT"

          {
            echo "===== LUNARIS/PANTHER COMPATIBILITY ====="
            echo
            echo "Target:"
            echo "  Device: $TARGET_DEVICE"
            echo "  Model: $TARGET_MODEL"
            echo "  Platform: $TARGET_PLATFORM"
            echo "  Android: $TARGET_ANDROID"
            echo "  SDK: $TARGET_SDK"
            echo "  Build: $TARGET_BUILD"
            echo "  Fingerprint: $TARGET_FINGERPRINT"
            echo

            echo "GSI properties:"
            grep -E \
              '^(ro\.build\.version|ro\.product\.|ro\.build\.fingerprint)' \
              "$ROOT/build.prop" \
              | head -80 || true

            echo
            echo "Vendor VINTF:"
            find "$W/extracted/vendor/vintf" \
              -type f \
              -maxdepth 2 \
              -print \
              2>/dev/null \
              | sort || true

            echo
            echo "ODM VINTF:"
            find "$W/extracted/odm/vintf" \
              -type f \
              -maxdepth 2 \
              -print \
              2>/dev/null \
              | sort || true

          } | tee "$W/logs/panther-compatibility.txt"

      # ============================================================
      # 21. FACTORY FIRMWARE BUNDLE
      # ============================================================

      - name: "📦 Build matching Panther firmware bundle"
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          F="$W/factory/image"
          B="$W/pixel"

          mkdir -p "$B"

          # These stay stock.
          for p in \
            boot \
            init_boot \
            vendor_boot \
            vendor_kernel_boot \
            dtbo \
            pvmfw \
            vbmeta \
            vbmeta_system \
            vbmeta_vendor \
            vendor \
            vendor_dlkm \
            system_dlkm \
            odm \
            odm_dlkm; do

            if [ -f "$F/$p.img" ]; then
              cp "$F/$p.img" "$B/$p.img"
            fi
          done

          cp \
            "$W/patched/system.img" \
            "$B/system.img"

          cat > "$B/flash_all.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          SYSTEM="$(realpath "${1:-system.img}")"

          fastboot getvar product 2>&1 |
            grep -qi panther ||
            {
              echo "ERROR: device is not Pixel 7 / panther"
              exit 1
            }

          echo "Flashing matching Panther boot chain..."

          for p in \
            boot \
            init_boot \
            vendor_boot \
            vendor_kernel_boot \
            dtbo \
            pvmfw; do

            [ -f "$p.img" ] &&
              fastboot flash --slot=all "$p" "$p.img"
          done

          if [ -f vbmeta.img ]; then
            fastboot flash \
              --slot=all \
              --disable-verity \
              --disable-verification \
              vbmeta \
              vbmeta.img
          fi

          for p in vbmeta_system vbmeta_vendor; do
            [ -f "$p.img" ] &&
              fastboot flash --slot=all "$p" "$p.img"
          done

          fastboot reboot fastboot

          sleep 10

          for p in \
            vendor \
            vendor_dlkm \
            system_dlkm \
            odm \
            odm_dlkm; do

            [ -f "$p.img" ] &&
              fastboot flash "$p" "$p.img"
          done

          fastboot flash system "$SYSTEM"

          echo
          echo "Wiping userdata because this changes framework/security state..."
          fastboot -w

          fastboot reboot
          SH

          chmod +x "$B/flash_all.sh"

          cat > "$B/README.txt" <<EOF
          Lunaris Android 16 → Google Pixel 7 Panther

          Hardware baseline:
            Device: panther
            Model: Pixel 7
            Platform: gs201
            Build: BP4A.251205.006
            SDK: 36

          IMPORTANT:
            This bundle uses the matching Panther boot/vendor stack.
            The Lunaris system image is the only modified major partition.

          Flash:
            ./flash_all.sh system.img

          This wipes userdata.
          Bootloader must be unlocked.
          EOF

          cd "$B"

          zip -qr \
            "$W/output/${{ inputs.output_name }}-panther-firmware.zip" \
            .

      # ============================================================
      # 22. FINAL IMAGE
      # ============================================================

      - name: "📦 Finalize system image"
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          IMG="$W/patched/system.img"
          OUT="$W/output/${{ inputs.output_name }}.img"

          sudo umount "$W/patched/mnt"

          e2fsck -fy "$IMG" || true

          resize2fs -M "$IMG"

          BLOCKS="$(
            dumpe2fs -h "$IMG" 2>/dev/null |
            awk '/^Block count:/{print $3}'
          )"

          BSIZE="$(
            dumpe2fs -h "$IMG" 2>/dev/null |
            awk '/^Block size:/{print $3}'
          )"

          truncate \
            -s $((BLOCKS * BSIZE)) \
            "$IMG"

          mv "$IMG" "$OUT"

          case "${{ inputs.fs_type }}" in
            ext4)
              ;;
            erofs)
              mkdir -p "$W/patched/erofs"

              sudo mount \
                -o loop,ro \
                "$OUT" \
                "$W/patched/erofs"

              sudo mkfs.erofs \
                -zlz4hc \
                -C16384 \
                "$W/output/${{ inputs.output_name }}.erofs.img" \
                "$W/patched/erofs"

              sudo umount "$W/patched/erofs"

              rm -f "$OUT"

              mv \
                "$W/output/${{ inputs.output_name }}.erofs.img" \
                "$OUT"
              ;;
          esac

          xz -T0 -6 "$OUT"

      # ============================================================
      # 23. VALIDATION
      # ============================================================

      - name: "🧪 Final validation"
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          OUT="$W/output"

          IMAGE="$OUT/${{ inputs.output_name }}.img.xz"

          test -s "$IMAGE"
          test -s "$OUT/${{ inputs.output_name }}-panther-firmware.zip"

          xz -t "$IMAGE"

          unzip -t \
            "$OUT/${{ inputs.output_name }}-panther-firmware.zip"

          sha256sum \
            "$OUT"/* \
            > "$OUT/SHA256SUMS.txt"

          echo
          echo "===== FINAL BUILD ====="
          ls -lh "$OUT"
          echo
          cat "$W/logs/panther-compatibility.txt"

      # ============================================================
      # 24. ARTIFACT
      # ============================================================

      - name: "📤 Upload artifacts"
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.output_name }}
          path: |
            workspace/output/*.img.xz
            workspace/output/*.zip
            workspace/output/SHA256SUMS.txt
            workspace/logs/*.txt
          retention-days: 14

      # ============================================================
      # 25. RELEASE
      # ============================================================

      - name: "🏷️ Create release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="v$(date -u +%Y.%m.%d-%H%M%S)-${GITHUB_RUN_ID}"

          gh release create "$TAG" \
            workspace/output/*.img.xz \
            workspace/output/*.zip \
            workspace/output/SHA256SUMS.txt \
            workspace/logs/*.txt \
            --title "${{ inputs.output_name }}" \
            --generate-notes
