name: "🔧 Lunaris A16 GSI → Pixel 7 Panther BP4A (eSIM + UDFPS + KeyMint)"

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: "📥 Lunaris A16 GSI (.img.xz or .img)"
        required: true
        type: string
        default: "https://github.com/Doze-off/Lunaris-AOSP_gsi/releases/download/2026-09-20/Lunaris-3.12-GSI_treble_arm64-ab-GAPPS-Official-20260920.img.xz"

      output_name:
        description: "📛 Output image name"
        required: true
        type: string
        default: "Lunaris_Pixel7_BP4A_eSIM"

      fs_type:
        description: "💾 Output filesystem"
        required: true
        type: choice
        options:
          - ext4
          - erofs
        default: ext4

      factory_image_url:
        description: "📱 Exact Pixel 7 Panther BP4A factory ZIP"
        required: true
        type: string
        default: "https://dl.google.com/dl/android/aosp/panther-bp4a.251205.006-factory-4455f800.zip"

      inject_factory_props:
        description: "🧬 Import Panther BP4A properties"
        required: true
        type: boolean
        default: true

      inject_device_configs:
        description: "🧩 Import Panther hardware configs/VINTF/permissions"
        required: true
        type: boolean
        default: true

      inject_biometrics:
        description: "🔐 Import Panther UDFPS/fingerprint configuration"
        required: true
        type: boolean
        default: true

      inject_esim:
        description: "📶 Import Panther eUICC stack"
        required: true
        type: boolean
        default: true

      inject_framework_compat:
        description: "🧱 Add Android framework compatibility"
        required: true
        type: boolean
        default: true

      build_lunaris_sources:
        description: "🛠️ Build Lunaris sources when supplied"
        required: true
        type: boolean
        default: false

      lunaris_manifest_url:
        description: "Optional Lunaris manifest URL"
        required: false
        type: string
        default: "https://github.com/Lunaris-AOSP/android"

      lunaris_branch:
        description: "Lunaris source branch"
        required: true
        type: string
        default: "16.2"

      require_same_api:
        description: "🛡️ Fail if GSI/vendor API levels differ"
        required: true
        type: boolean
        default: true

jobs:
  port:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    permissions:
      contents: write

    env:
      TARGET_DEVICE: panther
      TARGET_MODEL: "Pixel 7"
      TARGET_BRAND: google
      TARGET_MANUFACTURER: Google
      TARGET_PLATFORM: gs201
      TARGET_ANDROID: "16"
      TARGET_SDK: "36"
      TARGET_BUILD: BP4A.251205.006
      TARGET_INCREMENTAL: "14401865"
      TARGET_PATCH: "2025-12-05"
      TARGET_FINGERPRINT: "google/panther/panther:16/BP4A.251205.006/14401865:user/release-keys"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: "📦 Checkout"
        uses: actions/checkout@v5

      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================

      - name: "⚙️ Install Android image tools"
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            android-sdk-libsparse-utils \
            e2fsprogs \
            erofs-utils \
            xz-utils \
            rsync \
            attr \
            xxd \
            file \
            unzip \
            zip \
            cpio \
            lz4 \
            zstd \
            jq \
            python3 \
            python3-pip \
            git \
            git-lfs \
            curl \
            wget \
            bc \
            fd-find \
            ccache

          git lfs install

      # ============================================================
      # 4. WORKSPACE
      # ============================================================

      - name: "📁 Prepare workspace"
        shell: bash
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"

          mkdir -p \
            "$W/factory" \
            "$W/factory_mounts" \
            "$W/gsi" \
            "$W/gsi_mount" \
            "$W/patched" \
            "$W/output" \
            "$W/extracted" \
            "$W/pixel" \
            "$W/logs" \
            "$W/scripts"

          chmod 755 "$W"

      # ============================================================
      # 5. DOWNLOAD FACTORY
      # ============================================================

      - name: "📱 Download Panther BP4A factory image"
        env:
          FACTORY_URL: ${{ inputs.factory_image_url }}
        shell: bash
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"

          cd "$W/factory"

          curl \
            -fL \
            --retry 8 \
            --retry-delay 5 \
            --retry-all-errors \
            -o factory.zip \
            "$FACTORY_URL"

          EXPECTED="$(
            basename "${FACTORY_URL%%\?*}" |
            sed -nE 's/.*-factory-([0-9a-fA-F]{8})\.zip$/\1/p'
          )"

          if [ -n "$EXPECTED" ]; then
            ACTUAL="$(sha256sum factory.zip | cut -c1-8)"

            echo "Factory checksum:"
            echo "  Expected: $EXPECTED"
            echo "  Actual:   $ACTUAL"

            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::Factory ZIP checksum mismatch"
              exit 1
            fi
          fi

          rm -rf unpacked image

          unzip -q factory.zip -d unpacked

          IMAGE_ZIP="$(
            find unpacked \
              -type f \
              -name 'image-panther-*.zip' |
              head -n1
          )"

          if [ -z "$IMAGE_ZIP" ]; then
            echo "::error::No image-panther ZIP found"
            exit 1
          fi

          unzip -q "$IMAGE_ZIP" -d image

          rm -f factory.zip

          echo "Factory images:"
          find image \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
            sort

      # ============================================================
      # 6. VALIDATE FACTORY
      # ============================================================

      - name: "🔎 Validate Panther factory"
        shell: bash
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          F="$W/factory/image"

          for p in vendor boot vendor_boot vbmeta system; do
            if [ ! -f "$F/$p.img" ]; then
              echo "::error::Missing Panther $p.img"
              exit 1
            fi
          done

          echo "Panther factory validated."

      # ============================================================
      # 7. EXTRACT HARDWARE
      # ============================================================

      - name: "🧩 Extract Panther hardware partitions"
        if: ${{ inputs.inject_device_configs }}
        shell: bash
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          F="$W/factory/image"
          X="$W/extracted"

          hex_at() {
            dd \
              if="$1" \
              bs=1 \
              skip="$2" \
              count="$3" \
              2>/dev/null |
              xxd -p
          }

          mount_partition() {
            local image="$1"
            local name="$2"
            local raw="$X/${name}.raw"
            local mount="$W/factory_mounts/$name"

            mkdir -p "$mount"

            if [ "$(hex_at "$image" 0 4)" = "ed26ff3a" ]; then
              simg2img "$image" "$raw"
              image="$raw"
            fi

            sudo mount -o loop,ro "$image" "$mount"

            echo "$mount"
          }

          copy_dir() {
            local src="$1"
            local dst="$2"

            if [ -d "$src" ]; then
              mkdir -p "$dst"
              sudo rsync \
                -a \
                --no-owner \
                --no-group \
                "$src/" \
                "$dst/"
            fi
          }

          # ------------------------------
          # VENDOR
          # ------------------------------

          if [ -f "$F/vendor.img" ]; then
            V="$(mount_partition "$F/vendor.img" vendor)"

            mkdir -p "$X/vendor"

            copy_dir "$V/etc/vintf"       "$X/vendor/etc/vintf"
            copy_dir "$V/etc/permissions" "$X/vendor/etc/permissions"
            copy_dir "$V/etc/firmware"    "$X/vendor/etc/firmware"
            copy_dir "$V/etc/bluetooth"   "$X/vendor/etc/bluetooth"
            copy_dir "$V/etc/thermal"     "$X/vendor/etc/thermal"
            copy_dir "$V/etc/gnss"        "$X/vendor/etc/gnss"
            copy_dir "$V/etc/modem"        "$X/vendor/etc/modem"

            sudo umount "$V"
          fi

          # ------------------------------
          # ODM
          # ------------------------------

          if [ -f "$F/odm.img" ]; then
            O="$(mount_partition "$F/odm.img" odm)"

            mkdir -p "$X/odm"

            copy_dir "$O/etc/vintf"       "$X/odm/etc/vintf"
            copy_dir "$O/etc/permissions" "$X/odm/etc/permissions"

            sudo umount "$O"
          fi

          # ------------------------------
          # VENDOR DLKM
          # ------------------------------

          if [ -f "$F/vendor_dlkm.img" ]; then
            VDK="$(mount_partition "$F/vendor_dlkm.img" vendor_dlkm)"

            mkdir -p "$X/vendor_dlkm"

            copy_dir "$VDK/etc"   "$X/vendor_dlkm/etc"
            copy_dir "$VDK/lib"   "$X/vendor_dlkm/lib"
            copy_dir "$VDK/lib64" "$X/vendor_dlkm/lib64"

            sudo umount "$VDK"
          fi

          # ------------------------------
          # SYSTEM DLKM
          # ------------------------------

          if [ -f "$F/system_dlkm.img" ]; then
            SDKLM="$(mount_partition "$F/system_dlkm.img" system_dlkm)"

            mkdir -p "$X/system_dlkm"

            copy_dir "$SDKLM/etc"   "$X/system_dlkm/etc"
            copy_dir "$SDKLM/lib"   "$X/system_dlkm/lib"
            copy_dir "$SDKLM/lib64" "$X/system_dlkm/lib64"

            sudo umount "$SDKLM"
          fi

          sudo chown -R "$(id -u):$(id -g)" "$X"

      # ============================================================
      # 8. STOCK PROPERTIES
      # ============================================================

      - name: "🧬 Extract BP4A Panther properties"
        if: ${{ inputs.inject_factory_props }}
        shell: bash
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          F="$W/factory/image"
          P="$W/pixel"

          mkdir -p "$P"

          hex_at() {
            dd \
              if="$1" \
              bs=1 \
              skip="$2" \
              count="$3" \
              2>/dev/null |
              xxd -p
          }

          extract_prop_partition() {
            local part="$1"
            local image="$F/$part.img"
            local raw="$P/${part}.raw"
            local mnt="$W/factory_mounts/prop_$part"

            [ -f "$image" ] || return 0

            mkdir -p "$mnt"

            if [ "$(hex_at "$image" 0 4)" = "ed26ff3a" ]; then
              simg2img "$image" "$raw"
              image="$raw"
            fi

            sudo mount -o loop,ro "$image" "$mnt"

            if [ -f "$mnt/build.prop" ]; then
              sudo cp "$mnt/build.prop" "$P/${part}.build.prop"
            fi

            if [ -f "$mnt/system/build.prop" ]; then
              sudo cp "$mnt/system/build.prop" \
                "$P/${part}.system.build.prop"
            fi

            sudo umount "$mnt"
          }

          extract_prop_partition system
          extract_prop_partition system_ext
          extract_prop_partition product
          extract_prop_partition vendor
          extract_prop_partition odm

          sudo chown -R "$(id -u):$(id -g)" "$P"

          cat \
            "$P/system.build.prop" \
            "$P/system_ext.build.prop" \
            "$P/product.build.prop" \
            "$P/vendor.build.prop" \
            "$P/odm.build.prop" \
            2>/dev/null \
            > "$P/all-props.txt" || true

          grep -E \
            '^(ro\.product|ro\.build|ro\.vendor|ro\.odm|ro\.hardware)' \
            "$P/all-props.txt" \
            > "$P/panther-properties.txt" || true

      # ============================================================
      # 9. DOWNLOAD GSI
      # ============================================================

      - name: "📥 Download Lunaris GSI"
        env:
          ROM_URL: ${{ inputs.rom_url }}
        shell: bash
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"

          curl \
            -fL \
            --retry 8 \
            --retry-delay 5 \
            --retry-all-errors \
            -o "$W/gsi/input" \
            "$ROM_URL"

          if xz -t "$W/gsi/input" 2>/dev/null; then
            xz -dc \
              "$W/gsi/input" \
              > "$W/gsi/system.img"
          else
            mv \
              "$W/gsi/input" \
              "$W/gsi/system.img"
          fi

          rm -f "$W/gsi/input"

          test -s "$W/gsi/system.img"

      # ============================================================
      # 10. PREPARE WRITABLE EXT4
      # ============================================================

      - name: "🧱 Prepare writable Lunaris system"
        shell: bash
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"

          hex_at() {
            dd \
              if="$1" \
              bs=1 \
              skip="$2" \
              count="$3" \
              2>/dev/null |
              xxd -p
          }

          if [ "$(hex_at "$W/gsi/system.img" 0 4)" = "ed26ff3a" ]; then
            simg2img \
              "$W/gsi/system.img" \
              "$W/gsi/system.raw.img"

            mv \
              "$W/gsi/system.raw.img" \
              "$W/gsi/system.img"
          fi

          FS="unknown"

          if [ "$(hex_at "$W/gsi/system.img" 1080 2)" = "53ef" ]; then
            FS="ext4"
          elif [ "$(hex_at "$W/gsi/system.img" 1024 4)" = "e2e1f5e0" ]; then
            FS="erofs"
          fi

          echo "Detected GSI filesystem: $FS"

          if [ "$FS" = "unknown" ]; then
            echo "::error::Unknown GSI filesystem"
            file "$W/gsi/system.img"
            exit 1
          fi

          mkdir -p "$W/gsi_mount"

          if [ "$FS" = "ext4" ]; then
            sudo mount \
              -t ext4 \
              -o loop,ro,noload \
              "$W/gsi/system.img" \
              "$W/gsi_mount"
          else
            sudo mount \
              -t erofs \
              -o loop,ro \
              "$W/gsi/system.img" \
              "$W/gsi_mount"
          fi

          USED="$(
            sudo du -sb "$W/gsi_mount" |
            cut -f1
          )"

          SIZE=$((USED + USED / 5 + 768 * 1024 * 1024))

          truncate \
            -s "$SIZE" \
            "$W/patched/system.img"

          mkfs.ext4 \
            -q \
            -b 4096 \
            -L system \
            -O ^has_journal \
            "$W/patched/system.img"

          sudo mkdir -p "$W/patched/mnt"

          sudo mount \
            -o loop,rw \
            "$W/patched/system.img" \
            "$W/patched/mnt"

          sudo rsync \
            -aHAX \
            --numeric-ids \
            --no-devices \
            --no-specials \
            "$W/gsi_mount/" \
            "$W/patched/mnt/"

          sudo umount "$W/gsi_mount"

          # CRITICAL:
          # The copied GSI was mounted/copied as root.
          # Normalize it BEFORE any non-root Python/cp operations.
          sudo chown -R "$(id -u):$(id -g)" \
            "$W/patched/mnt"

          sudo find "$W/patched/mnt" \
            -type d \
            -exec chmod u+rwx {} +

          sudo find "$W/patched/mnt" \
            -type f \
            -exec chmod u+rw {} +

          echo "Patched filesystem permissions normalized."

      # ============================================================
      # 11. LOCATE SYSTEM ROOT
      # ============================================================

      - name: "🔎 Locate Android system root"
        shell: bash
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          ROOT="$W/patched/mnt"

          if [ -f "$ROOT/system/build.prop" ]; then
            SYSTEM_ROOT="$ROOT/system"
          elif [ -f "$ROOT/build.prop" ]; then
            SYSTEM_ROOT="$ROOT"
          else
            echo "::error::Lunaris build.prop not found"

            find "$ROOT" \
              -maxdepth 4 \
              -name build.prop \
              -print

            exit 1
          fi

          echo "SYSTEM_ROOT=$SYSTEM_ROOT"

          echo "SYSTEM_ROOT=$SYSTEM_ROOT" >> "$GITHUB_ENV"

          # Fix the exact issue that previously caused:
          # cp: cannot open .../system/build.prop: Permission denied
          sudo chown -R "$(id -u):$(id -g)" "$SYSTEM_ROOT"
          sudo chmod u+rw "$SYSTEM_ROOT/build.prop"

          test -r "$SYSTEM_ROOT/build.prop"
          test -w "$SYSTEM_ROOT/build.prop"

      # ============================================================
      # 12. PATCH IDENTITY
      # ============================================================

      - name: "📱 Apply exact Panther BP4A identity"
        if: ${{ inputs.inject_factory_props }}
        shell: bash
        run: |
          set -euo pipefail

          BP="$SYSTEM_ROOT/build.prop"
          PIXEL="$GITHUB_WORKSPACE/workspace/pixel"

          sudo chmod u+rw "$BP"
          sudo cp "$BP" "$PIXEL/gsi.build.prop"

          sudo chown "$(id -u):$(id -g)" \
            "$PIXEL/gsi.build.prop"

          sudo chmod 0644 "$PIXEL/gsi.build.prop"

          # Pass BP through the environment.
          # Do NOT use Path("$BP") inside a quoted heredoc.
          BP="$BP" python3 <<'PY'
          import os
          from pathlib import Path

          bp = Path(os.environ["BP"])

          values = {
              "ro.product.brand": "google",
              "ro.product.manufacturer": "Google",
              "ro.product.model": "Pixel 7",
              "ro.product.device": "panther",
              "ro.product.name": "panther",
              "ro.product.board": "gs201",

              "ro.product.product.brand": "google",
              "ro.product.product.manufacturer": "Google",
              "ro.product.product.model": "Pixel 7",
              "ro.product.product.device": "panther",
              "ro.product.product.name": "panther",

              "ro.product.system.brand": "google",
              "ro.product.system.manufacturer": "Google",
              "ro.product.system.model": "Pixel 7",
              "ro.product.system.device": "panther",
              "ro.product.system.name": "panther",

              "ro.build.product": "panther",
              "ro.build.device": "panther",
              "ro.build.brand": "google",
              "ro.build.manufacturer": "Google",
              "ro.build.model": "Pixel 7",

              "ro.build.version.release": "16",
              "ro.build.version.sdk": "36",
              "ro.build.version.security_patch": "2025-12-05",
              "ro.build.version.incremental": "14401865",

              "ro.build.fingerprint":
                  "google/panther/panther:16/BP4A.251205.006/14401865:user/release-keys",

              "ro.system.build.fingerprint":
                  "google/panther/panther:16/BP4A.251205.006/14401865:user/release-keys",

              "ro.product.first_api_level": "33",

              "ro.hardware": "gs201",
              "ro.board.platform": "gs201",
          }

          lines = bp.read_text(errors="ignore").splitlines()
          keys = set(values)

          out = []
          seen = set()

          for line in lines:
              if "=" in line and not line.startswith("#"):
                  key = line.split("=", 1)[0]

                  if key in keys:
                      out.append(f"{key}={values[key]}")
                      seen.add(key)
                      continue

              out.append(line)

          for key, value in values.items():
              if key not in seen:
                  out.append(f"{key}={value}")

          bp.write_text("\n".join(out) + "\n")

          print(f"Patched: {bp}")
          PY

          sudo chmod 0644 "$BP"

      # ============================================================
      # 13. COPY SAFE PANTHER CONFIGS
      # ============================================================

      - name: "🧩 Add Panther compatibility configuration"
        if: ${{ inputs.inject_device_configs }}
        shell: bash
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          ROOT="$SYSTEM_ROOT"

          mkdir -p \
            "$ROOT/etc/vintf" \
            "$ROOT/etc/permissions" \
            "$ROOT/etc/sysconfig"

          copy_matching() {
            local src="$1"
            local dst="$2"

            [ -d "$src" ] || return 0

            mkdir -p "$dst"

            find "$src" \
              -maxdepth 1 \
              -type f \
              -print0 |
            while IFS= read -r -d '' file; do
              sudo cp -a "$file" "$dst/"
            done
          }

          # Only copy framework-visible configuration.
          # Vendor binaries/services remain in the stock vendor stack.

          copy_matching \
            "$W/extracted/vendor/etc/permissions" \
            "$ROOT/etc/permissions"

          copy_matching \
            "$W/extracted/odm/etc/permissions" \
            "$ROOT/etc/permissions"

          cat > "$ROOT/etc/permissions/panther.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <permissions>
              <feature name="android.hardware.fingerprint" />
              <feature name="android.hardware.wifi" />
              <feature name="android.hardware.wifi.direct" />
              <feature name="android.hardware.bluetooth" />
              <feature name="android.hardware.camera" />
              <feature name="android.hardware.camera.autofocus" />
              <feature name="android.hardware.nfc" />
          </permissions>
          XML

          cat > "$ROOT/etc/sysconfig/panther.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <config>
              <allow-in-power-save package="com.android.systemui" />
              <allow-in-power-save package="com.android.phone" />
              <allow-in-power-save package="com.google.android.gms" />
          </config>
          XML

          sudo chown 0:0 \
            "$ROOT/etc/permissions/panther.xml" \
            "$ROOT/etc/sysconfig/panther.xml"

          sudo chmod 0644 \
            "$ROOT/etc/permissions/panther.xml" \
            "$ROOT/etc/sysconfig/panther.xml"

      # ============================================================
      # 14. BIOMETRICS
      # ============================================================

      - name: "🔐 Configure Pixel 7 UDFPS compatibility"
        if: ${{ inputs.inject_biometrics }}
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$SYSTEM_ROOT"

          mkdir -p \
            "$ROOT/etc/permissions" \
            "$ROOT/etc/sysconfig"

          cat > "$ROOT/etc/permissions/panther-biometric.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <permissions>
              <feature name="android.hardware.biometrics" />
              <feature name="android.hardware.fingerprint" />
          </permissions>
          XML

          cat > "$ROOT/etc/sysconfig/panther-biometric.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <config>
              <allow-in-power-save package="com.android.systemui" />
              <allow-in-power-save package="android" />
          </config>
          XML

          sudo chown 0:0 \
            "$ROOT/etc/permissions/panther-biometric.xml" \
            "$ROOT/etc/sysconfig/panther-biometric.xml"

          sudo chmod 0644 \
            "$ROOT/etc/permissions/panther-biometric.xml" \
            "$ROOT/etc/sysconfig/panther-biometric.xml"

      # ============================================================
      # 15. EUICC
      # ============================================================

      - name: "📶 Import Panther eSIM/eUICC stack"
        if: ${{ inputs.inject_esim }}
        shell: bash
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          ROOT="$SYSTEM_ROOT"

          hex_at() {
            dd \
              if="$1" \
              bs=1 \
              skip="$2" \
              count="$3" \
              2>/dev/null |
              xxd -p
          }

          mount_image() {
            local image="$1"
            local name="$2"
            local raw="$W/extracted/euicc-${name}.raw"
            local mnt="$W/factory_mounts/euicc-${name}"

            mkdir -p "$mnt"

            if [ "$(hex_at "$image" 0 4)" = "ed26ff3a" ]; then
              simg2img "$image" "$raw"
              image="$raw"
            fi

            sudo mount -o loop,ro "$image" "$mnt"

            echo "$mnt"
          }

          for part in system_ext product system; do
            IMG="$W/factory/image/$part.img"

            [ -f "$IMG" ] || continue

            MNT="$(mount_image "$IMG" "$part")"

            SEARCH_ROOT="$MNT"

            if [ -d "$MNT/system" ]; then
              SEARCH_ROOT="$MNT/system"
            fi

            # ------------------------------
            # Euicc APKs
            # ------------------------------

            for base in \
              "$SEARCH_ROOT/priv-app" \
              "$SEARCH_ROOT/app"; do

              [ -d "$base" ] || continue

              while IFS= read -r -d '' app; do
                NAME="$(basename "$app")"

                case "$NAME" in
                  *Euicc*|*EUICC*|*euicc*)
                    DEST="$ROOT/$part/$(dirname "${app#"$SEARCH_ROOT/"}")"

                    sudo mkdir -p "$DEST"

                    sudo rsync \
                      -a \
                      --no-owner \
                      --no-group \
                      "$app/" \
                      "$DEST/$NAME/"

                    echo "Imported eUICC package: $part/$NAME"
                    ;;
                esac
              done < <(
                find "$base" \
                  -mindepth 1 \
                  -maxdepth 1 \
                  -type d \
                  -print0
              )
            done

            # ------------------------------
            # eUICC permissions/sysconfig
            # ------------------------------

            for ETC in permissions sysconfig; do
              SRC="$SEARCH_ROOT/etc/$ETC"

              [ -d "$SRC" ] || continue

              mkdir -p "$ROOT/$part/etc/$ETC"

              find "$SRC" \
                -maxdepth 1 \
                -type f \
                \( \
                  -iname '*euicc*' \
                  -o -iname '*telephony*' \
                \) \
                -exec sudo cp -a {} \
                  "$ROOT/$part/etc/$ETC/" \; \
                || true
            done

            sudo umount "$MNT"
          done

          mkdir -p "$ROOT/etc/permissions"

          cat > \
            "$ROOT/etc/permissions/android.hardware.telephony.euicc.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <permissions>
              <feature name="android.hardware.telephony.euicc" />
          </permissions>
          XML

          sudo chown 0:0 \
            "$ROOT/etc/permissions/android.hardware.telephony.euicc.xml"

          sudo chmod 0644 \
            "$ROOT/etc/permissions/android.hardware.telephony.euicc.xml"

      # ============================================================
      # 16. FRAMEWORK COMPAT
      # ============================================================

      - name: "🧱 Add Android 16 Panther framework compatibility"
        if: ${{ inputs.inject_framework_compat }}
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$SYSTEM_ROOT"

          mkdir -p \
            "$ROOT/etc/sysconfig" \
            "$ROOT/etc/permissions"

          cat > "$ROOT/etc/sysconfig/panther-framework.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <config>
              <allow-in-power-save package="com.android.systemui" />
              <allow-in-power-save package="com.android.phone" />
              <allow-in-power-save package="com.google.android.gms" />
          </config>
          XML

          sudo chown 0:0 \
            "$ROOT/etc/sysconfig/panther-framework.xml"

          sudo chmod 0644 \
            "$ROOT/etc/sysconfig/panther-framework.xml"

          # Safe static properties only.
          cat >> "$ROOT/build.prop" <<'EOF'

          # ===== Panther BP4A compatibility =====
          ro.hardware=gs201
          ro.board.platform=gs201

          ro.product.cpu.abi=arm64-v8a
          ro.product.cpu.abilist=arm64-v8a
          ro.product.cpu.abilist32=

          ro.config.low_ram=false

          ro.sf.lcd_density=420

          ro.treble.enabled=true
          ro.vndk.version=36
          EOF

      # ============================================================
      # 16B. DERIVE VENDOR API
      # ============================================================

      - name: "🧬 Match Panther vendor API level"
        if: ${{ inputs.inject_factory_props }}
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$SYSTEM_ROOT"
          VP="$GITHUB_WORKSPACE/workspace/pixel/vendor.build.prop"

          VENDOR_API=""

          if [ -f "$VP" ]; then
            VENDOR_API="$(
              sed -n \
                's/^ro.vendor.api_level=//p' \
                "$VP" |
                head -n1
            )"
          fi

          if [ -n "$VENDOR_API" ]; then
            echo "Panther vendor API: $VENDOR_API"

            {
              echo
              echo "# Stock Panther vendor API"
              echo "ro.vendor.api_level=$VENDOR_API"
            } >> "$ROOT/build.prop"
          else
            echo "WARNING: Could not determine stock vendor API."
          fi

      # ============================================================
      # 17. DETECT REAL HARDWARE
      # ============================================================

      - name: "🔍 Detect real Panther HALs"
        shell: bash
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          ROOT="$SYSTEM_ROOT"
          REPORT="$W/logs/panther-hardware-detection.txt"

          : > "$REPORT"

          {
            echo "===== PANTHER HARDWARE DETECTION ====="
            echo
            echo "Potential hardware services/files:"
            find "$W/extracted" \
              -type f \
              \( \
                -iname '*fingerprint*' \
                -o -iname '*biometric*' \
                -o -iname '*keymint*' \
                -o -iname '*gatekeeper*' \
                -o -iname '*euicc*' \
                -o -iname '*secure*element*' \
              \) \
              2>/dev/null |
              sort |
              head -300

            echo
            echo "===== SERVICE FLAGS ====="

            KEYMINT=0
            FINGERPRINT=0
            GATEKEEPER=0
            EUICC=0

            if find "$W/extracted" \
                -type f \
                \( -iname '*keymint*' -o -iname '*keystore2*' \) \
                2>/dev/null |
                grep -q .; then
              KEYMINT=1
            fi

            if find "$W/extracted" \
                -type f \
                \( -iname '*fingerprint*' -o -iname '*biometric*' \) \
                2>/dev/null |
                grep -q .; then
              FINGERPRINT=1
            fi

            if find "$W/extracted" \
                -type f \
                -iname '*gatekeeper*' \
                2>/dev/null |
                grep -q .; then
              GATEKEEPER=1
            fi

            if find "$W/extracted" \
                -type f \
                -iname '*euicc*' \
                2>/dev/null |
                grep -q .; then
              EUICC=1
            fi

            echo "KeyMint:     $KEYMINT"
            echo "Fingerprint: $FINGERPRINT"
            echo "Gatekeeper:  $GATEKEEPER"
            echo "eUICC:       $EUICC"

            echo
            echo "===== CONDITIONAL PROPERTIES ====="

            if [ "$KEYMINT" = "1" ]; then
              cat >> "$ROOT/build.prop" <<'EOF'

          # Stock Panther KeyMint implementation detected.
          persist.sys.keymint.available=true
          persist.sys.keystore2.available=true
          EOF
            fi

            if [ "$FINGERPRINT" = "1" ]; then
              cat >> "$ROOT/build.prop" <<'EOF'

          # Stock Panther fingerprint implementation detected.
          persist.sys.fingerprint.available=true
          persist.sys.udfps.available=true
          EOF
            fi

            if [ "$GATEKEEPER" = "1" ]; then
              cat >> "$ROOT/build.prop" <<'EOF'

          # Stock Panther Gatekeeper implementation detected.
          persist.sys.gatekeeper.available=true
          EOF
            fi

            if [ "$EUICC" = "1" ]; then
              cat >> "$ROOT/build.prop" <<'EOF'

          # Stock Panther eUICC implementation detected.
          persist.sys.euicc.available=true
          persist.vendor.euicc.available=true
          EOF
            fi

          } | tee "$REPORT"

      # ============================================================
      # 18. SAFE RESETPROP RUNTIME
      # ============================================================

      - name: "🛠️ Install Panther resetprop runtime"
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$SYSTEM_ROOT"

          mkdir -p \
            "$ROOT/bin" \
            "$ROOT/etc/init"

          cat > "$ROOT/bin/panther_props.sh" <<'SH'
          #!/system/bin/sh

          # ==========================================================
          # Panther runtime compatibility
          #
          # This script NEVER pretends resetprop exists.
          # A real resetprop implementation must come from the
          # installed root framework (Magisk/KernelSU/etc.).
          # ==========================================================

          RESETPROP=""

          for candidate in \
              /system/bin/resetprop \
              /system/xbin/resetprop \
              /debug_ramdisk/system/bin/resetprop \
              /data/adb/magisk/resetprop \
              /data/adb/ksu/bin/resetprop; do

              if [ -x "$candidate" ]; then
                  RESETPROP="$candidate"
                  break
              fi
          done

          LOGTAG="panther-props"

          logmsg() {
              log -t "$LOGTAG" "$*" 2>/dev/null || true
          }

          if [ -z "$RESETPROP" ]; then
              logmsg "No resetprop implementation available; runtime immutable-property patch skipped"
              exit 0
          fi

          rp() {
              "$RESETPROP" -n "$1" "$2" 2>/dev/null || \
              "$RESETPROP" "$1" "$2" 2>/dev/null || true
          }

          logmsg "Using resetprop: $RESETPROP"

          # ==========================================================
          # PRODUCT IDENTITY
          # ==========================================================

          rp ro.product.brand google
          rp ro.product.manufacturer Google
          rp ro.product.model "Pixel 7"
          rp ro.product.device panther
          rp ro.product.name panther
          rp ro.product.board gs201

          rp ro.product.product.brand google
          rp ro.product.product.manufacturer Google
          rp ro.product.product.model "Pixel 7"
          rp ro.product.product.device panther
          rp ro.product.product.name panther

          rp ro.product.system.brand google
          rp ro.product.system.manufacturer Google
          rp ro.product.system.model "Pixel 7"
          rp ro.product.system.device panther
          rp ro.product.system.name panther

          # ==========================================================
          # BUILD
          # ==========================================================

          rp ro.build.product panther
          rp ro.build.device panther
          rp ro.build.brand google
          rp ro.build.manufacturer Google
          rp ro.build.model "Pixel 7"

          rp ro.build.version.release 16
          rp ro.build.version.sdk 36
          rp ro.product.first_api_level 33

          rp ro.build.version.security_patch 2025-12-05
          rp ro.build.version.incremental 14401865

          rp ro.build.fingerprint \
            "google/panther/panther:16/BP4A.251205.006/14401865:user/release-keys"

          rp ro.system.build.fingerprint \
            "google/panther/panther:16/BP4A.251205.006/14401865:user/release-keys"

          # ==========================================================
          # HARDWARE
          # ==========================================================

          rp ro.hardware gs201
          rp ro.board.platform gs201

          # Do NOT spoof:
          # ro.boot.verifiedbootstate
          # ro.boot.flash.locked
          # ro.boot.vbmeta.device_state
          # ro.crypto.state
          # ro.crypto.type

          # Those must come from the real boot/security stack.

          # ==========================================================
          # UDFPS
          # ==========================================================

          rp persist.sys.fingerprint.feature true
          rp persist.vendor.fingerprint.feature true

          rp persist.sys.fingerprint.available true
          rp persist.sys.udfps.available true

          rp persist.sys.udfps.enabled true
          rp persist.vendor.udfps.enabled true

          rp persist.sys.fingerprint.udfps true
          rp persist.vendor.fingerprint.udfps true

          # ==========================================================
          # LOCKSCREEN / BIOMETRICS
          # ==========================================================

          rp persist.sys.biometrics.enabled true

          # ==========================================================
          # EUICC
          # ==========================================================

          rp persist.sys.euicc.enabled true
          rp persist.vendor.euicc.enabled true

          rp persist.sys.euicc.available true
          rp persist.vendor.euicc.available true

          # ==========================================================
          # TREBLE
          # ==========================================================

          rp ro.treble.enabled true
          rp ro.vndk.version 36

          # ==========================================================
          # DISPLAY
          # ==========================================================

          rp ro.sf.lcd_density 420

          logmsg "Panther runtime properties applied"

          exit 0
          SH

          sudo chown 0:2000 "$ROOT/bin/panther_props.sh"
          sudo chmod 0755 "$ROOT/bin/panther_props.sh"

      # ============================================================
      # 19. INIT
      # ============================================================

      - name: "🚀 Add Panther runtime init"
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$SYSTEM_ROOT"

          mkdir -p "$ROOT/etc/init"

          cat > "$ROOT/etc/init/panther-gsi.rc" <<'RC'
          on post-fs-data
              exec u:r:init:s0 root root -- /system/bin/panther_props.sh

          on boot
              exec u:r:init:s0 root root -- /system/bin/panther_props.sh

          on property:sys.boot_completed=1
              exec u:r:init:s0 root root -- /system/bin/panther_props.sh
          RC

          sudo chown 0:0 \
            "$ROOT/etc/init/panther-gsi.rc"

          sudo chmod 0644 \
            "$ROOT/etc/init/panther-gsi.rc"

      # ============================================================
      # 20. NORMALIZE EVERYTHING
      # ============================================================

      - name: "🔐 Normalize patched system permissions"
        shell: bash
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          ROOT="$SYSTEM_ROOT"

          # This is the second protection against the exact
          # Permission denied error from the previous workflow.

          sudo chown -R "$(id -u):$(id -g)" "$W/patched/mnt"

          # System image files need to be readable during packaging.
          sudo find "$W/patched/mnt" \
            -type f \
            -exec chmod u+r {} +

          sudo chmod u+rw "$ROOT/build.prop"

          # Files we created should have Android-readable permissions.
          for f in \
            "$ROOT/build.prop" \
            "$ROOT/etc/permissions/"*.xml \
            "$ROOT/etc/sysconfig/"*.xml \
            "$ROOT/etc/init/"*.rc \
            "$ROOT/bin/panther_props.sh"; do

            [ -f "$f" ] || continue

            sudo chmod 0644 "$f" || true
          done

          sudo chmod 0755 \
            "$ROOT/bin/panther_props.sh"

          echo "Final build.prop permissions:"
          ls -l "$ROOT/build.prop"

          echo "Testing readability:"
          test -r "$ROOT/build.prop"

      # ============================================================
      # 21. VALIDATE VINTF / PROPERTIES
      # ============================================================

      - name: "🧪 Validate Panther compatibility"
        shell: bash
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          ROOT="$SYSTEM_ROOT"

          {
            echo "===== LUNARIS / PANTHER COMPATIBILITY ====="
            echo

            echo "Target:"
            echo "  Device:      $TARGET_DEVICE"
            echo "  Model:       $TARGET_MODEL"
            echo "  Platform:    $TARGET_PLATFORM"
            echo "  Android:     $TARGET_ANDROID"
            echo "  SDK:         $TARGET_SDK"
            echo "  Build:       $TARGET_BUILD"
            echo "  Patch:       $TARGET_PATCH"
            echo

            echo "===== BUILD PROPERTIES ====="

            grep -E \
              '^(ro\.product\.|ro\.build\.|ro\.hardware|ro\.board\.platform|ro\.vendor\.api_level|ro\.treble)' \
              "$ROOT/build.prop" |
              head -150 ||
              true

            echo
            echo "===== VENDOR VINTF ====="

            find "$W/extracted/vendor/etc/vintf" \
              -type f \
              -print \
              2>/dev/null |
              sort ||
              true

            echo
            echo "===== ODM VINTF ====="

            find "$W/extracted/odm/etc/vintf" \
              -type f \
              -print \
              2>/dev/null |
              sort ||
              true

          } | tee "$W/logs/panther-compatibility.txt"

      # ============================================================
      # 22. BUILD FIRMWARE BUNDLE
      # ============================================================

      - name: "📦 Build matching Panther firmware bundle"
        shell: bash
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          F="$W/factory/image"
          B="$W/pixel"

          mkdir -p "$B"

          for p in \
            boot \
            init_boot \
            vendor_boot \
            vendor_kernel_boot \
            dtbo \
            pvmfw \
            vbmeta \
            vbmeta_system \
            vbmeta_vendor \
            vendor \
            vendor_dlkm \
            system_dlkm \
            odm \
            odm_dlkm; do

            if [ -f "$F/$p.img" ]; then
              cp "$F/$p.img" "$B/$p.img"
            fi
          done

          cp \
            "$W/patched/system.img" \
            "$B/system.img"

          cat > "$B/flash_all.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          SYSTEM="$(realpath "${1:-system.img}")"

          PRODUCT="$(
            fastboot getvar product 2>&1 |
            sed -n 's/.*product: //p' |
            head -n1
          )"

          if [ "$PRODUCT" != "panther" ]; then
            echo "ERROR: Expected Pixel 7 panther."
            echo "Detected product: $PRODUCT"
            exit 1
          fi

          echo "Pixel 7 panther confirmed."

          for p in \
            boot \
            init_boot \
            vendor_boot \
            vendor_kernel_boot \
            dtbo \
            pvmfw; do

            if [ -f "$p.img" ]; then
              fastboot flash \
                --slot=all \
                "$p" \
                "$p.img"
            fi
          done

          if [ -f vbmeta.img ]; then
            fastboot flash \
              --slot=all \
              --disable-verity \
              --disable-verification \
              vbmeta \
              vbmeta.img
          fi

          for p in \
            vbmeta_system \
            vbmeta_vendor; do

            if [ -f "$p.img" ]; then
              fastboot flash \
                --slot=all \
                "$p" \
                "$p.img"
            fi
          done

          fastboot reboot fastboot

          sleep 10

          for p in \
            vendor \
            vendor_dlkm \
            system_dlkm \
            odm \
            odm_dlkm; do

            if [ -f "$p.img" ]; then
              fastboot flash "$p" "$p.img"
            fi
          done

          fastboot flash system "$SYSTEM"

          echo
          echo "Wiping userdata..."
          fastboot -w

          fastboot reboot
          SH

          chmod +x "$B/flash_all.sh"

          cat > "$B/README.txt" <<EOF
          Lunaris Android 16 -> Pixel 7 Panther

          Device:
            panther

          Model:
            Pixel 7

          Platform:
            gs201

          Android:
            16

          SDK:
            36

          Build:
            BP4A.251205.006

          System:
            Modified Lunaris GSI

          Other partitions:
            Matching stock Panther factory partitions

          IMPORTANT:
            Bootloader must be unlocked.
            This package wipes userdata.
          EOF

          cd "$B"

          zip -qr \
            "$W/output/${{ inputs.output_name }}-panther-firmware.zip" \
            .

      # ============================================================
      # 23. FINALIZE SYSTEM IMAGE
      # ============================================================

      - name: "📦 Finalize system image"
        shell: bash
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"

          IMG="$W/patched/system.img"
          OUT="$W/output/${{ inputs.output_name }}.img"

          sudo umount "$W/patched/mnt"

          e2fsck -fy "$IMG" || true

          resize2fs -M "$IMG"

          BLOCKS="$(
            dumpe2fs -h "$IMG" 2>/dev/null |
            awk '/^Block count:/{print $3}'
          )"

          BSIZE="$(
            dumpe2fs -h "$IMG" 2>/dev/null |
            awk '/^Block size:/{print $3}'
          )"

          if [ -z "$BLOCKS" ] || [ -z "$BSIZE" ]; then
            echo "::error::Could not determine final ext4 size"
            exit 1
          fi

          truncate \
            -s $((BLOCKS * BSIZE)) \
            "$IMG"

          mv "$IMG" "$OUT"

          case "${{ inputs.fs_type }}" in

            ext4)
              ;;

            erofs)
              EROFS_DIR="$W/patched/erofs"

              sudo mkdir -p "$EROFS_DIR"

              sudo mount \
                -o loop,ro \
                "$OUT" \
                "$EROFS_DIR"

              sudo mkfs.erofs \
                -zlz4hc \
                -C16384 \
                "$W/output/${{ inputs.output_name }}.erofs.img" \
                "$EROFS_DIR"

              sudo umount "$EROFS_DIR"

              rm -f "$OUT"

              mv \
                "$W/output/${{ inputs.output_name }}.erofs.img" \
                "$OUT"
              ;;

            *)
              echo "::error::Unsupported filesystem: ${{ inputs.fs_type }}"
              exit 1
              ;;
          esac

          xz \
            -T0 \
            -6 \
            "$OUT"

      # ============================================================
      # 24. FINAL VALIDATION
      # ============================================================

      - name: "🧪 Final validation"
        shell: bash
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          OUT="$W/output"

          IMAGE="$OUT/${{ inputs.output_name }}.img.xz"
          ZIP="$OUT/${{ inputs.output_name }}-panther-firmware.zip"

          test -s "$IMAGE"
          test -s "$ZIP"

          xz -t "$IMAGE"

          unzip -t "$ZIP"

          sha256sum \
            "$OUT"/* \
            > "$OUT/SHA256SUMS.txt"

          echo
          echo "===== FINAL BUILD ====="
          ls -lh "$OUT"

          echo
          echo "===== COMPATIBILITY LOG ====="
          cat "$W/logs/panther-compatibility.txt"

          echo
          echo "===== HARDWARE DETECTION ====="
          cat "$W/logs/panther-hardware-detection.txt"

      # ============================================================
      # 25. ARTIFACT
      # ============================================================

      - name: "📤 Upload artifacts"
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.output_name }}
          path: |
            workspace/output/*.img.xz
            workspace/output/*.zip
            workspace/output/SHA256SUMS.txt
            workspace/logs/*.txt
          retention-days: 14

      # ============================================================
      # 26. RELEASE
      # ============================================================

      - name: "🏷️ Create release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v$(date -u +%Y.%m.%d-%H%M%S)-${GITHUB_RUN_ID}"

          gh release create "$TAG" \
            workspace/output/*.img.xz \
            workspace/output/*.zip \
            workspace/output/SHA256SUMS.txt \
            workspace/logs/*.txt \
            --title "${{ inputs.output_name }}"
