      # ============================================================
      # 16C. DETECT REAL PANTHER HALS
      # ============================================================

      - name: "🔍 Detect Panther biometric / eSIM / KeyMint HALs"
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          ROOT="$SYSTEM_ROOT"

          REPORT="$W/logs/panther-hardware-detection.txt"

          : > "$REPORT"

          echo "===== PANTHER HARDWARE SERVICE DETECTION =====" | tee -a "$REPORT"

          find "$W/extracted" \
            -type f \
            \( \
              -iname '*fingerprint*' \
              -o -iname '*biometric*' \
              -o -iname '*keymint*' \
              -o -iname '*gatekeeper*' \
              -o -iname '*euicc*' \
              -o -iname '*secure_element*' \
              -o -iname '*nfc*' \
            \) \
            2>/dev/null |
            sort |
            tee -a "$REPORT" || true

          echo | tee -a "$REPORT"

          echo "===== KEYMINT =====" | tee -a "$REPORT"

          KEYMINT_FOUND=0

          if find "$W/extracted" \
              -type f \
              \( \
                -iname '*keymint*' \
                -o -iname '*keystore2*' \
              \) \
              2>/dev/null |
              grep -q .; then
            KEYMINT_FOUND=1
          fi

          if [ "$KEYMINT_FOUND" = "1" ]; then
            echo "Panther KeyMint implementation detected." |
              tee -a "$REPORT"

            cat >> "$ROOT/build.prop" <<'EOF'
          persist.sys.keymint.available=true
          persist.sys.keystore2.available=true
          EOF
          else
            echo "WARNING: Panther KeyMint binary not found in extracted partitions." |
              tee -a "$REPORT"
          fi

          echo "===== FINGERPRINT =====" | tee -a "$REPORT"

          FP_FOUND=0

          if find "$W/extracted" \
              -type f \
              \( \
                -iname '*fingerprint*' \
                -o -iname '*biometric*' \
              \) \
              2>/dev/null |
              grep -q .; then
            FP_FOUND=1
          fi

          if [ "$FP_FOUND" = "1" ]; then
            echo "Panther fingerprint implementation detected." |
              tee -a "$REPORT"

            cat >> "$ROOT/build.prop" <<'EOF'
          persist.sys.fingerprint.available=true
          persist.sys.udfps.available=true
          EOF
          else
            echo "WARNING: Panther fingerprint implementation not found." |
              tee -a "$REPORT"
          fi

          echo "===== EUICC =====" | tee -a "$REPORT"

          EUICC_FOUND=0

          if find "$W/extracted" \
              -type f \
              \( \
                -iname '*euicc*' \
                -o -iname '*euiccservice*' \
              \) \
              2>/dev/null |
              grep -q .; then
            EUICC_FOUND=1
          fi

          if [ "$EUICC_FOUND" = "1" ]; then
            echo "Panther eUICC implementation detected." |
              tee -a "$REPORT"

            cat >> "$ROOT/build.prop" <<'EOF'
          persist.sys.euicc.available=true
          persist.vendor.euicc.available=true
          EOF
          else
            echo "WARNING: Panther eUICC implementation not found." |
              tee -a "$REPORT"
          fi

          echo "===== FINAL HARDWARE STATUS =====" |
            tee -a "$REPORT"

          echo "KeyMint:    $KEYMINT_FOUND" |
            tee -a "$REPORT"

          echo "Fingerprint: $FP_FOUND" |
            tee -a "$REPORT"

          echo "eUICC:      $EUICC_FOUND" |
            tee -a "$REPORT"
            
