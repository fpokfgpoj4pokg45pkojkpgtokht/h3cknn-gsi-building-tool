
name: "🔧 Lunaris A16 GSI → Pixel 7 Panther BP4A (eSIM + UDFPS + KeyMint)"

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: "📥 Lunaris A16 GSI (.img.xz or .img)"
        required: true
        type: string
        default: "https://github.com/Doze-off/Lunaris-AOSP_gsi/releases/download/2026-09-20/Lunaris-3.12-GSI_treble_arm64-ab-GAPPS-Official-20260920.img.xz"

      output_name:
        description: "📛 Output image name"
        required: true
        type: string
        default: "Lunaris_Pixel7_BP4A_eSIM"

      fs_type:
        description: "💾 Output filesystem"
        required: true
        type: choice
        options:
          - ext4
          - erofs
        default: ext4

      factory_image_url:
        description: "📱 Exact Pixel 7 Panther BP4A factory ZIP"
        required: true
        type: string
        default: "https://dl.google.com/dl/android/aosp/panther-bp4a.251205.006-factory-4455f800.zip"

      inject_factory_props:
        description: "🧬 Import Panther BP4A system/product/system_ext properties"
        required: true
        type: boolean
        default: true

      inject_device_configs:
        description: "🧩 Import Panther hardware configs/VINTF/permissions/init"
        required: true
        type: boolean
        default: true

      inject_biometrics:
        description: "🔐 Import Panther UDFPS/fingerprint configuration"
        required: true
        type: boolean
        default: true

      inject_esim:
        description: "📶 Import Panther eUICC stack"
        required: true
        type: boolean
        default: true

      inject_framework_compat:
        description: "🧱 Add Android framework compatibility overlays/properties"
        required: true
        type: boolean
        default: true

      build_lunaris_sources:
        description: "🛠️ Build Lunaris source components when a compatible source tree is supplied"
        required: true
        type: boolean
        default: false

      lunaris_manifest_url:
        description: "Optional Lunaris manifest URL"
        required: false
        type: string
        default: "https://github.com/Lunaris-AOSP/android"

      lunaris_branch:
        description: "Lunaris source branch"
        required: true
        type: string
        default: "16.2"

      require_same_api:
        description: "🛡️ Fail if GSI/vendor API levels differ"
        required: true
        type: boolean
        default: true

jobs:
  port:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    permissions:
      contents: write

    env:
      TARGET_DEVICE: panther
      TARGET_MODEL: "Pixel 7"
      TARGET_BRAND: google
      TARGET_MANUFACTURER: Google
      TARGET_PLATFORM: gs201
      TARGET_ANDROID: "16"
      TARGET_SDK: "36"
      TARGET_BUILD: BP4A.251205.006
      TARGET_INCREMENTAL: "14401865"
      TARGET_FINGERPRINT: "google/panther/panther:16/BP4A.251205.006/14401865:user/release-keys"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: "📦 Checkout"
        uses: actions/checkout@v5

      # ============================================================
      # 2. DISK
      # ============================================================

      - name: "🧹 Free disk"
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift || true

          sudo docker system prune -af || true

          df -h

      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================

      - name: "⚙️ Install Android image tools"
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            android-sdk-libsparse-utils \
            e2fsprogs \
            erofs-utils \
            xz-utils \
            rsync \
            attr \
            xxd \
            file \
            unzip \
            zip \
            cpio \
            lz4 \
            zstd \
            jq \
            python3 \
            python3-pip \
            git \
            git-lfs \
            curl \
            wget \
            bc \
            fd-find \
            ccache

          git lfs install

      # ============================================================
      # 4. DIRECTORIES
      # ============================================================

      - name: "📁 Prepare workspace"
        run: |
          set -eux

          W="$GITHUB_WORKSPACE/workspace"

          mkdir -p \
            "$W/factory" \
            "$W/factory_mounts" \
            "$W/gsi" \
            "$W/gsi_mount" \
            "$W/patched" \
            "$W/output" \
            "$W/extracted" \
            "$W/pixel" \
            "$W/logs" \
            "$W/scripts"

      # ============================================================
      # 5. DOWNLOAD PIXEL FACTORY
      # ============================================================

      - name: "📱 Download Panther BP4A factory image"
        env:
          FACTORY_URL: ${{ inputs.factory_image_url }}
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          cd "$W/factory"

          curl \
            -fL \
            --retry 8 \
            --retry-delay 5 \
            --retry-all-errors \
            -o factory.zip \
            "$FACTORY_URL"

          EXPECTED="$(
            basename "${FACTORY_URL%%\?*}" |
            sed -nE 's/.*-factory-([0-9a-fA-F]{8})\.zip$/\1/p'
          )"

          if [ -n "$EXPECTED" ]; then
            ACTUAL="$(sha256sum factory.zip | cut -c1-8)"

            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::Factory ZIP checksum mismatch"
              echo "Expected: $EXPECTED"
              echo "Actual:   $ACTUAL"
              exit 1
            fi
          fi

          unzip -q factory.zip -d unpacked
          rm -f factory.zip

          IMAGE_ZIP="$(
            find unpacked \
              -type f \
              -name 'image-panther-*.zip' |
              head -n1
          )"

          if [ -z "$IMAGE_ZIP" ]; then
            echo "::error::No image-panther ZIP found"
            exit 1
          fi

          unzip -q "$IMAGE_ZIP" -d image

          echo "Factory contents:"
          find image -maxdepth 1 -type f -printf '%f\n' | sort

      # ============================================================
      # 6. VALIDATE FACTORY
      # ============================================================

      - name: "🔎 Validate Panther factory"
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          F="$W/factory/image"

          test -f "$F/vendor.img"
          test -f "$F/boot.img"
          test -f "$F/vendor_boot.img"
          test -f "$F/vbmeta.img"

          if [ ! -f "$F/system.img" ]; then
            echo "::error::Factory image has no system.img"
            exit 1
          fi

          echo "Panther factory validated."

      # ============================================================
      # 7. EXTRACT FACTORY PARTITIONS
      # ============================================================

      - name: "🧩 Extract Panther hardware partitions"
        if: ${{ inputs.inject_device_configs }}
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          F="$W/factory/image"
          X="$W/extracted"

          hex_at() {
            dd if="$1" bs=1 skip="$2" count="$3" 2>/dev/null |
              xxd -p
          }

          mount_partition() {
            local image="$1"
            local name="$2"
            local raw="$X/${name}.raw"
            local mount="$W/factory_mounts/$name"

            mkdir -p "$mount"

            if [ "$(hex_at "$image" 0 4)" = "ed26ff3a" ]; then
              simg2img "$image" "$raw"
              image="$raw"
            fi

            sudo mount -o loop,ro "$image" "$mount"

            echo "$mount"
          }

          # vendor
          if [ -f "$F/vendor.img" ]; then
            V="$(mount_partition "$F/vendor.img" vendor)"

            mkdir -p "$X/vendor"

            sudo rsync -aHAX \
              "$V/etc/vintf" \
              "$X/vendor/" || true

            sudo rsync -aHAX \
              "$V/etc/permissions" \
              "$X/vendor/" || true

            sudo rsync -aHAX \
              "$V/etc/init" \
              "$X/vendor/" || true

            sudo rsync -aHAX \
              "$V/etc/firmware" \
              "$X/vendor/" || true

            sudo rsync -aHAX \
              "$V/etc/bluetooth" \
              "$X/vendor/" || true

            sudo rsync -aHAX \
              "$V/etc/thermal" \
              "$X/vendor/" || true

            sudo rsync -aHAX \
              "$V/etc/gnss" \
              "$X/vendor/" || true

            sudo rsync -aHAX \
              "$V/etc/modem" \
              "$X/vendor/" || true

            sudo umount "$V"
          fi

          # ODM
          if [ -f "$F/odm.img" ]; then
            O="$(mount_partition "$F/odm.img" odm)"

            mkdir -p "$X/odm"

            sudo rsync -aHAX \
              "$O/etc/vintf" \
              "$X/odm/" || true

            sudo rsync -aHAX \
              "$O/etc/permissions" \
              "$X/odm/" || true

            sudo rsync -aHAX \
              "$O/etc/init" \
              "$X/odm/" || true

            sudo umount "$O"
          fi

          # vendor_dlkm
          if [ -f "$F/vendor_dlkm.img" ]; then
            VDK="$(mount_partition "$F/vendor_dlkm.img" vendor_dlkm)"

            mkdir -p "$X/vendor_dlkm"

            sudo rsync -aHAX \
              "$VDK/etc" \
              "$X/vendor_dlkm/" || true

            sudo rsync -aHAX \
              "$VDK/lib" \
              "$X/vendor_dlkm/" || true

            sudo rsync -aHAX \
              "$VDK/lib64" \
              "$X/vendor_dlkm/" || true

            sudo umount "$VDK"
          fi

          # system_dlkm
          if [ -f "$F/system_dlkm.img" ]; then
            SDK="$(mount_partition "$F/system_dlkm.img" system_dlkm)"

            mkdir -p "$X/system_dlkm"

            sudo rsync -aHAX \
              "$SDK/etc" \
              "$X/system_dlkm/" || true

            sudo rsync -aHAX \
              "$SDK/lib" \
              "$X/system_dlkm/" || true

            sudo rsync -aHAX \
              "$SDK/lib64" \
              "$X/system_dlkm/" || true

            sudo umount "$SDK"
          fi

          sudo chown -R "$USER:$USER" "$X"

      # ============================================================
      # 8. EXTRACT STOCK PROPERTIES
      # ============================================================

      - name: "🧬 Extract BP4A Panther properties"
        if: ${{ inputs.inject_factory_props }}
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          F="$W/factory/image"
          P="$W/pixel"

          mkdir -p "$P"

          hex_at() {
            dd if="$1" bs=1 skip="$2" count="$3" 2>/dev/null |
              xxd -p
          }

          extract_prop_partition() {
            local part="$1"
            local image="$F/$part.img"
            local raw="$P/${part}.raw"
            local mnt="$W/factory_mounts/prop_$part"

            [ -f "$image" ] || return 0

            mkdir -p "$mnt"

            if [ "$(hex_at "$image" 0 4)" = "ed26ff3a" ]; then
              simg2img "$image" "$raw"
              image="$raw"
            fi

            sudo mount -o loop,ro "$image" "$mnt"

            if [ -f "$mnt/build.prop" ]; then
              sudo cp "$mnt/build.prop" "$P/${part}.build.prop"
            fi

            if [ -f "$mnt/system/build.prop" ]; then
              sudo cp "$mnt/system/build.prop" "$P/${part}.system.build.prop"
            fi

            sudo umount "$mnt"
          }

          extract_prop_partition system
          extract_prop_partition system_ext
          extract_prop_partition product
          extract_prop_partition vendor
          extract_prop_partition odm

          sudo chown -R "$USER:$USER" "$P"

          cat "$P"/system.build.prop \
              "$P"/system_ext.build.prop \
              "$P"/product.build.prop \
              "$P"/vendor.build.prop \
              "$P"/odm.build.prop \
              2>/dev/null > "$P/all-props.txt" || true

          grep -E \
            '^(ro\.product|ro\.build|ro\.vendor|ro\.odm|ro\.hardware|ro\.boot|ro\.config)' \
            "$P/all-props.txt" \
            > "$P/panther-properties.txt" || true

      # ============================================================
      # 9. DOWNLOAD GSI
      # ============================================================

      - name: "📥 Download Lunaris GSI"
        env:
          ROM_URL: ${{ inputs.rom_url }}
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"

          curl \
            -fL \
            --retry 8 \
            --retry-delay 5 \
            --retry-all-errors \
            -o "$W/gsi/input" \
            "$ROM_URL"

          if xz -t "$W/gsi/input" 2>/dev/null; then
            xz -dc "$W/gsi/input" > "$W/gsi/system.img"
          else
            mv "$W/gsi/input" "$W/gsi/system.img"
          fi

          rm -f "$W/gsi/input"

      # ============================================================
      # 10. PREPARE GSI
      # ============================================================

      - name: "🧱 Prepare writable Lunaris system"
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"

          hex_at() {
            dd if="$1" bs=1 skip="$2" count="$3" 2>/dev/null |
              xxd -p
          }

          if [ "$(hex_at "$W/gsi/system.img" 0 4)" = "ed26ff3a" ]; then
            simg2img \
              "$W/gsi/system.img" \
              "$W/gsi/system.raw.img"

            mv \
              "$W/gsi/system.raw.img" \
              "$W/gsi/system.img"
          fi

          FS="unknown"

          if [ "$(hex_at "$W/gsi/system.img" 1080 2)" = "53ef" ]; then
            FS="ext4"
          elif [ "$(hex_at "$W/gsi/system.img" 1024 4)" = "e2e1f5e0" ]; then
            FS="erofs"
          fi

          echo "Detected GSI filesystem: $FS"

          if [ "$FS" = "unknown" ]; then
            echo "::error::Unknown GSI filesystem"
            exit 1
          fi

          mkdir -p "$W/gsi_mount"

          if [ "$FS" = "ext4" ]; then
            sudo mount \
              -t ext4 \
              -o loop,ro,noload \
              "$W/gsi/system.img" \
              "$W/gsi_mount"
          else
            sudo mount \
              -t erofs \
              -o loop,ro \
              "$W/gsi/system.img" \
              "$W/gsi_mount"
          fi

          USED="$(sudo du -sb "$W/gsi_mount" | cut -f1)"

          truncate \
            -s $((USED + USED / 5 + 768 * 1024 * 1024)) \
            "$W/patched/system.img"

          mkfs.ext4 \
            -q \
            -b 4096 \
            -L system \
            -O ^has_journal \
            "$W/patched/system.img"

          sudo mkdir -p "$W/patched/mnt"

          sudo mount \
            -o loop,rw \
            "$W/patched/system.img" \
            "$W/patched/mnt"

          sudo rsync \
            -aHAX \
            --numeric-ids \
            "$W/gsi_mount/" \
            "$W/patched/mnt/"

          sudo umount "$W/gsi_mount"

      # ============================================================
      # 11. LOCATE SYSTEM ROOT
      # ============================================================

      - name: "🔎 Locate Android system root"
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          ROOT="$W/patched/mnt"

          if [ -f "$ROOT/system/build.prop" ]; then
            echo "SYSTEM_ROOT=$ROOT/system" >> "$GITHUB_ENV"
          elif [ -f "$ROOT/build.prop" ]; then
            echo "SYSTEM_ROOT=$ROOT" >> "$GITHUB_ENV"
          else
            echo "::error::Lunaris system root not found"
            exit 1
          fi

      # ============================================================
      # 12. PATCH PIXEL PRODUCT IDENTITY
      # ============================================================

      - name: "📱 Apply exact Panther BP4A identity"
        if: ${{ inputs.inject_factory_props }}
        run: |
          set -euo pipefail

          ROOT="$SYSTEM_ROOT"
          BP="$ROOT/build.prop"

          cp "$BP" "$BP.lunaris-original"

          python3 <<'PY'
          from pathlib import Path

          bp = Path("$BP")
          lines = bp.read_text(errors="ignore").splitlines()

          values = {
              "ro.product.brand": "google",
              "ro.product.manufacturer": "Google",
              "ro.product.model": "Pixel 7",
              "ro.product.device": "panther",
              "ro.product.name": "panther",
              "ro.product.board": "gs201",

              "ro.product.product.brand": "google",
              "ro.product.product.manufacturer": "Google",
              "ro.product.product.model": "Pixel 7",
              "ro.product.product.device": "panther",
              "ro.product.product.name": "panther",

              "ro.product.system.brand": "google",
              "ro.product.system.manufacturer": "Google",
              "ro.product.system.model": "Pixel 7",
              "ro.product.system.device": "panther",
              "ro.product.system.name": "panther",

              "ro.product.vendor.brand": "google",
              "ro.product.vendor.manufacturer": "Google",
              "ro.product.vendor.model": "Pixel 7",
              "ro.product.vendor.device": "panther",
              "ro.product.vendor.name": "panther",

              "ro.build.product": "panther",
              "ro.build.device": "panther",
              "ro.build.brand": "google",
              "ro.build.manufacturer": "Google",
              "ro.build.model": "Pixel 7",

              "ro.build.version.release": "16",
              "ro.build.version.sdk": "36",
              "ro.build.version.security_patch": "2025-12-05",

              "ro.build.version.incremental": "14401865",

              "ro.build.fingerprint":
                  "google/panther/panther:16/BP4A.251205.006/14401865:user/release-keys",

              "ro.system.build.fingerprint":
                  "google/panther/panther:16/BP4A.251205.006/14401865:user/release-keys",

              "ro.product.first_api_level": "33",
          }

          out = []
          seen = set()

          for line in lines:
              if "=" in line and not line.startswith("#"):
                  key = line.split("=",1)[0]

                  if key in values:
                      out.append(f"{key}={values[key]}")
                      seen.add(key)
                      continue

              out.append(line)

          for k,v in values.items():
              if k not in seen:
                  out.append(f"{k}={v}")

          bp.write_text("\n".join(out) + "\n")
          PY

      # ============================================================
      # 13. PANTHER HARDWARE CONFIGURATION
      # ============================================================

      - name: "🧩 Add Panther compatibility configuration"
        if: ${{ inputs.inject_device_configs }}
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          ROOT="$SYSTEM_ROOT"

          mkdir -p \
            "$ROOT/etc/vintf" \
            "$ROOT/etc/permissions" \
            "$ROOT/etc/sysconfig" \
            "$ROOT/etc/init" \
            "$ROOT/etc/security"

          # Copy Panther framework-visible VINTF fragments.
          if [ -d "$W/extracted/vendor/vintf" ]; then
            sudo rsync -a \
              "$W/extracted/vendor/vintf/" \
              "$ROOT/etc/vintf/" || true
          fi

          if [ -d "$W/extracted/odm/vintf" ]; then
            sudo rsync -a \
              "$W/extracted/odm/vintf/" \
              "$ROOT/etc/vintf/" || true
          fi

          # Panther feature declarations.
          cat > "$ROOT/etc/permissions/panther.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <permissions>
              <feature name="android.hardware.telephony" />
              <feature name="android.hardware.telephony.gsm" />
              <feature name="android.hardware.camera" />
              <feature name="android.hardware.camera.autofocus" />
              <feature name="android.hardware.nfc" />
              <feature name="android.hardware.wifi" />
              <feature name="android.hardware.wifi.direct" />
              <feature name="android.hardware.bluetooth" />
              <feature name="android.hardware.fingerprint" />
              <feature name="android.hardware.telephony.euicc" />
          </permissions>
          XML

          # Pixel 7 is a 1080x2400 device.
          cat > "$ROOT/etc/sysconfig/panther.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <config>
              <allow-in-data-usage-save package="com.android.systemui" />
              <allow-in-power-save package="com.google.android.gms" />
              <allow-in-power-save package="com.google.android.apps.pixelmigrate" />
              <whitelisted-staged-installer package="com.android.vending" />
          </config>
          XML

          sudo chown -R 0:0 \
            "$ROOT/etc/permissions" \
            "$ROOT/etc/sysconfig"

          sudo chmod 644 \
            "$ROOT/etc/permissions/panther.xml" \
            "$ROOT/etc/sysconfig/panther.xml"

      # ============================================================
      # 14. UDFPS / LOCKSCREEN SUPPORT
      # ============================================================

      - name: "🔐 Configure Pixel 7 fingerprint / lockscreen stack"
        if: ${{ inputs.inject_biometrics }}
        run: |
          set -euo pipefail

          ROOT="$SYSTEM_ROOT"

          mkdir -p \
            "$ROOT/etc/permissions" \
            "$ROOT/etc/sysconfig" \
            "$ROOT/etc/security"

          cat > "$ROOT/etc/permissions/android.hardware.biometrics.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <permissions>
              <feature name="android.hardware.biometrics" />
              <feature name="android.hardware.fingerprint" />
          </permissions>
          XML

          # Do NOT invent a fake fingerprint HAL.
          #
          # Android's lockscreen works through:
          #
          # Settings/SystemUI
          #       ↓
          # BiometricPrompt/BiometricManager
          #       ↓
          # BiometricService
          #       ↓
          # vendor fingerprint HAL
          #       ↓
          # Trusty / KeyMint / Gatekeeper
          #
          # The real Panther HAL remains in the stock vendor/odm stack.

          cat > "$ROOT/etc/sysconfig/panther-biometric.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <config>
              <allow-in-power-save package="com.android.systemui" />
              <allow-in-power-save package="android" />
          </config>
          XML

          sudo chown 0:0 \
            "$ROOT/etc/permissions/android.hardware.biometrics.xml" \
            "$ROOT/etc/sysconfig/panther-biometric.xml"

          sudo chmod 644 \
            "$ROOT/etc/permissions/android.hardware.biometrics.xml" \
            "$ROOT/etc/sysconfig/panther-biometric.xml"

      # ============================================================
      # 15. ESIM
      # ============================================================

      - name: "📶 Import Panther eSIM/eUICC stack"
        if: ${{ inputs.inject_esim }}
        run: |
          set -euo pipefail

          W="$GITHUB_WORKSPACE/workspace"
          ROOT="$SYSTEM_ROOT"

          hex_at() {
            dd if="$1" bs=1 skip="$2" count="$3" 2>/dev/null |
              xxd -p
          }

          extract_partition() {
            local image="$1"
            local name="$2"
            local raw="$W/extracted/${name}.raw"
            local mount="$W/factory_mounts/euicc_$name"

            [ -f "$image" ] || return 1

            mkdir -p "$mount"

            if [ "$(hex_at "$image" 0 4)" = "ed26ff3a" ]; then
              simg2img "$image" "$raw"
              image="$raw"
            fi

            sudo mount -o loop,ro "$image" "$mount"
            echo "$mount"
          }

          for part in system_ext product system; do

            IMG="$W/factory/image/$part.img"

            [ -f "$IMG" ] || continue

            MNT="$(extract_partition "$IMG" "$part")" || continue

            SEARCH_ROOT="$MNT"

            [ -d "$MNT/system" ] && \
              SEARCH_ROOT="$MNT/system"

            for d in \
              "$SEARCH_ROOT/priv-app"/EuiccGoogle* \
              "$SEARCH_ROOT/priv-app"/EuiccSupportPixel* \
              "$SEARCH_ROOT/app"/EuiccGoogle* \
              "$SEARCH_ROOT/app"/EuiccSupportPixel*; do

              if [ -d "$d" ]; then

                REL="${d#"$SEARCH_ROOT"/}"

                mkdir -p \
                  "$ROOT/${part}/${REL%/*}"

                sudo rsync \
                  -aHAX \
                  "$d" \
                  "$ROOT/${part}/${REL%/*}/"

                echo "Injected eUICC: $part/$REL"
              fi
            done

            for d in \
              permissions \
              sysconfig; do

              if [ -d "$SEARCH_ROOT/etc/$d" ]; then

                mkdir -p \
                  "$ROOT/${part}/etc/$d"

                find \
                  "$SEARCH_ROOT/etc/$d" \
                  -maxdepth 1 \
                  -type f \
                  \( \
                    -iname '*euicc*' \
                    -o \
                    -iname '*telephony*' \
                  \) \
                  -exec sudo cp -a {} \
                    "$ROOT/${part}/etc/$d/" \; \
                  || true
              fi
            done

            sudo umount "$MNT"
          done

          mkdir -p "$ROOT/etc/permissions"

          cat > "$ROOT/etc/permissions/android.hardware.telephony.euicc.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <permissions>
              <feature name="android.hardware.telephony.euicc" />
          </permissions>
